}
function learnDone(){
  saveLearnSaq();

      ${peek.length?`<span class="tag">${peek.length} right after a peek</span>`:''}

      ${saqs.length?`<span class="tag">${saqs.length} written, self-marked</span>`:''}

    ${missed.map(({q,chk})=>row(q,chk.r.got>0&&SIT.ans[q.id]?'partial':'wrong',SIT.ans[q.id]?`${+chk.r.got.toFixed(1)}/${chk.r.tot}`:'skip')).join('')}
    ${peek.map(({q})=>row(q,'partial','peek')).join('')}
    ${saqs.map(({q,chk})=>row(q,'saq',`✍ ${+(chk.ticks.length*q.pts/q.saq.steps.length).toFixed(1)}/${q.pts}`)).join('')}
    <button class="btn primary wide" id="doneB">Back to home</button></div>`;
  $('#doneB').onclick=()=>{SV('miss',S.miss);SV('seen',S.seen);home();window.scrollTo(0,0)};
  SV('miss',S.miss);SV('seen',S.seen);
  window.scrollTo(0,0);

/* ── marking ───────────────────────────────────────────────────────── */
function markQ(q,a){
  if(q.type==='essay')return null; // self-marked
  if(!a)return{got:0,tot:q.pts,detail:'no answer'};
  if(q.type==='mcq'||q.type==='tf'||q.type==='multi'){
    const chosen=(a.sel||[]).map(i=>q.opts[i]);
    const right=chosen.length===q.key.length&&q.key.every(k=>chosen.includes(k));
    return{got:right?q.pts:0,tot:q.pts,you:chosen.map(o=>optLabel(q,o)).join(' · ')}}
  if(q.type==='match'){
    let got=0;q.pairs.forEach((p,i)=>{if((a.pick||{})[i]===p.right)got++});
    return{got:got*q.pts/q.pairs.length,tot:q.pts,you:q.pairs.map((p,i)=>(a.pick||{})[i]||'—').join(' · ')}}
  if(q.type==='cloze'){
    let got=0;
    q.blanks.forEach((b,i)=>{if(blankOK(q,b,(a.pick||{})[i]))got++});
    return{got:got*q.pts/q.blanks.length,tot:q.pts,you:q.blanks.map((b,i)=>(a.pick||{})[i]||'—').join(' · ')}}
}
/* dropdown: only her marked option is right. Typed: every accepted spelling is. */
function blankOK(q,b,v){
  /* phones type curly quotes; a trailing full stop is not a wrong answer */
  const nrm=s=>String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().replace(/[.]+$/,'');
  const x=nrm(v);if(!x)return false;
  const also=(b.also||[]).some(o=>nrm(o)===x);
  return q.bk==='dd' ? (x===nrm(b.correct)||also) : (b.options.some(o=>nrm(o)===x)||also);
}
function blankLabel(b,i){return b.ctx?`${b.ctx} ___`:(b.label&&!/^Answer \d+:?$/.test(b.label)?b.label.replace(/:$/,''):`Blank ${i+1}`)}
function mark(){
  clearInterval(timerIv);$('#footbar').classList.remove('on');

      if(r.got<r.tot)S.miss[q.id]=(S.miss[q.id]||0)+1;
      else if(S.miss[q.id])delete S.miss[q.id];
      rows.push({q,r})}
    else rows.push({q,r:null,saq:true});
  }
  SIT.auto={got,tot};
  const saqs=rows.filter(x=>x.saq);
  $('#view').innerHTML=`<div class="card">
    <div class="score-hero" id="hero"></div><div class="score-sub" id="heroSub"></div>
    ${saqs.length?`<div class="note">Tick each model step your written answer actually hit — the score updates as you go. Model answers are the tool’s, not Hannetjie’s.</div>`:''}
    <div class="rev-ctl"><label class="wo"><input type="checkbox" id="wrongOnly" ${rows.some(x=>x.saq||(x.r&&x.r.got<x.r.tot))?'checked':''}> Wrong only</label><span class="systally" id="systally"></span></div>
    ${rows.map(({q,r,saq},i)=>{
      const btn=(k,lbl)=>`<button class="qa" data-act="${k}">${lbl}</button>`;
      if(saq){const a=SIT.ans[q.id];
        return `<div class="qr saq" data-qid="${q.id}" data-sys="${q.sys}" data-wrong="1">
        <div class="qr-head"><span class="qr-mk mk-p" id="mk${i}">✍ /${q.pts}</span><span class="qr-stem">${esc(flatStem(q)).slice(0,140)}</span></div>
        ${a&&a.text?`<div class="you">You wrote: ${esc(a.text.slice(0,240)).replace(/\n/g,' ')}${a.text.length>240?'…':''}</div>`:'<div class="you">— no answer written —</div>'}
        <div class="steps">${q.saq.steps.map(s=>`<label><input type="checkbox" data-saq="${i}" data-pt="${q.pts/q.saq.steps.length}"> <span>${esc(s)}</span></label>`).join('')}</div>
        <div class="qr-acts"><span class="src">${esc(q.saq.src)}</span>${q.vid?btn('vid','▶ Video'):''}${refBtns(q,btn)}</div><div class="qr-pane" hidden></div></div>`}
      const pct=r.got/r.tot, cls=pct>=1?'right':pct>0?'partial':'wrong';
      return `<div class="qr ${cls}" data-qid="${q.id}" data-sys="${q.sys}" data-wrong="${pct<1?1:0}">
        <div class="qr-head"><span class="qr-mk">${(+r.got.toFixed(1))}/${r.tot}</span><span class="qr-stem">${esc(flatStem(q)).slice(0,140)}</span></div>
        <div class="qr-acts">${btn('ans','✓ Answer')}${q.vid?btn('vid','▶ Video'):''}${refBtns(q,btn)}</div>
        <div class="qr-pane" hidden></div></div>`}).join('')}
    ${weakSpotsHTML(rows)}
    <button class="btn primary wide" id="doneB">Save score & finish</button></div>`;
  const upd=()=>{
    let s=0;document.querySelectorAll('[data-saq]:checked').forEach(c=>s+=+c.dataset.pt);
    const saqTot=saqs.reduce((n,{q})=>n+q.pts,0);
    const g=got+s,t=tot+saqTot;
    $('#hero').textContent=`${+g.toFixed(1)} / ${t}`;
    $('#heroSub').textContent=`${Math.round(100*g/t)}% · ${SIT.label} · ${Math.round((Date.now()-SIT.t0)/60000)} min`;
    SIT.final={got:+g.toFixed(1),tot:t}};
  document.querySelectorAll('[data-saq]').forEach(c=>c.onchange=upd);upd();
  const wo=$('#wrongOnly'); if(wo){const f=()=>document.querySelectorAll('.qr').forEach(r=>{r.hidden=wo.checked&&r.dataset.wrong==='0'});wo.onchange=f;f();}
  {const ms={};rows.forEach(({q,r,saq})=>{if(!saq&&r&&r.got<r.tot)ms[q.sys]=(ms[q.sys]||0)+1});
   const t=$('#systally');if(t)t.innerHTML=Object.entries(ms).sort((a,b)=>b[1]-a[1]).map(([s,n])=>`<span class="tag">${SYS[s]||s} · ${n} missed</span>`).join('')||'<span class="tag ok">clean sweep ✓</span>';}
  $('#doneB').onclick=()=>{
    S.scores.push({t:Date.now(),mode:SIT.mode,label:SIT.label,got:SIT.final.got,tot:SIT.final.tot});
    SV('scores',S.scores);SV('miss',S.miss);SV('seen',S.seen);home();window.scrollTo(0,0)};
  SV('miss',S.miss);SV('seen',S.seen);
  window.scrollTo(0,0);
}
/* the explain row: her material first, then the right-sized video, then Ask AI.
   In a mock sitting only on wrong answers, never before the end; Learn mode brings
   the same row forward to the question itself. */
/* the review is an accordion: each question collapses to a mark + one-line stem, and
   the answer / video / slide open ON DEMAND below the row — never all at once. */
/* one reference, by kind: her slide is the rendered image (or, for a deck never rendered,
   the slide's own words); her prose and Patton are the sentence(s) the judge quoted,
   verbatim, with the source named. Every reference in the bank was judged to STATE the
   keyed fact and carries a quote re-found in the source at build time — same standard as
   the videos. Where Patton and Hannetjie disagree, she wins: her references sit above his. */
function refHTML(r){
  if(r.k==='slide'&&r.slide)return `<div class="refq slide"><a href="img/slides/${r.slide}" target="_blank" rel="noopener"><img class="slideimg" src="img/slides/${r.slide}" alt="her slide" loading="lazy"></a><span class="refsrc">📖 ${esc(r.src)} — tap to open full size</span></div>`;
  if(r.k==='patton')return `<div class="refq patton">📕 <i>“${esc(r.t)}”</i><span class="refsrc"> — ${esc(r.src)}${r.fig?` · Figure ${esc(r.fig)}${r.assigned?' (a figure she set in her learning page)':''}`:''}</span></div>`;
  return `<div class="refq">${REF[r.k].ic} <i>“${esc(r.t)}”</i><span class="refsrc"> — ${esc(r.src)}</span></div>`;
}
function refsHTML(q){ return q.refs.length?q.refs.map(refHTML).join(''):''; }
function refBtns(q,btn){ return q.refs.map(r=>btn(r.k,`${REF[r.k].ic} ${REF[r.k].lbl}`)).join(''); }
function paneHTML(q,act){
  if(act==='vid')return q.vid?vidClipHTML(q.vid)+(q.vid.alt?vidRowHTML(q.vid.alt,'also · '):''):'';
  if(REF[act]){const r=q.refs.find(x=>x.k===act);return r?refHTML(r):''}
  return keyHTML(q,SIT.ans[q.id])+`<button class="btn ghost askai" data-ask="${q.id}">🤖 Copy for AI</button>`;
}
/* a video link opens at the moment its captions say the tested point is taught —
   `at` is where the verifying quote was found, not a guess */
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const CHAN={nn:'Ninja Nerd',iha:'Institute of Human Anatomy',az:'AnatomyZone',ah:'Armando Hasudungan'};
/* after a wrong answer the matched video is embedded and CUED to the ~2-min stretch
   that teaches the point; it stops at `end`. A button reloads it as the full video so
   you never have to leave for the playlist page. */
function vidClipHTML(v){
  const at=Number.isInteger(v.at)?v.at:0, end=Number.isInteger(v.end)&&v.end>at?v.end:at+120;
  const who=CHAN[v.ch]||'Dr Matt &amp; Dr Mike', cm=Math.max(1,Math.round((end-at)/60));
  return `<div class="vclip" data-id="${v.id}" data-at="${at}" data-end="${end}">
    <div class="vframe"><img class="vposter" loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt=""><button class="vplay" aria-label="Play the clip">▶</button><span class="vbadge">▶ ${mmss(at)}–${mmss(end)} · ~${cm} min</span></div>
    <div class="vmeta"><span class="vch">${who}</span><a href="https://www.youtube.com/watch?v=${v.id}&t=${at}s" target="_blank" rel="noopener">${esc(v.t)}</a><span class="refsrc">${esc(v.d)}</span><button class="btn ghost vfull">▶ Watch the full video</button></div>
  </div>`;
}
function loadVid(c,at,end){
  const src='https://www.youtube.com/embed/'+c.dataset.id+'?start='+at+(end?'&end='+end:'')+'&rel=0&modestbranding=1&autoplay=1';
  c.querySelector('.vframe').innerHTML='<iframe src="'+src+'" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
}
function vidRowHTML(v,who){
  who=who??(({nn:'Ninja Nerd',iha:'Institute of Human Anatomy',az:'AnatomyZone',ah:'Armando Hasudungan'}[v.ch]||'Dr Matt &amp; Dr Mike')+' · ');
  const at=Number.isInteger(v.at)?v.at:0;
  return `<div class="vidrow">▶ <a href="https://www.youtube.com/watch?v=${v.id}${at?`&t=${at}s`:''}" target="_blank" rel="noopener">${esc(v.t)}</a> <span class="refsrc">${who}${esc(v.d)}${at?` · from ${mmss(at)}`:''}</span></div>`;
}
function weakSpotsHTML(rows){
  const missed=rows.filter(x=>!x.saq&&x.r&&x.r.got<x.r.tot).map(x=>x.q);
  if(missed.length<3)return '';
  const vids=new Map();
  for(const q of missed) if(q.vid){ if(!vids.has(q.vid.id)) vids.set(q.vid.id,q.vid); if(q.vid.alt&&!vids.has(q.vid.alt.id)) vids.set(q.vid.alt.id,q.vid.alt); }
  if(!vids.size)return '';
  const bySys={};for(const q of missed)bySys[q.sys]=(bySys[q.sys]||0)+1;
  const worst=Object.entries(bySys).sort((a,b)=>b[1]-a[1])[0];
  return `<div class="note" style="border-left-color:var(--primary)">
    <b>Weak spots this mock test</b> — ${missed.length} missed, most in ${SYS[worst[0]]||worst[0]}.
    Watch these before your next sitting:
    ${[...vids.values()].slice(0,4).map(v=>vidRowHTML(v)).join('')}
    <div class="refsrc">Each video was matched to its question from the video's own captions and checked twice, and the link opens where that point is taught. Where a video and Hannetjie disagree, she wins.
    <a href="https://jeremyspm.github.io/hs2-videos.html" target="_blank" rel="noopener">All 148 by topic ↗</a></div></div>`;
}
/* readable key rendering: matching and cloze get one ROW per part, wrong parts
   annotated with what you picked — never a run-on paragraph */
function keyHTML(q,a){
  if(q.type==='match')return `<div class="keyrows">${q.pairs.map((p,i)=>{
    const yours=(a&&a.pick||{})[i];const wrong=yours&&yours!==p.right;
    return `<div class="krow ${yours===p.right?'kok':''}">${esc(p.left)} <b>→ ${esc(p.right)}</b>${wrong?` <span class="kyou">you: ${esc(yours)}</span>`:yours?'':' <span class="kyou">unanswered</span>'}</div>`}).join('')}</div>`;
  if(q.type==='cloze')return `<div class="keyrows">${q.blanks.map((b,i)=>{
    const yours=(a&&a.pick||{})[i];
    const right=blankOK(q,b,yours);
    const alt=q.bk==='fib'&&b.options.length>1?` <span class="refsrc">(also accepted: ${esc(b.options.filter(o=>o!==b.correct).join(', '))})</span>`:'';
    return `<div class="krow ${right?'kok':''}">${esc(blankLabel(b,i))} <b>→ ${esc(b.correct)}</b>${alt}${yours&&!right?` <span class="kyou">you: ${esc(yours)}</span>`:yours?'':' <span class="kyou">unanswered</span>'}</div>`}).join('')}</div>`;
  return `<div class="keyline">Key: ${esc(keyText(q))}</div>`;
}
function keyText(q){
  if(q.type==='match')return q.pairs.map(p=>`${p.left} → ${p.right}`).join(' · ');
  if(q.type==='cloze')return q.blanks.map(b=>b.correct).join(' · ');
  return (q.key||[]).map(o=>optLabel(q,o)).join(' · ');
}
/* bare-letter options carry their text from the stem's lettered list (build-time) */
function optLabel(q,o){return q.ol&&q.ol[o]?`${o}. ${q.ol[o]}`:o}
/* the flat stem carries Canvas's literal "[ Select ]" where each dropdown sat */
const flatStem=q=>q.qt||String(q.q||'').replace(/\[ Select \]/g,'____');
/* ── chrome ────────────────────────────────────────────────────────── */
$('#countdown').textContent=`${daysLeft()}d to Test 2`;
$('#themeBtn').onclick=()=>{const r=document.documentElement;
  const to=r.dataset.theme==='light'?'':'light';
  to?r.dataset.theme='light':delete r.dataset.theme;SV('theme',to)};
if(LS('theme')==='light')document.documentElement.dataset.theme='light';
$('#helpBtn').onclick=()=>{$('#help').innerHTML=`
  <h2 style="margin-top:0">What is this?</h2>
  <p>Every practice quiz Hannetjie posted for Module 2 (MS · NS · Endocrine), unlocked: sit them as
  often as you like, marked instantly — or let the tool deal you mixed mock tests from the whole bank.
  Test 2 is <b>21 Sept · 42 questions · 22% written · 65 min</b>, covering weeks 5–8 plus the
  car-accident case study.</p>
  <h3>Where the questions come from</h3>
  <p>${DATA.stats.n} questions captured from ${DATA.quizzes.length} of her own Canvas quizzes, answer keys
  extracted from the graded pages — nothing invented. Written questions have <b>model answers written by
  this tool</b> (Canvas publishes none); they follow her one-mark-per-step marking style and each names
  its source deck. Warm-up chains are scaffolds built from her decks, not her material.</p>
  <h3>Learn mode</h3>
  <p><b>Learn as you go</b> (and the <b>Learn</b> button beside each quiz) marks every question the moment you
  press Check and shows the answer, her slide or notes, the Patton passage and the matched video right there —
  you can open any of them before answering. Check with nothing picked just shows you. Nothing from Learn mode
  goes on the score chart; a wrong or skipped question still joins your misses pile, and a right answer after a
  peek does not clear it. <b>Sit</b> is the test version: the same questions, nothing shown until the end.</p>
  <h3>Where the explanations come from</h3>
  <p>Every reference under a question was checked to <b>state the keyed fact</b>, not just share its topic: each
  of her slides, learning-page paragraphs, Anatomy Monday answers, the lab workbook and the Module 2 chapters of
  Patton (11–26) was shortlisted by keyword, read by a model that had to quote the exact words that state the
  answer, that quote was re-found in the source by a script, and a second pass tried to knock each match down.
  ${DATA.stats.withRef} of the ${DATA.stats.n} questions carry at least one — ${DATA.stats.withHer} from her own
  material, ${DATA.stats.withPatton} with a Patton passage (${DATA.stats.pattonOnly} have only Patton). A question with
  nothing is a question nothing states outright, and no reference beats a wrong one. Patton passages are short
  excerpts (a sentence or two, never more than 70 words) from <i>Patton &amp; Thibodeau, Anatomy &amp; Physiology,
  9th ed.</i> (Elsevier, 2016), quoted for study with the page named; the course’s ClinicalKey copy is the 2019
  edition, so figure numbers may differ. Where Patton and Hannetjie disagree, she wins.</p>
  <h3>What’s held out</h3>
  <p>${DATA.held.length} questions are excluded (image or format did not survive capture) — listed in the
  repo. Two quizzes are still locked on Canvas (Module Review B, Formative 2) and join when they open.</p>
  <h3>Your data</h3>
  <p>Scores and misses live in this browser only. Nothing is sent anywhere. Clearing site data wipes them.</p>
  <h3>For whoever maintains this</h3>
  <p>Built by <code>build.mjs</code> from <code>hs2-anki/m2/questions.json</code> (parsed Canvas captures).
  Rebuild: <code>node build.mjs</code>. Bank built ${DATA.built}. Multi-answer questions mark all-or-nothing;
  matching and dropdowns mark per part.</p>
  <button class="btn primary wide" onclick="this.closest('dialog').close()">Close</button>`;
  $('#help').showModal()};
document.addEventListener('click',e=>{
  const vf=e.target.closest('.vfull'); if(vf){const c=vf.closest('.vclip');loadVid(c,+c.dataset.at,null);return}
  const fr=e.target.closest('.vframe'); if(fr&&!fr.querySelector('iframe')){const c=fr.closest('.vclip');loadVid(c,+c.dataset.at,+c.dataset.end);return}
  const qa=e.target.closest('.qa'); if(qa){const row=qa.closest('.qr,.lres'),pane=row.querySelector('.qr-pane'),act=qa.dataset.act,open=pane.dataset.act===act&&!pane.hidden;row.querySelectorAll('.qa').forEach(b=>b.classList.toggle('on',b===qa&&!open));if(open){pane.hidden=true;pane.dataset.act='';return}
    const q=SIT.deck.find(x=>x.id===row.dataset.qid);
    /* opening a resource on an unchecked learn-mode question is a peek */
    if(row.classList.contains('lres')&&!SIT.chk[q.id])SIT.peek[q.id]=true;
    pane.innerHTML=paneHTML(q,act);pane.hidden=false;pane.dataset.act=act;return}
  if(e.target.dataset&&e.target.dataset.ask){
    const q=SIT.deck.find(x=>x.id===e.target.dataset.ask);
    const a=SIT.ans[q.id];
    const you=a?(a.text||((a.sel||[]).map(i=>q.opts[i]).join(', ')||Object.values(a.pick||{}).join(', '))):'(no answer)';
    const prompt=`I'm a first-year nursing student studying for an anatomy & physiology test. I got this practice question wrong and want to understand the concept, not just the answer.\n\nQuestion: ${flatStem(q)}\n`+(q.opts?`Options: ${q.opts.join(' | ')}\n`:'')+`Correct answer: ${keyText(q)}\nMy answer: ${you}\n\nExplain why the correct answer is right, step by step, and what misconception my answer suggests.`;
    const btn=e.target, done=ok=>{btn.textContent=ok?'Copied ✓ paste into any AI chat':'Copy blocked — long-press the text to copy';
      setTimeout(()=>btn.textContent='🤖 Copy for AI',3000)};
    (navigator.clipboard?navigator.clipboard.writeText(prompt):Promise.reject())
      .then(()=>done(true))
      .catch(()=>{const ta=document.createElement('textarea');ta.value=prompt;ta.style.position='fixed';ta.style.opacity='0';
        document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}
        ta.remove();done(ok)});
    return}
  if(e.target.id==='shareBtn'){
  const l=S.scores[S.scores.length-1];
  const line=`HS2 Paper Sim — ${l.got}/${l.tot} (${Math.round(100*l.got/l.tot)}%) · ${l.label} · ${daysLeft()}d to Test 2`;
  navigator.clipboard&&navigator.clipboard.writeText(line);
  e.target.textContent='Copied ✓';setTimeout(()=>e.target.textContent='Copy score line',1500)}});
home();
</script>
