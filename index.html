<title>HS2 · Paper Sim — Module 2</title>
<style>
/* ── estate tokens (house.css contract, dark default) ─────────────── */
:root{
  --bg:hsl(225 33% 5%); --fg:hsl(225 31% 95%); --card:hsl(224 44% 10%);
  --primary:hsl(218 91% 64%); --onprimary:hsl(225 33% 5%);
  --muted:hsl(220 38% 13%); --muted-fg:hsl(218 19% 67%);
  --accent:hsl(219 40% 18%); --danger:hsl(0 84% 60%); --ok:hsl(158 64% 42%);
  --warn:hsl(38 92% 55%); --border:hsl(222 27% 19%); --radius:.625rem;
  --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
}
:root[data-theme=light]{
  --bg:hsl(214 47% 97%); --fg:hsl(222 47% 11%); --card:hsl(0 0% 100%);
  --onprimary:#fff; --muted:hsl(215 40% 93%); --muted-fg:hsl(220 12% 40%);
  --accent:hsl(216 45% 91%); --border:hsl(215 33% 89%); --warn:hsl(38 92% 40%);
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:1rem;margin:0;flex:1;font-weight:700}
header .d{color:var(--muted-fg);font-size:.8rem;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border:1px solid var(--border);background:var(--muted);color:var(--fg);
  border-radius:var(--radius);padding:10px 14px;font:inherit;font-weight:600;
  transition:background var(--dur) var(--ease)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.btn.ghost{background:transparent}
.btn.wide{width:100%;margin-top:8px}
a.btn{text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.door h2{margin:.1rem 0 .3rem;font-size:1.02rem}
.door p{margin:.2rem 0 .6rem;color:var(--muted-fg);font-size:.88rem}
.qlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
/* a quiz row: tag + name, then count + Learn + Sit as one group that drops to a
   second line at phone width instead of squeezing the name into four lines */
.qrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 10px;background:var(--muted)}
.qrow b{flex:1 1 150px;font-size:.86rem;font-weight:600}
.qrow .m{color:var(--muted-fg);font-size:.76rem;white-space:nowrap}
.qrow .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.sysrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--muted-fg)}
.tag.ms{color:hsl(28 90% 62%)}.tag.ns{color:hsl(268 80% 74%)}.tag.endo{color:hsl(158 64% 52%)}
.tag.mixed{color:var(--muted-fg)}
/* sitting */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qhead .n{font-weight:700}
.qhead .timer{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted-fg)}
.qhead .timer.low{color:var(--danger);font-weight:700}
.stem{white-space:pre-wrap;margin-bottom:10px}
.stem img,.qimg{max-width:100%;border-radius:8px;background:#fff;display:block;margin:8px 0}
/* structured stem: her paragraphs, lists and table rows survive; a Canvas layout
   table becomes stacked cells at phone width and side-by-side from 560px */
.stem.rich{white-space:normal;line-height:1.5}
.stem.rich p{margin:.4em 0}
.stem.rich ul,.stem.rich ol{margin:.3em 0;padding-left:1.35em}
.stem.rich li{margin:.15em 0}
.stem.rich li>p{margin:.1em 0}
.stem.rich div{margin:.15em 0}
.stem.rich .tbl{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.stem.rich .tr{display:flex;flex-wrap:wrap;gap:8px 14px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--muted)}
.stem.rich .td{flex:1 1 220px;min-width:0}
.stem.rich .td>p:first-child{margin-top:0}
.stem.rich .td img{margin:0 0 4px;max-height:280px;width:auto}
.stem.rich img{max-height:520px;width:auto}
.inl{display:inline-block;width:auto;max-width:100%;padding:5px 8px;margin:2px 0;vertical-align:baseline;
  font-size:.95em;border:1px solid var(--primary);background:var(--card);color:var(--fg);border-radius:6px}
input.inl{min-width:7ch}
.inl:focus{outline:2px solid var(--primary);outline-offset:1px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;margin:6px 0;cursor:pointer;background:var(--muted)}
.opt input{margin-top:3px;flex:none}
.opt.sel{border-color:var(--primary);background:var(--accent)}
/* learn mode: a checked question locks and colours itself in place */
.opt.k{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.x{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.opt.lock{cursor:default}
.lres{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0}
.lres .hint{font-size:.76rem;color:var(--muted-fg)}
.lres .qr-pane{flex-basis:100%;padding:6px 0 0}
.mk .verdict{font-weight:700;margin:0 0 4px}
.mk.right .verdict{color:var(--ok)} .mk.wrong .verdict{color:var(--danger)} .mk.saq{border-color:var(--primary)}
.pip.ok{background:var(--ok);border-color:var(--ok)} .pip.bad{background:var(--danger);border-color:var(--danger)}
.qrow .btn{padding:6px 10px;font-size:.8rem}
.qrow .btn.learn{border-color:var(--primary);color:var(--primary)}
.blankrow{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.blankrow label{font-size:.82rem;color:var(--muted-fg)}
select,input[type=text],textarea{font:inherit;color:var(--fg);background:var(--muted);
  border:1px solid var(--border);border-radius:8px;padding:9px;width:100%}
textarea{min-height:120px}
.pips{display:flex;gap:3px;flex-wrap:wrap;margin:10px 0 2px}
.pip{width:14px;height:6px;border-radius:3px;background:var(--muted);border:1px solid var(--border)}
.pip.done{background:var(--primary);border-color:var(--primary)}
.pip.cur{outline:2px solid var(--primary);outline-offset:1px}
/* marking */
.mk{border-left:4px solid var(--border);padding-left:10px;margin:14px 0}
.mk.right{border-color:var(--ok)}.mk.wrong{border-color:var(--danger)}
.mk .you{color:var(--muted-fg);font-size:.9rem}
.mk .keyline{color:var(--ok);font-weight:600}
.mk .marks{font-size:.8rem;color:var(--muted-fg)}
.steps label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.refq{font-size:.85rem;color:var(--muted-fg);margin:8px 0 2px;padding:8px 10px;background:var(--muted);border-radius:8px}
.refq.slide{padding:6px}
.refq.patton{border-left:3px solid var(--primary)}
.refq i{color:var(--fg)}
.slideimg{max-width:100%;background:#fff;border-radius:6px;display:block;margin:0 0 4px}
.keyrows{margin:6px 0}
.krow{font-size:.85rem;padding:3px 0;border-bottom:1px dashed var(--border)}
.krow b{color:var(--ok);font-weight:600}
.krow.kok{opacity:.55}
.kyou{color:var(--danger);font-size:.78rem}
.refsrc{font-size:.74rem;color:var(--muted-fg);opacity:.8}
.vidrow{font-size:.86rem;margin:6px 0}
.vidrow a{font-weight:600}
.askai{padding:3px 10px;font-size:.76rem;margin-top:6px}
.vclip{margin:.5rem 0}
.vframe{position:relative;aspect-ratio:16/9;width:100%;max-width:460px;background:#000;border-radius:8px;overflow:hidden;cursor:pointer}
.vframe img,.vframe iframe{width:100%;height:100%;display:block;border:0;object-fit:cover}
.vplay{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:rgba(20,20,28,.72);color:#fff;border:2px solid #fff;font-size:1.3rem;cursor:pointer;line-height:1}
.vbadge{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:.72rem;padding:2px 6px;border-radius:4px;pointer-events:none}
.vmeta{font-size:.82rem;margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.vch{font-weight:600}
.vfull{padding:2px 8px;font-size:.74rem}
.rev-ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 10px;font-size:.85rem}
.rev-ctl .wo{display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
.systally{display:flex;flex-wrap:wrap}
.systally .tag{display:inline-block;background:var(--muted);padding:2px 9px;border-radius:11px;margin:2px 5px 2px 0;font-size:.74rem}
.systally .tag.ok{color:var(--ok)}
.qr{border:1px solid var(--muted);border-left-width:4px;border-radius:9px;margin:6px 0;background:var(--card)}
.qr.right{border-left-color:var(--ok)} .qr.partial{border-left-color:var(--warn)} .qr.wrong{border-left-color:var(--danger)} .qr.saq{border-left-color:var(--primary)}
.qr-head{display:flex;gap:10px;align-items:flex-start;padding:9px 11px 7px}
.qr-mk{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding:2px 8px;border-radius:6px;font-size:.82rem;background:var(--muted)}
.qr.right .qr-mk{background:var(--ok);color:var(--onprimary)} .qr.partial .qr-mk{background:var(--warn);color:var(--onprimary)} .qr.wrong .qr-mk{background:var(--danger);color:#fff}
.qr-stem{font-size:.9rem;line-height:1.35;flex:1}
.qr-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 11px 9px}
.qa{padding:3px 11px;font-size:.77rem;border:1px solid var(--muted);border-radius:14px;background:transparent;color:inherit;cursor:pointer}
.qa:hover{border-color:var(--primary)} .qa.on{background:var(--primary);color:var(--onprimary);border-color:var(--primary)}
.qr-pane{padding:2px 11px 11px}
.qr .src{font-size:.72rem;color:var(--primary);margin-right:auto;opacity:.85}
.qr .you{font-size:.8rem;padding:2px 11px 4px;opacity:.85}
.qr .steps{padding:2px 11px 6px}
.score-hero{font-size:2.2rem;font-weight:800;text-align:center;margin:.3rem 0 0}
.score-sub{text-align:center;color:var(--muted-fg);margin:0 0 10px}
/* chart */
.spark{width:100%;height:84px;display:block}
.hist{font-size:.82rem;color:var(--muted-fg)}
.hist td{padding:2px 8px 2px 0}
/* chain warmup */
.chain{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.bead{background:var(--accent);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:.9rem}
.bead.blank{border-style:dashed;color:var(--warn);text-align:center}
.verb{color:var(--muted-fg);font-size:.78rem;padding:0 12px}
.note{border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;
  padding:8px 10px;font-size:.84rem;color:var(--muted-fg);margin:10px 0}
.src{font-size:.75rem;color:var(--muted-fg);margin-top:6px}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--border);
  border-radius:var(--radius);max-width:640px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgb(0 0 0 / .6)}
h3{margin:14px 0 4px;font-size:.95rem}
.footbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
  border-top:1px solid var(--border);padding:10px 14px;display:none;gap:8px;z-index:5}
.footbar.on{display:flex}
.footbar .btn{flex:1}
a{color:var(--primary)}
</style>

al fasting blood glucose level (mmol/L)?","type":"essay","saq":{"steps":["About 4–6 mmol/L when fasting."],"src":"Model answer is the tool’s · from Endocrine 2 / blood sugar quiz"}},{"id":"q2bb9e1f8d4","quiz":"211018","sys":"endo","pts":1,"q":"What is the stimulus for the release of insulin?","imgs":[],"qh":"<p>What is the stimulus for the release of insulin?</p>","qt":"What is the stimulus for the release of insulin?","type":"essay","saq":{"steps":["Rising blood glucose (e.g. after a meal) — a humoral stimulus acting directly on the beta cells."],"src":"Model answer is the tool’s · from Endocrine 2 deck"},"vid":{"id":"ksomgJMqxgI","t":"Insulin Secretion","d":"15:00","at":94,"alt":{"id":"zJu6CsuFSpg","t":"Introduction to the Endocrine System","d":"34:00","at":1023}},"refs":[{"k":"slide","src":"2026 Endocrine 2 Thyroid, Adrenal, etc. deck · slide 30","slide":"2026-Endocrine-2-Thyroid-Adrenal-etc-30.jpg"}]},{"id":"q467ea923ca","quiz":"211018","sys":"endo","pts":5,"q":"Explain how the body maintains the blood glucose levels within the normal range. (You may wish to refer to figure 16.18 “Regulation of blood glucose levels by insulin and glucagon from the Pancreas”, in your Human Anatomy & Physiology textbook by Marieb).","imgs":[],"qh":"<p>Explain how the body maintains the blood glucose levels within the normal range.</p> <p>(You may wish to refer to figure 16.18 “Regulation of blood glucose levels by insulin and glucagon from the Pancreas”, in your Human Anatomy &amp; Physiology textbook by Marieb).</p>","qt":"Explain how the body maintains the blood glucose levels within the normal range. (You may wish to refer to figure 16.18 “Regulation of blood glucose levels by insulin and glucagon from the Pancreas”, in your Human Anatomy & Physiology textbook by Marieb).","type":"essay","saq":{"steps":["Glucose rises → beta cells release insulin.","Insulin drives uptake into muscle and adipose tissue and glycogen storage in the liver → glucose falls.","Glucose falls → alpha ce The<a href=\"https://www.visiblebody.com/blog/biomechanics-lever-systems-in-the-body\" target=\"_blank\" rel=\"noopener\"> linked website </a>explains the concept well.</p>","qt":"Briefly explain how muscles, bones and joints work together to produce movement. The linked website explains the concept well.","type":"essay","saq":{"steps":["A skeletal muscle attaches to two bones across a joint (origin on the stationary bone, insertion on the moving one).","The muscle can only PULL: it contracts and pulls the insertion toward the origin.","The joint acts as the fulcrum of a lever system, so the bone moves around it."],"src":"Model answer is the tool’s · from MS2/MS3 decks"},"vid":{"id":"23X5bX2yobw","t":"Triceps Workout | Functional Anatomy","d":"6:24","at":106,"alt":{"id":"K2kHnb1x7cE","t":"Smooth Muscle vs. Skeletal Muscle","d":"16:19","at":245}},"refs":[{"k":"patton","src":"Patton 9e · Ch 15 Axial Muscles · p. 318","t":"Bones serve as levers, and joints serve as fulcrums of these levers. A contracting muscle applies a pulling force on a bone lever at the point of the muscle’s attachment to the bone (Box 15-1).","pp":318,"ch":15}]},{"id":"qbe47500953","quiz":"211033","sys":"ms","pts":6,"q":"List the ways in which skeletal muscles are named. Provide examples for each. The video may be helpful.","imgs":[],"qh":"<p>List the ways in which skeletal muscles are named. Provide examples for each. The video may be helpful.</p> <p><a class=\"vid\" href=\"https://www.youtube.com/watch?v=p8t1IJZnl-8\" target=\"_blank\" rel=\"noopener\">▶ Major Muscle Song Anatomy Mnemonics: Location, Action, Name of Muscles</a></p>","qt":"List the ways in which skeletal muscles are named. Provide examples for each. The video may be helpful. ▶ Major Muscle Song Anatomy Mnemonics: Location, Action, Name of Muscles","type":"essay","saq":{"steps":["Location — tibialis anterior.","Shape — deltoid (triangle), trapezius.","Size — gluteus maximus.","Fibre direction — rectus abdominis (rectus = straight).","Number of origins — biceps, triceps.","Origin/insertion — sternocleidomastoid.","Action — flexor carpi, extensor digitorum."],"src":"Model answer is the tool’s · from MS2 deck (ways muscles are named)"},"refs":[{"k":"patton","src":"Patton 9e · Ch 15 Axial Muscles · p. 322","t":"The deltoid (triangular) muscle covering the shoulder is deltoid, or triangular, in shape (Table 15-4). Direction of fibers.","pp":322,"ch":15}]},{"id":"q381b50fd31","quiz":"211033","sys":"ms","pts":2,"q":"Explain the difference between tendons and ligaments in terms of structure and function. Tendons Ligaments","imgs":["HS2IMG-8938830.png","HS2IMG-8938831.png"],"qh":"<p>Explain the difference between tendons and ligaments in terms of structure and function.</p> <div class=\"tbl\"><div class=\"tr\"><div class=\"td\">Tendons [[IMG:HS2IMG-8938830.png]]</div> <div class=\"td\">Ligaments [[IMG:HS2IMG-8938831.png]]</div></div></div>","qt":"Explain the difference between tendons and ligaments in terms of structure and function. Tendons Ligaments","type":"essay","saq":{"steps":["Tendon: dense regular connective tissue joining MUSCLE to BONE — transmits the muscle’s pull.","Ligament: dense connective tissue joining BONE to BONE — stabilises the joint and limits its range."],"src":"Model answer is the tool’s · from MS1 deck / Lab 3"}},{"id":"qa65aab16cd","quiz":"211033","sys":"ms","pts":3,"q":"The elbow, the joints between the vertebrae, and the bones that form the cranium are all joints given different functional names. What are these names, and what characteristics distinguish one from another? A synovial joint Fibrous joint- e.g. sutures in skull Cartilaginous joints between vertebrae","imgs":["HS2IMG-8938835.png","HS2IMG-8938841.jpg","HS2IMG-8938845.jpg"],"qh":"<p>The elbow, the joints between the vertebrae, and the bones that form the cranium are all joints given different functional names. What are these names, and what characteristics distinguish one from another?</p> <div class=\"tbl\"><di 1055","sys":"endo","pts":1,"q":"What is the normal fasting blood glucose level (mmol/L)?","imgs":[],"qh":"<p>What is the normal fasting blood glucose level (mmol/L)?</p>","qt":"What is the normal fasting blood glucose level (mmol/L)?","type":"essay","saq":{"steps":["About 4–6 mmol/L when fasting."],"src":"Model answer is the tool’s · from Endocrine 2 / blood sugar quiz"}},{"id":"q29bbd9e32c","quiz":"211055","sys":"endo","pts":1,"q":"What is the stimulus for the release of insulin?","imgs":[],"qh":"<p>What is the stimulus for the release of insulin?</p>","qt":"What is the stimulus for the release of insulin?","type":"essay","saq":{"steps":["Rising blood glucose (e.g. after a meal) — a humoral stimulus acting directly on the beta cells."],"src":"Model answer is the tool’s · from Endocrine 2 deck"},"vid":{"id":"5Hq4eoqsVbk","t":"Control of Hormone Release | Endocrine System","d":"3:11","at":103,"alt":{"id":"ksomgJMqxgI","t":"Insulin Secretion","d":"15:00","at":94}},"refs":[{"k":"slide","src":"2026 Endocrine 2 Thyroid, Adrenal, etc. deck · slide 30","slide":"2026-Endocrine-2-Thyroid-Adrenal-etc-30.jpg"}]},{"id":"q03279f1c08","quiz":"211055","sys":"endo","pts":5,"q":"Explain how the body maintains the blood glucose levels within the normal range. (You may wish to refer to figure 16.18 “Regulation of blood glucose levels by insulin and glucagon from the Pancreas”, in your Human Anatomy & Physiology textbook by Marieb).","imgs":[],"qh":"<p>Explain how the body maintains the blood glucose levels within the normal range.</p> <p>(You may wish to refer to figure 16.18 “Regulation of blood glucose levels by insulin and glucagon from the Pancreas”, in your Human Anatomy &amp; Physiology textbook by Marieb).</p>","qt":"Explain how the body maintains the blood glucose levels within the normal range. (You may wish to refer to figure 16.18 “Regulation of blood glucose levels by insulin and glucagon from the Pancreas”, in your Human Anatomy & Physiology textbook by Marieb).","type":"essay","saq":{"steps":["Glucose rises → beta cells release insulin.","Insulin drives uptake into muscle and adipose tissue and glycogen storage in the liver → glucose falls.","Glucose falls → alpha cells release glucagon.","Glucagon makes the liver break down glycogen (glycogenolysis) and build new glucose (gluconeogenesis) → glucose rises.","Two opposing hormones in a negative-feedback loop hold glucose at the set point."],"src":"Model answer is the tool’s · from Endocrine 2 deck, fig 16.18"},"vid":{"id":"vLCg_kyuyw4","t":"Overview of the Endocrine System","d":"17:39","at":1021},"refs":[{"k":"slide","src":"2026 Endocrine 2 Thyroid, Adrenal, etc. deck · slide 30","slide":"2026-Endocrine-2-Thyroid-Adrenal-etc-30.jpg"}]},{"id":"q91977f97aa","quiz":"211055","sys":"endo","pts":3,"q":"Think of all the target organs where insulin acts. Make a list of the actions of insulin on the main target organs skeletal muscles, liver and adipose tissue.","imgs":[],"qh":"<p>Think of all the target organs where insulin acts. Make a list of the actions of insulin on the main target organs skeletal muscles, liver and adipose tissue.</p>","qt":"Think of all the target organs where insulin acts. Make a list of the actions of insulin on the main target organs skeletal muscles, liver and adipose tissue.","type":"essay","saq":{"steps":["Skeletal muscle: takes glucose up, stores it as glycogen.","Liver: glycogenesis up, gluconeogenesis suppressed.","Adipose tissue: glucose uptake, converted to and stored as fat."],"src":"Model answer is the tool’s · from Endocrine 2 deck"},"vid":{"id":"-hTWA2SKYbM","t":"Type 2 Diabetes: Pathophysiology","d":"8:09","at":96},"refs":[{"k":"slide","src":"Mod 2 Revision 16-slide deck · slide 16","slide":"Mod-2-Revision-16-slide-16.jpg"}]},{"id":"q68cf376da9","quiz":"211055","sys":"endo","pts":4,"q":"Describe the signs and symptoms of diabetes mellitus and explain the underlying mechanisms of these symptoms. (You may wish to refer to table 16.4 “Symptoms of insulin deficit (Diabetes Mellitus)”, in your Human Anatomy & Physiology textbook by Marieb).","imgs":[],"qh":"<p>Describe the signs and symptoms of diabetes mellitus and explain the underlying mechanisms of these symptoms.</p> <p>(You may wish to refer to table 16.4 “Symptoms of insulin deficit (Diabetes Mellitus)”, in your Human Anatomy &amp; Physiology textbook by Marieb).</p>","qt":"Describe the signs and symptoms of diabetes mellitus and explain the underlying mechanisms of these symptoms. (You may wish to refer to table 16.4 “Symptoms of insulin deficit (Diabetes Mellitus)”, in your Human Anatomy & Physiology textbook by Marieb).","type":"essay","saq":{"steps":["Polyuria — glucose spills into urine and drags water with it (osmotic diuresis).","Polydipsia — the water loss dehydrates, driving thirst.","Polyphagia — cells cannot take glucose in, so they signal starvation.","Weight loss and fatigue — fat and protein are broken down for fuel instead."],"src":"Model answer is the tool’s · from Endocrine 2 deck, table 16.4"},"vid":{"id":"-hTWA2SKYbM","t":"Type 2 Diabetes: Pathophysiology","d":"8:09","at":353}},{"id":"qe703d323c7","quiz":"211055","sys":"endo","pts":3,"q":"Glucagon hormone is released when the blood glucose levels start to fall. (Think of times you have skipped a meal and the hormone that helped your tissues from being starved of glucose). How does this hormone increase blood glucose?","imgs":[],"qh":"<p>Glucagon hormone is released when the blood glucose levels start to fall. (Think of times you have skipped a meal and the hormone that helped your tissues from being starved of glucose). How does this hormone increase blood glucose?</p>","qt":"Glucagon hormone is released when the blood glucose levels start to fall. (Think of times you have skipped a meal and the hormone that helped your tissues from being starved of glucose). How does this hormone increase blood glucose?","type":"essay","saq":{"steps":["Falling glucose → alpha cells of the islets release glucagon.","Glucagon acts on the LIVER: glycogenolysis + gluconeogenesis.","Glucose is released into the blood and the level rises back to normal."],"src":"Model answer is the tool’s · from Endocrine 2 deck"},"refs":[{"k":"slide","src":"2026 Endocrine 2 Thyroid, Adrenal, etc. deck · slide 30","slide":"2026-Endocrine-2-Thyroid-Adrenal-etc-30.jpg"}]},{"id":"qbc017cecde","quiz":"211055","sys":"endo","pts":2,"q":"In times of stress other hormones besides glucagon are released that increase blood glucose. Name two hormones and think of how they increase the blood glucose?","imgs":[],"qh":"<p>In times of stress other hormones besides glucagon are released that increase blood glucose. Name two hormones and think of how they increase the blood glucose?</p>","qt":"In times of stress other hormones besides glucagon are released that increase blood glucose. Name two hormones and think of how they increase the blood glucose?","type":"essay","saq":{"steps":["Adrenaline (epinephrine, adrenal medulla) — triggers rapid glycogenolysis in liver and muscle.","Cortisol (adrenal cortex) — drives gluconeogenesis from amino acids; both raise blood glucose for fight-or-flight."],"src":"Model answer is the tool’s · from Endocrine 2 deck (stress axis)"},"vid":{"id":"ksomgJMqxgI","t":"Insulin Secretion","d":"15:00","at":808}},{"id":"qc1de8dd0e7","quiz":"211055","sys":"endo","pts":1,"q":"There are some cells in the body that are not insulin dependent. Can you think of at least one type of cells?","imgs":[],"qh":"<p>There are some cells in the body that are not insulin dependent. Can you think of at least one type of cells?</p>","qt":"There are some cells in the body that are not insulin dependent. Can you think of at least one type of cells?","type":"essay","saq":{"steps":["Brain cells (neurons) — they take up glucose without insulin (also red blood cells). This is why hypoglycaemia harms the brain first."],"src":"Model answer is the tool’s · from Endocrine 2 deck"},"vid":{"id":"r-sDGEswYQY","t":"Diabetes Mellitus: Type 1 vs Type 2","d":"45:24","at":2189}},{"id":"q86d113fc6c","quiz":"211055","sys":"endo","pts":2,"q":"What is the major difference between type 1 and type 2 diabetes mellitus?","imgs":[],"qh":"<p>What is the major difference between type 1 and type 2 diabetes mellitus?</p>","qt":"What is the major difference between type 1 and type 2 diabetes mellitus?","type":"essay","saq":{"steps":["Type 1: autoimmune destruction of beta cells → the pancreas makes NO insulin (usually young onset, insulin injections required).","Type 2: cells become RESISTANT to insulin (± falling production later) — usually adult onset, linked to lifestyle, managed first with diet/exercise/tablets."],"src":"Model answer is the tool’s · from Endocrine 2 deck"},"vid":{"id":"r-sDGEswYQY","t":"Diabetes Mellitus: Type 1 vs Type 2","d":"45:24","at":462},"refs":[{"k":"slide","src":"2026 Endocrine 2 Thyroid, Adrenal, etc. deck · slide 31","slide":"2026-Endocrine-2-Thyroid-Adrenal-etc-31.jpg"}]},{"id":"qc2a2a37c97","quiz":"211056","sys":"ms","pts":9,"q":"A lever is defined as a rigid (cannot bend) rod (pole) that can rotate on a fulcrum (or pivot or resting point). Three classes of levers are generally distinguished. Do not confuse yourself- Levers are FLEas. Class 1: F ulcrum in middle Class 2: L oad in middle ( the object to be moved, obstacle to be overcome) Class 3: E ffort in middle (the force moving the load) Levers Notes.pdf What is in the middle? (Fulcrum, Load or Effort) Lever of class (1,2 or 3) This lever system gives a (power, strength, speed) advantage. What is in the middle? (Fulcrum, Load or Effort) Lever of class (1,2 or 3) This lever system gives a (power, strength, speed) advantage. What is in the middle? (Fulcrum, Load or Effort) Lever of class (1,2 or 3) This lever system gives a (power, strength, speed) advantage.","imgs":["HS2IMG-EXT-07da1d45d396.jpg","HS2IMG-EXT-691fbe6c1305.jpg","HS2IMG-EXT-f6fe77cf86b6.jpg"],"qh":"<p>A lever is defined as a rigid (cannot bend)  of the following cell types is NOT part of the neuroglia in the central nervous system?","imgs":[],"qh":"<p>Which of the following cell types is NOT part of the neuroglia in the central nervous system?</p>","qt":"Which of the following cell types is NOT part of the neuroglia in the central nervous system?","type":"mcq","opts":["Microglia","Astrocyte","Schwann cell","Oligodendrocyte"],"key":["Schwann cell"],"vid":{"id":"iTwyLAYuvtI","t":"Glia | Nervous System","d":"4:33","at":225,"alt":{"id":"yT9Ad01oUgc","t":"Cells of the Nervous System (Neurons and Glia)","d":"13:35","at":680}},"refs":[{"k":"slide","src":"2026 NS1 deck · slide 14","slide":"2026-NS1-14.jpg"}]},{"id":"q66cc2eee82","quiz":"211093","sys":"ns","pts":1,"q":"Which option gives the most accurate description. Cerebrospinal fluid is produced in the ....... which are modified ependymal cells.","imgs":[],"qh":"<p>Which option gives the most accurate description. Cerebrospinal fluid is produced in the ....... which are modified ependymal cells.</p>","qt":"Which option gives the most accurate description. Cerebrospinal fluid is produced in the....... which are modified ependymal cells.","type":"mcq","opts":["ventricles","apertures","arachnoidal villi","choroid plexuses"],"key":["choroid plexuses"],"refs":[{"k":"patton","src":"Patton 9e · Ch 20 Central Nervous System · p. 439","t":"Formation and Circulation of Cerebrospinal Fluid Formation of CSF occurs mainly by separation of fluid from blood in the choroid plexuses.","pp":439,"ch":20}]},{"id":"q685e613285","quiz":"211093","sys":"ns","pts":10,"q":"Telano & Baker, (2022, p 1) state about CSF: \"In the adult population, its secretion varies between individuals, usually ranging from 400 to 600 ml per day. The constant secretion of CSF contributes to complete CSF renewal four to five times per 24-hour period in the average young adult. The reduction of CSF turnover may contribute to the accumulation of metabolites seen in aging and neurodegenerative diseases\". CSF production is via a network of modified ependymal cells known as the choroid plexus (CP). The CP is a highly specialized, simple, cuboidal epithelium continuous with ependymal cells lining the ventricles of the brain. This simple cuboidal epithelium surrounds clusters of fenestrated capillaries allowing for the filtration of plasma. CP cells have dense microvilli present on their apical surface. They are interconnected via tight junctions, creating a blood-CSF barrier that helps control the composition of CSF. \"CSF assists the brain by providing protection, nourishment, and waste removal. CSF provides hydromechanical protection of the neuroaxis through two mechanisms. First, CSF acts as a shock absorber, cushioning the brain against the skull. Second, CSF allows the brain and spinal cord to become buoyant, reducing the effective weight of the brain from its normal 1,500 grams to a much lesser 50 grams.\" Lee (2022) argues that the aging brain tries to compensate for its loss of buoyancy by production of amyloid plaques. This strategy ultimately fails as the it leads to impaired CSF flow dynamics. On the website of the American Association of Neurological Surgeons (AANS), hydrocephalus in adult patients is described as a condition that does not cause an increase in pressure in the CSF spaces as in children but a shrinkage in the brain. In ex-vacuo hydrocephalus, as seen i n Alzheimer patients, the shrinking brain cause a vacuum that makes the ventricles enlarge. The extra CSF takes the place of the diminishing brain mass. Other reasons for adult onset hydrocephalus include head injuries, cranial surgery, hemorrhage, meningitis or a tumor. It is linked to a \"gradual blockage of the CSF-draining pathways in the brain. The ventricles enlarge to handle the increased volume of CSF, thus compressing the brain from within and eventually damaging or destroying the brain tissue\"(Adult-Onset Hydrocephalus – Symptoms, Diagnosis and Treatments, n.d.). To normalise the flow of the CSF, an extra opening can be made in the third ventricle so that the CSF can flow into the subarachnoidal space, shunts can be used to drain the fluid back into the blood or the blockage (like a tumor or blood clot) can be surgically removed . True or false According to this article the brain is floating in the CSF. [ Select ] The waste removal function of the CSF may become less efficient as we age because the CSF replacement happens slower. [ Select ] Choroid plexuses are modified cuboidal ependymal cells. [ Select ] The CSF is filtered from blood in sinusoidal capillaries that are surrounded by ependymal cells. [ Select ] The ependymal cells form an important part of the blood brain barrier. They prevent cells, glucose and proteins from filtering through. [ Select ] CSF is produced outside the brain and reabsorbed inside the brain. [ Select ] CSF is the same as lymph. [ Select ] CSF acts as a shock absorber and provides nutrition to the Peripheral Nervous System. [ Select ] Because the brain is buoyant in the CSF, gravitation affects it much less than it would have if it was not. [ Select ] There are three apertures in the fourth ventricle through which CSF leaves the inner space - two lateral and one medial. [ Select ] References Adult-onset Hydrocephalus – Symptoms, Diagnosis and Treatments . (n.d.). Retrieved September 12, 2022, from Lee, S. J. (2022). Alzheimer’s disease is a result of loss of full brain buoyancy. Medical Hypotheses , 164 , 110857. Telano , L. N., & Baker, S. (2022). Physiology, Cerebral Spinal Fluid. In StatPearls . StatPearls Publishing.","imgs":[],"qh":"<p>Telano &amp; Baker, (2022, p 1) state about CSF:</p> <p><em>&quot;In the adult population, its secretion varies between individuals, usually ranging from 400 to 600 ml per day. The constant secretion of CSF contributes to complete CSF renewal four to five times per 24-hour period in the average young adult. The reduction of CSF turnover may contribute to the accumulation of metabolites seen in aging and neurodegenerative diseases&quot;.</em></p> <p><em>CSF production is via a network of modified ependymal cells known as the choroid plexus (CP). The CP is a highly specialized, simple, cuboidal epithelium continuous with ependymal cells lining the ventricles of the brain. This simple cuboidal epithelium surrounds clusters of fenestrated capillaries allowing for the filtration of plasma. CP cells have dense microvilli present on their apical surface. They are interconnected via tight junctions, creating a blood-CSF barrier that helps control the composition of CSF.</em></p> <p><em>&quot;CSF assists the brain by providing protection, nourishment, and waste removal. CSF provides hydromechanical protection of the neuroaxis through two mechanisms. First, CSF acts as a shock absorber, cushioning the brain against the skull. Second, CSF allows the brain and spinal cord to become buoyant, reducing the effective weight of the brain from its normal 1,500 grams to a much lesser 50 grams.&quot;</em></p> <p><em>Lee (2022) argues that the aging brain tries to compensate for its loss of buoyancy by production of amyloid plaques. This strategy ultimately fails as the it leads to impaired CSF flow dynamics. </em></p> <p><em> On the website of the American Association of Neurological Surgeons (AANS), hydrocephalus in adult patients is described as a condition that does not cause an increase in pressure in the CSF spaces as in children but a shrinkage in the brain. </em><em>In ex-vacuo hydrocephalus, as seen i</em><em>n Alzheimer patients, the shrinking brain cause a vacuum that makes the ventricles enlarge. The extra CSF takes the place of the diminishing brain mass. Other reasons for adult onset hydrocephalus include head injuries, cranial surgery, hemorrhage, meningitis or a tumor. It is linked to a &quot;gradual blockage of the CSF-draining pathways in the brain. The ventricles enlarge to handle the increased volume of CSF, thus compressing the brain from within and eventually damaging or destroying the brain tissue&quot;(Adult-Onset Hydrocephalus – Symptoms, Diagnosis and Treatments, n.d.). To normalise the flow of the CSF, an extra opening can be made in the third ventricle so that the CSF can flow into the subarachnoidal space, shunts can be used to drain the fluid back into the blood or the blockage (like a tumor or blood clot) can be surgically </em><em>removed</em><em>.</em></p> <p>True or false</p> <ol><li>According to this article the brain is floating in the CSF. [[BLANK:0]]</li> <li>The waste removal function of the CSF may become less efficient as we age because the CSF replacement happens slower. [[BLANK:1]]</li> <li>Choroid plexuses are modified cuboidal ependymal cells. [[BLANK:2]]</li> <li>The CSF is filtered from blood in sinusoidal capillaries that are surrounded by ependymal cells. [[BLANK:3]]</li> <li>The ependymal cells form an important part of the blood brain barrier. They prevent cells, glucose and proteins from filtering through. [[BLANK:4]]</li> <li>CSF is produced outside the brain and reabsorbed inside the brain. [[BLANK:5]]</li> <li>CSF is the same as lymph. [[BLANK:6]]</li> <li>CSF acts as a shock absorber and provides nutrition to the Peripheral Nervous System. [[BLANK:7]]</li> <li>Because the brain is buoyant in the CSF, gravitation affects it much less than it would have if it was not. [[BLANK:8]]</li> <li>There are three apertures in the fourth ventricle through which CSF leaves the inner space - two lateral and one medial. [[BLANK:9]]</li></ol> <p><strong>References</strong></p> <p><em>Adult-onset Hydrocephalus – Symptoms, Diagnosis and Treatments</em>. (n.d.). Retrieved September 12, 2022, from</p> <p>Lee, S. J. (2022). Alzheimer’s disease is a result of loss of full brain buoyancy. <em>Medical Hypotheses</em>, <em>164</em>, 110857.</p> <p>Telano, L. N., &amp; Baker, S. (2022). Physiology, Cerebral Spinal Fluid. In <em>StatPearls</em>. StatPearls Publishing.</p>","qt":"Telano & Baker, lude head injuries, cranial surgery, hemorrhage, meningitis or a tumor. It is linked to a \"gradual blockage of the CSF-draining pathways in the brain. The ventricles enlarge to handle the increased volume of CSF, thus compressing the brain from within and eventually damaging or destroying the brain tissue\"(Adult-Onset Hydrocephalus – Symptoms, Diagnosis and Treatments, n.d.). To normalise the flow of the CSF, an extra opening can be made in the third ventricle so that the CSF can flow into the subarachnoidal space, shunts can be used to drain the fluid back into the blood or the blockage (like a tumor or blood clot) can be surgically removed. True or false According to this article the brain is floating in the CSF. ____ The waste removal function of the CSF may become less efficient as we age because the CSF replacement happens slower. ____ Choroid plexuses are modified cuboidal ependymal cells. ____ The CSF is filtered from blood in sinusoidal capillaries that are surrounded by ependymal cells. ____ The ependymal cells form an important part of the blood brain barrier. They prevent cells, glucose and proteins from filtering through. ____ CSF is produced outside the brain and reabsorbed inside the brain. ____ CSF is the same as lymph. ____ CSF acts as a shock absorber and provides nutrition to the Peripheral Nervous System. ____ Because the brain is buoyant in the CSF, gravitation affects it much less than it would have if it was not. ____ There are three apertures in the fourth ventricle through which CSF leaves the inner space - two lateral and one medial. ____ References Adult-onset Hydrocephalus – Symptoms, Diagnosis and Treatments. (n.d.). Retrieved September 12, 2022, from Lee, S. J. (2022). Alzheimer’s disease is a result of loss of full brain buoyancy. Medical Hypotheses, 164, 110857. Telano, L. N., & Baker, S. (2022). Physiology, Cerebral Spinal Fluid. In StatPearls. StatPearls Publishing.","type":"cloze","bk":"dd","blanks":[{"label":"Answer 1:","options" ong>femur</strong><strong> of a 7 week embryo consists of.......... and its skull consists of ............................</strong></p>","qt":"Foetal stage – formation of bony skeleton § Begins at week 8 of embryonic development § Intramembranous ossification – bone develops from a fibrous membrane § Endochondral ossification – bone forms by replacing hyaline cartilage The femur of a 7 week embryo consists of.......... and its skull consists of............................","type":"mcq","opts":["fibrous cartilage; fibrous membrane","hyaline cartilage; fibrous membrane","hyaline cartilage; bone","elastic cartilage; endochondral tissue"],"key":["hyaline cartilage; fibrous membrane"]},{"id":"qa71b3e8402","quiz":"211125","sys":"ms","pts":1,"q":"Fibrous connective tissue membranes are ossified by selected centrally located mesenchymal cells. An ossification center appears in the fibrous connective tissue membrane Bone matrix is secreted within the fibrous membrane Woven bone and periosteum form Bone collar of compact bone forms, and red marrow appears Intramembranous ossification is different from endochondral ossification in that Intramembranous ossification develops ...................","imgs":["HS2IMG-EXT-8978fdde5af4.jpg"],"qh":"<p>[[IMG:HS2IMG-EXT-8978fdde5af4.jpg]]</p> <ol><li><p>Fibrous connective tissue membranes are ossified by selected centrally located mesenchymal cells.</p></li> <li><p>An ossification center appears in the fibrous connective tissue membrane</p></li> <li><p>Bone matrix is secreted within the fibrous membrane</p></li> <li><p>Woven bone and periosteum form</p></li> <li><p>Bone collar of compact bone forms, and red marrow appears</p></li></ol> <p><strong>Intramembranous ossification is different from endochondral ossification in that Intramembranous ossification develops ...................</strong></p>","qt":"Fibrous connective tissue membranes are ossified by selected centrally located mesenchymal cells. An ossification center appears in the fibrous connective tissue membrane Bone matrix is secreted within the fibrous membrane Woven bone and periosteum form Bone collar of compact bone forms, and red marrow appears Intramembranous ossification is different from endochondral ossification in that Intramembranous ossification develops...................","type":"mcq","opts":["when woven bone and periosteum form in the fibrocartilage","from mesenchymal cells and fibrocartilage","when fibrous connective tissue membranes ossify","when the fibrous periostial membrane ossify"],"key":["when fibrous connective tissue membranes ossify"],"refs":[{"k":"her","src":"MS1 learning page","t":"As the name implies, ossification happens in fibrous connective tissue membranes."}]},{"id":"q81b0c1d153","quiz":"211125","sys":"ms","pts":1,"q":"Endochondral Ossification § Begins in the second month of development § Uses hyaline cartilage “bones” as models for bone construction § Requires breakdown of hyaline cartilage prior to ossification Stages of Endochondral Ossification § Formation of bone collar § Cavitation of the hyaline cartilage § Invasion of internal cavities by the periosteal bud, and spongy bone formation § Formation of the medullary cavity; appearance of secondary ossification centers in the epiphyses § Ossification of the epiphyses, with hyaline cartilage remaining only in the epiphyseal plates By birth most of the cartilage is converted to bone except for 2 regions – the ends of the long bones (articular cartilage) and the epiphyseal plates. Postnatal Bone Growth § Growth in length of long bones § Cartilage abutting the shaft of the bone organizes into a pattern that allows fast, efficient growth of bone tissue § Cartilage on the side of the epiphyseal plate closest to the epiphysis is relatively inactive The technical terms for the formation of hollow parts in the hyaline cartilage is known as _________________. The cartilage support organising a pattern ensuring fast and efficient growth of the developing bony shaft is known as ______________","imgs":["HS2IMG-EXT-dd13a41f145c.png"],"qh":"<p><strong>Endochondral Ossification</strong></p> <ul><li>§ Begins in the second month of development</li> <li>§ Uses hyaline cartilage “bones” as models for bone construction</li> <li>§ Requires breakdown of hyaline cartilage prior to ossification</li></ul> <p>[[IMG:HS2IMG-EXT-dd13a41f145c.png]]</p> <p><strong>Stages of Endochondral Ossification</strong></p> <ul><li>§ Formation of bone collar</li> <li>§ Cavitation of the hyaline cartilage</li> <li>§ Invasion of internal cavities by the periosteal bud, and spongy bone formation</li> <li>§ Formation of the medullary cavity; appearance of secondary ossification centers in the epiphyses</li> <li>§ Ossification of the epiphyses, with hyaline cartilage remaining only in the epiphyseal plates</li></ul> <p>By birth most of the cartilage is converted to bone except for 2 regions – the ends of the long bones (articular cartilage) and the epiphyseal plates.</p> <p><strong>Postnatal Bone Growth</strong></p> <ul><li>§ Growth in length of long bones</li> <li>§ Cartilage abutting the shaft of the bone organizes into a pattern that allows fast, efficient growth of bone tissue</li> <li>§ Cartilage on the side of the epiphyseal plate closest to the epiphysis is relatively inactive</li></ul> <p><strong>The technical terms for the formation of hollow parts in the hyaline cartilage is known as _________________. The cartilage support organising a pattern ensuring fast and efficient growth of the developing bony shaft is known as </strong><strong>______________</strong></p>","qt":"Endochondral Ossification § Begins in the second month of development § Uses hyaline cartilage “bones” as models for bone construction § Requires breakdown of hyaline cartilage prior to ossification Stages of Endochondral Ossification § Formation of bone collar § Cavitation of the hyaline cartilage § Invasion of internal cavities by the periosteal bud, and spongy bone formation § Formation of the medullary cavity; appearance of secondary ossification centers in the epiphyses § Ossification of the epiphyses, with hyaline cartilage remaining only in the epiphyseal plates By birth most of the cartilage is converted to bone except for 2 regions – the ends of the long bones (articular cartilage) and the epiphyseal plates. Postnatal Bone Growth § Growth in length of long bones § Cartilage abutting the shaft of the bone organizes into a pattern that allows fast, efficient growth of bone tissue § Cartilage on the side of the epiphyseal plate closest to the epiphysis is relatively inactive The technical terms for the formation of hollow parts in the hyaline cartilage is known as _________________. The cartilage support organising a pattern ensuring fast and efficient growth of the developing bony shaft is known as ______________","type":"mcq","opts":["cavitation; abutting","epiphyseal growth; bony collar","longitudinal growth; appositional growth","hollowing; secondary ossification"],"key":["cavitation; abutting"]},{"id":"q192adeab77","quiz":"211125","sys":"ms","pts":5,"q":"Stages of Endochondral Ossification Place the processes in long bone formation in the correct order.","imgs":[],"qh":"<p><strong>Stages of Endochondral Ossification</strong></p> <p>Place the processes in long bone formation in the correct order.</p>","qt":"Stages of Endochondral Ossification Place the processes in long bone formation in the correct order.","type":"match","pairs":[{"left":"Step 1","right":"Formation of bone collar"},{"left":"Step 2","right":"Cavitation of the hyaline cartilage"},{"left":"Step 3","right":"Invasion of internal cavities by the periosteal bud and spongy bone formation"},{"left":"step 4","right":"Formation of the medullary cavity; appearance of secondary ossification centers in the epiphyses"},{"left":"Step 5","right":"Ossification of the epiphyses, with hyaline cartilage remaining only in the epiphyseal plates"}],"refs":[{"k":"slide","src":"Mod 2 Revision 16-slide deck · slide 5","slide":"Mod-2-Revision-16-slide-5.jpg"}]},{"id":"q3aec6cb62c","quiz":"211125","sys":"ms","pts":1,"q":"Long Bone Growth and Remodeling - longitudinal growth - growth in length (epiphyseal plate activity) - appositional growth - growth in thickness § During infancy and childhood, epiphyseal plate activity is stimulated by growth hormone from the anterior pituitary gland, and thyroxine from the thyroid gland § During puberty, testosterone and estrogens: § Initially promote adolescent growth spurts § Cause masculinization and feminization of specific parts of the skeleton § Later induce epiphyseal plate closure, ending longitudinal bone growth In men ____________________________growth allows bones to grow in diameter whereas ____________________growth involves growth in length till the closure of epiphyseal plates under the influence of ___________.","imgs":[],"qh":"<p><strong><u>Long Bone Growth and Remodeling</u></strong></p> <p>- longitudinal growth - growth in length (epiphyseal plate activity)</p> <p>- appositional growth - growth in thickness</p> <p>§ During infancy and childhood, epiphyseal plate activity is stimulated by growth hormone from the anterior pituitary gland, and thyroxine from the thyroid gland</p> <p>§ During puberty, testosterone and estrogens:</p> <ul><ul><ul><li>§ Initially promote adolescent growth spurts</li> <li>§ Cause masculinization and feminization of specific parts of the skeleton</li> <li>§ Later induce epiphyseal plate closure, ending longitudinal bone growth</li></ul></ul></ul> <p>In men ____________________________growth allows bones to grow in diameter whereas ____________________growth involves growth in length till the closure of epiphyseal plates under the influence of ___________.</p>","qt":"Long Bone Growth and Remodeling - longitudinal growth - growth in length (epiphyseal plate activity) - appositional growth - growth in thickness § During infancy and childhood, epiphyseal plate activity is stimulated by growth hormone from the anterior pituitary gland, and thyroxine from the thyroid gland § During puberty, testosterone and estrogens: § Initially promote adolescent growth spurts § Cause masculinization and feminization of specific parts of the skeleton § Later induce epiphyseal plate closure, ending longitudinal bone growth In men ____________________________growth allows bones to grow in diameter whereas ____________________growth involves growth in length till the closure of epiphyseal plates under the influence of ___________.","type":"mcq","opts":["appositional; longitudinal; testosterone","longitudinal; appositional; testosterone","appositional; longitudinal; estrogen","longitudinal; appositional; estrogen"],"key":["appositional; longitudinal; testosterone"]},{"id":"qe13ca09a78","quiz":"211125","sys":"ms","pts":1,"q":"Bone Fractures (Breaks) Stages in the Healing of a Bone Fracture 1. Hematoma formation § Torn blood vessels - hemorrhage § A mass of clotted blood (hematoma) forms at the fracture site § Site becomes swollen, painful, and inflamed 2. Fibrocartilaginous callus forms § Granulation tissue (soft callus) forms a few days after the fracture § Capillaries grow into the tissue and phagocytic cells begin cleaning debris The fibrocartilaginous callus forms when: § Osteoblasts and fibroblasts migrate to the fracture and begin reconstructing the bone § Fibroblasts secrete collagen fibers that connect broken bone ends § Osteoblasts begin forming spongy bone § Osteoblasts secrete an externally bulging cartilaginous matrix that later calcifies 3. Bony callus formation § New bone trabeculae appear in the fibrocartilaginous callus § Fibrocartilaginous callus converts into a bony (hard) callus § Bone callus begins 3-4 weeks after injury, and continues until firm union is formed 2-3 months later 4. Bone remodeling § Excess material on the bone shaft exterior and in the medullary canal is removed § Compact bone is laid down to reconstruct shaft walls A hematoma after a fracture is replaced by a callus made of ___________ which in turn is replaced by a callus made of ____________","imgs":["HS2IMG-EXT-d67a0ac455ff.webp"],"qh":"<p><strong><u>Bone Fractures (Breaks)</u></strong></p> <p><strong>Stages in the Healing of a Bone Fracture</strong></p> <p><strong>[[IMG:HS2IMG-EXT-d67a0ac455ff.webp]]</strong></p> <p><strong>1. Hematoma formation</strong></p> <ul><li>§ Torn blood vessels - hemorrhage</li> <li>§ A mass of clotted blood (hematoma) forms at the fracture site</li> <li>§ Site becomes swollen, painful, and inflamed</li></ul> <p><strong>2. Fibrocartilaginous callus forms</strong></p> <ul><li>§ Granulation tissue (soft callus) forms a few days after the fracture</li> <li>§ Capillaries grow into the tissue and phagocytic cells begin cleaning debris</li></ul> <p>The fibrocartilaginous callus forms when:</p> <ul><li>§ Osteoblasts and fibroblasts migrate to the fracture and begin reconstructing the bone</li> <li>§ Fibroblasts secrete collagen fibers that connect broken bone ends</li> <li>§ Osteoblasts begin forming spongy bone</li> <li>§ Osteoblasts secrete an externally bulging cartilaginous matrix that later calcifies</li></ul> <p><strong>3. Bony callus formation</strong></p> <ul><li>§ New bone trabeculae appear in the fibrocartilaginous callus</li> <li>§ Fibrocartilaginous callus converts into a bony (hard) callus</li> <li>§ Bone callus begins 3-4 weeks after injury, and continues until firm union is formed 2-3 months later</li></ul> <p><strong>4. Bone remodeling</strong></p> <ul><li>§ Excess material on the bone shaft exterior and in the medullary canal is removed</li> <li>§ Compact bone is laid down to reconstruct shaft walls</li></ul> <p>A hematoma after a fracture is replaced by a callus made of ___________ which in turn is replaced by a callus made of ____________</p>","qt":"Bone Fractures (Breaks) Stages in the Healing of a Bone Fracture 1. Hematoma formation § Torn blood vessels - hemorrhage § A mass of clotted blood (hematoma) forms at the fracture site § Site becomes swollen, painful, and inflamed 2. Fibrocartilaginous callus forms § Granulation tissue (soft callus) forms a few days after the fracture § Capillaries grow into the tissue and phagocytic cells begin cleaning debris The fibrocartilaginous callus forms when: § Osteoblasts and fibroblasts migrate to the fracture and begin reconstructing the bone § Fibroblasts secrete collagen fibers that connect broken bone ends § Osteoblasts begin forming spongy bone § Osteoblasts secrete an externally bulging cartilaginous matrix that later calcifies 3. Bony callus formation § New bone trabeculae appear in the fibrocartilaginous callus § Fibrocartilaginous callus converts into a bony (hard) callus § Bone callus begins 3-4 weeks after injury, and continues until firm union is formed 2-3 months later 4. Bone remodeling § Excess material on the bone shaft exterior and in the medullary canal is removed § Compact bone is laid down to reconstruct shaft walls A hematoma after a fracture is replaced by a callus made of ___________ which in turn is replaced by a callus made of ____________","type":"mcq","opts":["fibrocartilage; bone","hyaline cartilage: fibrocartilage","elastic cartilage; bone","bony callus; fibrous membrane"],"key":["fibrocartilage; bone"],"vid":{"id":"N391iuWbM0s","t":"Bone healing in 2 mins!","d":"2:40","at":58}},{"id":"qfe42dada64","quiz":"211125","sys":"ms","pts":1,"q":"Long Bone Growth and Remodeling - longitudinal growth - growth in length (epiphyseal plate activity) - appositional growth - growth in thickness § During infancy and childhood, epiphyseal plate activity is stimulated by growth hormone from the anterior pituitary gland, and thyroxine from the thyroid gland § During puberty, testosterone and estrogens: § Initially promote adolescent growth spurts § Cause masculinization and feminization of specific parts of the skeleton § Later induce epiphyseal plate closure, ending longitudinal bone growth True or false? The widening of the hip bones in girls as they mature is due to growth hormone.","imgs":[],"qh":"<p><strong><u>Long Bone Growth and Remodeling</u></strong></p> <p>- longitudinal growth - growth in length (epiphyseal plate activity)</p> <p>- appositional growth - growth in thickness</p> <p>§ During infancy and childhood, epiphyseal plate activity is stimulated by growth hormone from the anterior pituitary gland, and thyroxine from the thyroid gland</p> <p>§ During puberty, testosterone and estrogens:</p> <ul><ul><li>§ Initially promote adolescent growth spurts</li> <li>§ Cause masculinization and feminization of specific parts of the skeleton</li> <li>§ Later induce epiphyseal plate closure, ending longitudinal bone growth</li></ul></ul> <p>True or false?</p> <p>The widening of the hip bones in girls as they mature is due to growth hormone.</p>","qt":"Long Bone Growth and Remodeling - longitudinal growth - growth in length (epiphyseal plate activity) - appositional growth - growth in thickness § During infancy and childhood, epiphyseal plate activity is stimulated by growth hormone from the anterior pituitary gland, and thyroxine from the thyroid gland § During puberty, testosterone and estrogens: § Initially promote adolescent growth spurts § Cause masculinization and feminization of specific parts of the skeleton § Later induce epiphyseal plate closure, ending longitudinal bone growth True or false? The widening of the hip bones in girls as they mature is due to growth hormone.","type":"tf","opts":["True","False"],"key":["False"]},{"id":"qd68155cb94","quiz":"211125","sys":"ms","pts":1,"q":"Long Bone Growth and Hormones § During infancy and childhood, epiphyseal plate activity is stimulated by growth hormone from the anterior pituitary gland, and thyroxine from the thyroid gland § Calcitonin and parathyroid hormones regulate blood calcium levels by stimulation and inhibition of osteoblasts and osteoclasts . Calcitonin leads to lowering of blood calcium levels whereas parathyroid hormone leads to the increase of blood calcium levels. Bones act as storage for Calcium. § During puberty, testosterone and estrogens: § Initially promote adolescent growth spurts § Cause masculinization and feminization of specific parts of the skeleton § Later induce epiphyseal plate closure, ending longitudinal bone growth True or false? Parathyroid hormone activates osteoclasts to resorb calcium from bone. Calcitonin activates osteoblasts to deposit calcium in bone.","imgs":[],"qh":"<p><strong><u>Long Bone Growth and Hormones</u></strong></p> <p>§ During infancy and childhood, epiphyseal plate activity is stimulated by growth hormone from the anterior pituitary gland, and thyroxine from the thyroid gland</p> <p>§ Calcitonin and parathyroid hormones regulate blood calcium levels by stimulation and inhibition of osteoblasts and osteoclasts. Calcitonin leads to lowering of blood calcium levels whereas parathyroid hormone leads to the increase of blood calcium levels. Bones act as storage for Calcium.</p> <p><strong>§ During puberty, testosterone and estrogens:</strong></p> <p>§ Initially promote adolescent growth spurts</p> <p>§ Cause masculinization and feminization of specific parts of the skeleton</p> <p>§ Later induce epiphyseal plate closure, ending longitudinal bone growth</p> <p>True or false?</p> <p>Parathyroid hormone activates osteoclasts to resorb calcium from bone. Calcitonin activates osteoblasts to deposit calcium in bone.</p>","qt":"Long Bone Growth and Hormones § During infancy and childhood, epiphyseal plate activity is stimulated by growth hormone from the anterior pituitary gland, and thyroxine from the thyroid gland § Calcitonin and parathyroid hormones regulate blood calcium levels by stimulation and inhibition of osteoblasts and osteoclasts. Calcitonin leads to lowering of blood calcium levels whereas parathyroid hormone leads to the increase of blood calcium levels. Bones act as storage for Calcium. § During puberty, testosterone and estrogens: § Initially promote adolescent growth spurts § Cause masculinization and feminization of specific parts of the skeleton § Later induce epiphyseal plate closure, ending longitudinal bone growth True or false? Parathyroid hormone activates osteoclasts to resorb calcium from bone. Calcitonin activates osteoblasts to deposit calcium in bone.","type":"tf","opts":["True","False"],"key":["True"],"vid":{"id":"vLCg_kyuyw4","t":"Overview of the Endocrine System","d":"17:39","at":917},"refs":[{"k":"slide","src":"Mod 2 Revision 16-slide deck · slide 5","slide":"Mod-2-Revision-16-slide-5.jpg"}]},{"id":"qc68c0045c6","quiz":"211125","sys":"ms","pts":1,"q":"Control of bone Remodeling § Two control loops regulate bone remodeling § Hormonal mechanism maintains calcium homeostasis in the blood § Mechanical and gravitational forces acting on the skeleton 1. Hormonal Mechanism § Rising blood Ca 2+ levels signal the thyroid gland to release calcitonin hormone § Calcitonin stimulates calcium salt deposit in bone § Falling blood Ca 2+ levels signal the parathyroid glands to release PTH § PTH signals osteoclasts to degrade bone matrix and release Ca 2+ into the blood 2. Response to Mechanical Stress § Wolff’s law – a bone grows or remodels in response to the forces or demands placed upon it § Observations supporting Wolff’s law include § Large, bony projections occur where heavy, active muscles attach § Long bones are thickest midway along the shaft (where bending stress is greatest) § Curved bones are thickest where they are most likely to buckle § Trabeculae form along lines of stress Wolff's law describe the tendency of bones to grow stronger where they are subjected to stress. Examples of this law would be the bony projections where muscles attach like the ......","imgs":[],"qh":"<p><strong>Control of bone Remodeling</strong></p> <ul><li>§ Two control loops regulate bone remodeling <ul><li>§ Hormonal mechanism maintains calcium homeostasis in the blood</li> <li>§ Mechanical and gravitational forces acting on the skeleton</li></ul></li></ul> <p><strong>1. Hormonal Mechanism</strong></p> <ul><ul><ul><li>§ Rising blood Ca<sup>2+</sup> levels signal the thyroid gland to release calcitonin hormone</li> <li>§ Calcitonin stimulates calcium salt deposit in bone</li> <li>§ Falling blood Ca<sup>2+</sup> levels signal the parathyroid glands to release PTH</li> <li>§ PTH signals osteoclasts to degrade bone matrix and release Ca<sup>2+</sup> into the blood</li></ul></ul></ul> <p><strong>2. Response to Mechanical Stress</strong></p> <ul><ul><ul><li>§ Wolff’s law – a bone grows or remodels in response to the forces or demands placed upon it</li> <li>§ Observations supporting Wolff’s law include <ul><ul><li>§ Large, bony projections occur where heavy, active muscles attach</li> <li>§ Long bones are thickest midway along the shaft (where bending stress is greatest)</li> <li>§ Curved bones are thickest where they are most likely to buckle</li> <li>§ Trabeculae form along lines of stress</li></ul></ul></ul></ul></li></ul> <p>Wolff's law describe the tendency of bones to grow stronger where they are subjected to stress. Examples of this law would be the bony projections where muscles attach like the ......</p>","qt":"Control of bone Remodeling § Two control loops regulate bone remodeling § Hormonal mechanism maintains calcium homeostasis in the blood § Mechanical and gravitational forces acting on the skeleton 1. Hormonal Mechanism § Rising blood Ca2+ levels signal the thyroid gland to release calcitonin hormone § Calcitonin stimulates calcium salt deposit in bone § Falling blood Ca2+ levels signal the parathyroid glands to release PTH § PTH signals osteoclasts to degrade bone matrix and release Ca2+ into the blood 2. Response to Mechanical Stress § Wolff’s law – a bone grows or remodels in response to the forces or demands placed upon it § Observations supporting Wolff’s law include § Large, bony projections occur where heavy, active muscles attach § Long bones are thickest midway along the shaft (where bending stress is greatest) § Curved bones are thickest where they are most likely to buckle § Trabeculae form along lines of stress Wolff's law describe the tendency of bones to grow stronger where they are subjected to stress. Examples of this law would be the bony projections where muscles attach like the......","type":"mcq","opts":["Head of the femur","Medullary cavity of the femur","medial and lateral condyles on the femur","lesser and greater trochanter on the femur."],"key":["lesser and greater trochanter on the femur."]},{"id":"qfe37f9405c","quiz":"211125","sys":"ms","pts":3,"q":"Bone Remodeling – bone is a dynamic tissue and 5 to 7% of bone recycled weekly . Bone remodeling is essential for normal proportions and strength of the long bones. § Remodeling units – adjacent osteoblasts and osteoclasts deposit and resorb bone at the periosteal and endosteal surfaces Bone Deposition – facilitated by osteoblasts § Occurs where bone is injured or added strength is needed § Requires a diet rich in protein, vitamins C, D, and A, calcium, phosphorus, magnesium, and manganese § Alkaline phosphatase is essential for mineralization of bone Bone Resorption § Accomplished by osteoclasts § Resorption bays – grooves formed by osteoclasts as they break down bone matrix § Resorption involves osteoclast secretion of: § Lysosomal enzymes that digest organic matrix § Acids that convert calcium salts into soluble forms Mark all the correct statements.","imgs":["HS2IMG-EXT-8b5da4f6f81c.png"],"qh":"<p><strong>Bone Remodeling </strong><strong>– </strong>bone is a dynamic tissue and 5 to 7% of bone recycled weekly. Bone remodeling is essential for normal proportions and strength of the long bones.</p> <p>§ Remodeling units – adjacent osteoblasts and osteoclasts deposit and resorb bone at the periosteal and endosteal surfaces</p> <p>[[IMG:HS2IMG-EXT-8b5da4f6f81c.png]]</p> <p><strong>Bone Deposition </strong>– facilitated by osteoblasts</p> <ul><li>§ Occurs where bone is injured or added strength is needed</li> <li>§ Requires a diet rich in protein, vitamins C, D, and A, calcium, phosphorus, magnesium, and manganese</li> <li>§ Alkaline phosphatase is essential for mineralization of bone</li></ul> <p><strong>Bone Resorption</strong></p> <ul><li>§ Accomplished by osteoclasts</li> <li>§ Resorption bays – grooves formed by osteoclasts as they break down bone matrix</li> <li>§ Resorption involves osteoclast secretion of: <ul><li>§ Lysosomal enzymes that digest organic matrix</li> <li>§ Acids that convert calcium salts into soluble forms</li></ul></li></ul> <p>Mark all the correct statements.</p>","qt":"Bone Remodeling – bone is a dynamic tissue and 5 to 7% of bone recycled weekly. Bone remodeling is essential for normal proportions and strength of the long bones. § Remodeling units – adjacent osteoblasts and osteoclasts deposit and resorb bone at the periosteal and endosteal surfaces Bone Deposition – facilitated by osteoblasts § Occurs where bone is injured or added strength is needed § Requires a diet rich in protein, vitamins C, D, and A, calcium, phosphorus, magnesium, and manganese § Alkaline phosphatase is essential for mineralization of bone Bone Resorption § Accomplished by osteoclasts § Resorption bays – grooves formed by osteoclasts as they break down bone matrix § Resorption involves osteoclast secretion of: § Lysosomal enzymes that digest organic matrix § Acids that convert calcium salts into soluble forms Mark all the correct statements.","type":"multi","opts":["The hormone parathyroid hormone stimulates bone deposition.","The hormone calcitonin inhibits bone deposition.","bone is deposited and resorbed on both the periosteal (outdide)and endosteal (inside) surfaces","Osteoblasts deposit bone if the diet is rich in Calcium and vitamin D","The enzyme alkaline phosphatase (ALP) is necessary for bone deposition.","during bone deposition lysosomal enzymes digest the organic bony matrix"],"key const CLOSED = DATA.questions.filter(q=>!q.saq);
function pickN(pool, n, excl){
  const fresh = pool.filter(q=>!excl.has(q.id));
  /* Least-seen first: rank = times dealt, so nothing repeats an (n+1)th time
     until the whole pool has been dealt n times. Misses jump the queue (-2),
     Math.random() only breaks ties among equally-seen questions. */
  const rank = q => (S.miss[q.id]?-2:0) + (S.seen[q.id]||0) + Math.random();
  return fresh.sort((a,b)=>rank(a)-rank(b)).slice(0,n);
}
function dealStratified(n){
  const out=[], excl=new Set();
  /* shares are DERIVED from the bank — her revealed question distribution —
     never typed. Announced emphasis does not get a vote. */
  const share = {};
  for(const q of CLOSED) share[q.sys]=(share[q.sys]||0)+1/CLOSED.length;
  for(const sys of ['ms','ns','endo','mixed']){
    const want=Math.round(n*(share[sys]||0));
    for(const q of pickN(CLOSED.filter(x=>x.sys===sys), want, excl)){ out.push(q); excl.add(q.id); }
  }
  while(out.length<n){
    const q=pickN(CLOSED, 1, excl)[0]; if(!q)break; out.push(q); excl.add(q.id);
  }
  return shuffle(out).slice(0,n);
}
function dealMini(){ return dealStratified(12) }
function dealFull(){
  const closed = dealStratified(40);
  const c7 = DATA.case7.questions[(S.scores.filter(s=>s.mode==='full').length) % DATA.case7.questions.length];
  const essays = DATA.questions.filter(q=>q.saq);
  const other = essays.length? essays[Math.random()*essays.length|0] : null;
  const saqs=[mkCaseQ(c7)]; if(other) saqs.push(other);
  return closed.concat(saqs);
}
function mkCaseQ(cq){
  return { id:'c7-'+cq.q.slice(0,24).replace(/\W/g,''), quiz:'case7', sys:'ms', type:'essay',
    pts:cq.marks, q:cq.q, imgs:[], saq:{steps:cq.steps, src:'Case study 7 — model answer is the tool’s'},
    scenario: DATA.case7.scenario };
}
function dealMisses(){
  let ids = Object.keys(S.miss).filter(id=>S.miss[id]>=2);
  if(ids.length<4) ids = Object.keys(S.miss);
  const pool = CLOSED.filter(q=>ids.includes(q.id));
  return shuffle(pool).slice(0,12);
}

/* ── sitting ───────────────────────────────────────────────────────── */
let SIT=null;
/* `learn` sits the same deck in Learn mode: marked per question, resources in place,
   never timed, never on the score chart (see the learn-mode block below) */
function start(mode,learn=false){
  let deck,label,timed=false;
  if(mode==='mini'){deck=dealMini();label=learn?'12 from the bank':'mini mock'}
  else if(mode==='full'){deck=dealFull();label='full mock';timed=true}
  else if(mode==='miss'){deck=dealMisses();label=learn?'my misses':'redo misses'}
  else if(mode.startsWith('quiz:')){const z=DATA.quizzes.find(x=>x.id===mode.slice(5));
    deck=DATA.questions.filter(q=>q.quiz===z.id);label=z.name}
  else if(mode.startsWith('sys:')){const s=mode.slice(4);
    deck=shuffle(CLOSED.filter(q=>q.sys===s)).slice(0,12);label='all '+s}
  if(!deck||!deck.length){alert('Nothing to deal here yet.');return}
  if(learn)timed=false;
  SIT={deck,label,mode,i:0,ans:{},t0:Date.now(),timed,end:timed?Date.now()+65*60*1000:null,learn,chk:{},peek:{}};
  if(mode==='mini'&&DATA.chains.length){warmup();return}
  renderQ();
}
function warmup(){
  const ch=DATA.chains[Math.random()*DATA.chains.length|0];
  const beads=ch.beads.filter(b=>b.t);
  const bi=1+Math.random()*(beads.length-1)|0;
  const answer=beads[bi].t;
  const others=shuffle(DATA.chains.filter(c=>c!==ch).flatMap(c=>c.beads.filter(b=>b.t).map(b=>b.t))).slice(0,3);
  const opts=shuffle([answer,...others]);
  $('#view').innerHTML=`<div class="card">
    <b>30-second warm-up · ${esc(ch.name)}</b>
    <div class="chain">${ch.beads.map(b=> b.t
      ? `<div class="bead ${b.t===answer?'blank':''}">${b.t===answer?'?':esc(b.t)}</div>`
      : `<div class="verb">${esc(b.v)} ↓</div>`).join('')}</div>
    ${opts.map(o=>`<label class="opt"><input type="radio" name="wu"><span>${esc(o)}</span></label>`).join('')}
    <div class="src">${esc(ch.src)} — a scaffold built from her decks, not her material.</div>
    <button class="btn primary wide" id="wuGo">${SIT.learn?'Check → start learning':'Check → start the mock test'}</button>
    <button class="btn ghost wide" id="wuSkip">Skip warm-up</button></div>`;
  document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');o.querySelector('input').checked=true});
  $('#wuGo').onclick=()=>{const sel=document.querySelector('.opt.sel span');
    if(sel){sel.closest('.opt').style.borderColor = sel.textContent===answer?'var(--ok)':'var(--danger)';
      setTimeout(renderQ, sel.textContent===answer?450:1400);
      if(sel.textContent!==answer){const right=[...document.querySelectorAll('.opt span')].find(s=>s.textContent===answer);right.closest('.opt').style.borderColor='var(--ok)';}
    } else renderQ()};
  $('#wuSkip').onclick=renderQ;
}
let timerIv=null;
function renderQ(){
  clearInterval(timerIv);
  const q=SIT.deck[SIT.i];
  const fb=$('#footbar');fb.classList.add('on');
  const last=SIT.i===SIT.deck.length-1, chk=SIT.learn?SIT.chk[q.id]:null;
  if(SIT.learn){

    fb.innerHTML=`<button class="btn" id="prevB" ${SIT.i? '':'disabled'}>← Back</button>`+

          :`<button class="btn primary" id="chkB">Check ✓</button>`);

    if(chk)$('#nextB').onclick=()=>{saveLearnSaq();last?learnDone():(SIT.i++,renderQ())};
    else $('#chkB').onclick=learnCheck;
  } else {
    fb.innerHTML=`<button class="btn" id="prevB" ${SIT.i? '':'disabled'}>← Back</button>

    $('#prevB').onclick=()=>{saveAns();SIT.i--;renderQ()};

  }
  setTimeout(()=>{const x=$('#exitB');if(x)x.onclick=()=>{if(confirm(SIT.learn?'Stop here? Everything you checked is already in your misses pile.':'Abandon this mock test? Nothing is saved.')){clearInterval(timerIv);home();window.scrollTo(0,0)}}},0);
  const a=SIT.ans[q.id];

  } else if(q.type==='match'){

      <select data-i="${i}"><option value="">— choose —</option>

  } else if(q.type==='cloze'){

      ? `<div class="note">${q.bk==='dd'?'Pick from each dropdown in the text.':'Type into each blank in the text — spelling counts, capitals don’t.'}</div>`
      : q.blanks.map((b,i)=>`<div class="blankrow"><label>${esc(blankLabel(b,i))}${q.bk==='dd'?'':' (type it)'}</label>${widget(b,i)}</div>`).join('');
  } else if(q.type==='essay'){
    body=`${q.scenario?`<div class="note">${esc(q.scenario)}</div>`:''}
      <div class="note">Written question · ${q.pts} marks — write ${q.pts} numbered points, one causal step each. You mark yourself against the model at the end.</div>
      <textarea data-essay placeholder="1. …&#10;2. …">${a&&a.text?esc(a.text):''}</textarea>`;
  }
  /* learn mode: once checked, a wrong/skipped/written question already has its slide and

  const open=chk&&learnOpen(q,chk);
  $('#view').innerHTML=`<div class="card">
    <div class="qhead"><span class="n">Q${SIT.i+1}/${SIT.deck.length}</span>
      <span class="tag ${q.sys}">${q.sys}</span><span class="tag">${q.pts} mk</span>${SIT.learn?'<span class="tag" style="color:var(--ok)">learn</span>':''}
      <span class="timer" id="timer"></span>
      <button class="btn ghost" id="exitB" title="${SIT.learn?'stop learning':'abandon mock test'}" style="padding:2px 10px">✕</button></div>
    ${inlineBlanks?body:''}<div class="stem${q.qh?' rich':''}">${stemHTML}</div>${imgs}${inlineBlanks?'':body}
    ${chk?learnMkHTML(q,chk):''}${SIT.learn&&!open?learnChipsHTML(q):''}
    <div class="pips">${SIT.deck.map((_,i)=>{const id=SIT.deck[i].id,c=SIT.learn&&SIT.chk[id];
      const cls=c?(c.r?(c.r.got>=c.r.tot&&SIT.ans[id]?'ok':'bad'):'done'):(SIT.ans[id]?'done':'');
      return `<span class="pip ${cls} ${i===SIT.i?'cur':''}"></span>`}).join('')}</div>
  </div>`;
  if(chk)paintChecked(q);
  /* the label's own activation checks the box; we only mirror it on change. The old
     handler also flipped it by hand, and the two flips cancelled: tapping the WORDS of a
     "tick every answer that applies" option never ticked it (only the box itself did). */
  else document.querySelectorAll('.opt').forEach(o=>{const inp=o.querySelector('input');
    inp.onchange=()=>{if(inp.type==='radio')document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.toggle('sel',inp.checked)}});
  if(SIT.timed){const t=$('#timer');const tick=()=>{const s=Math.max(0,(SIT.end-Date.now())/1000|0);
    t.textContent=`${s/60|0}:${String(s%60).padStart(2,'0')}`;t.classList.toggle('low',s<300);
    if(s<=0){clearInterval(timerIv);saveAns();mark()}};tick();timerIv=setInterval(tick,1000)}
}
function shuffleStable(seed,arr){
  let h=0;for(const c of String(seed))h=(h*31+c.charCodeAt(0))>>>0;
  return arr.map((v,i)=>({v,k:(h=(h*1103515245+12345)>>>0)})).sort((a,b)=>a.k-b.k).map(x=>x.v);
}
function saveAns(){
  const q=SIT.deck[SIT.i];
  if(q.type==='essay'){const t=document.querySelector('[data-essay]');if(t&&t.value.trim())SIT.ans[q.id]={text:t.value};return}
  if(q.type==='match'||q.type==='cloze'){
    const pick={};let any=false;
    document.querySelectorAll('[data-i]').forEach(el=>{if(el.value){pick[el.dataset.i]=el.value;any=true}});
    if(any)SIT.ans[q.id]={pick};return}
  const sel=[...document.querySelectorAll('.opt input:checked')].map(i=>+i.value);
  if(sel.length)SIT.ans[q.id]={sel};
}
/* ── learn mode ────────────────────────────────────────────────────────
   The same deck and the same marking, but per question: Check marks it in place and
   the answer, her slide and the matched video sit right under it — the results
   accordion brought forward to the moment you still care. Slide and video can be
   opened BEFORE answering; that counts as a peek, and a right answer after a peek
   does not clear a miss. Check with nothing picked = "show me" = a miss. Learn
   sittings feed the misses pile and the least-seen dealer, never the score chart. */
function learnChipsHTML(q){
  const chips=[];
  if(q.vid)chips.push(`<button class="qa" data-act="vid">▶ Video · from ${mmss(Number.isInteger(q.vid.at)?q.vid.at:0)}</button>`);
  for(const r of q.refs)chips.push(`<button class="qa" data-act="${r.k}">${REF[r.k].ic} ${REF[r.k].lbl}${r.k==='patton'?' p. '+r.pp:''}</button>`);
  const hint=chips.length?(SIT.chk[q.id]?'':'<span class="hint">open before or after you answer</span>')
    :'<span class="hint">nothing of hers or Patton’s states this one outright — the answer shows on Check</span>';
  return `<div class="lres" data-qid="${q.id}">${chips.join('')}${hint}<div class="qr-pane" hidden></div></div>`;
}
/* resources open by themselves for: written questions, skipped ones, anything not fully right */
const learnOpen=(q,chk)=>!chk.r||!SIT.ans[q.id]||chk.r.got<chk.r.tot;
function learnCheck(){
  saveAns();
  const q=SIT.deck[SIT.i], a=SIT.ans[q.id];
  const r=markQ(q,a), peeked=!!SIT.peek[q.id];
  SIT.chk[q.id]={r,peeked,ticks:[]};
  S.seen[q.id]=(S.seen[q.id]||0)+1;
  if(r){ if(!a||r.got<r.tot)S.miss[q.id]=(S.miss[q.id]||0)+1; else if(!peeked&&S.miss[q.id])delete S.miss[q.id]; }
  SV('miss',S.miss);SV('seen',S.seen);
  renderQ();
  const m=document.querySelector('.mk');if(m)window.scrollTo({top:m.getBoundingClientRect().top+window.scrollY-64,behavior:'smooth'});
}
function saveLearnSaq(){
  const q=SIT.deck[SIT.i],chk=SIT.chk[q.id];
  if(!chk||q.type!=='essay')return;
  chk.ticks=[...document.querySelectorAll('[data-lsaq]')].map((c,i)=>c.checked?i:-1).filter(i=>i>=0);
}
function learnMkHTML(q,chk){
  const a=SIT.ans[q.id],r=chk.r;
  let verdict,cls;
  if(!r){verdict='✍ Tick each model step you actually wrote';cls='saq'}
  else if(!a){verdict='Skipped — read this one';cls='wrong'}
  else if(r.got>=r.tot){verdict=chk.peeked?'✓ Right (after a peek)':'✓ Right';cls='right'}
  else if(r.got>0){verdict=`Partly right · ${+r.got.toFixed(1)}/${r.tot}`;cls='wrong'}
  else{verdict='✗ Not quite';cls='wrong'}
  const body=!r
    ? `${a&&a.text?'':'<div class="you">— nothing written — read the model, then say it out loud</div>'}<div class="steps">${q.saq.steps.map((s,i)=>`<label><input type="checkbox" data-lsaq ${chk.ticks.includes(i)?'checked':''}> <span>${esc(s)}</span></label>`).join('')}</div><div class="refsrc">${esc(q.saq.src)}</div>`
    : keyHTML(q,a);
  const res=learnOpen(q,chk)?refsHTML(q)+(q.vid?vidClipHTML(q.vid)+(q.vid.alt?vidRowHTML(q.vid.alt,'also · '):''):''):'';
  return `<div class="mk ${cls}"><div class="verdict">${verdict}</div>${body}${res}${r?`<button class="btn ghost askai" data-ask="${q.id}">🤖 Copy for AI</button>`:''}</div>`;

/* lock the widgets and colour them: the key green, a wrong pick red, per part for matching and blanks */
function paintChecked(q){
  const a=SIT.ans[q.id]||{};
  if(q.type==='mcq'||q.type==='tf'||q.type==='multi'){
    document.querySelectorAll('.opt').forEach(o=>{const inp=o.querySelector('input'),opt=q.opts[+inp.value];
      inp.disabled=true;o.classList.add('lock');

  } else if(q.type==='match'||q.type==='cloze'){
    document.querySelectorAll('[data-i]').forEach(el=>{const i=+el.dataset.i,v=(a.pick||{})[i];el.disabled=true;
