<!doctype html>
<html lang="en">
<head>

<title>HS2 · Paper Sim — Module 2</title>
<style>
/* ── estate tokens (house.css contract, dark default) ─────────────── */
:root{
  --bg:hsl(225 33% 5%); --fg:hsl(225 31% 95%); --card:hsl(224 44% 10%);
  --primary:hsl(218 91% 64%); --onprimary:hsl(225 33% 5%);
  --muted:hsl(220 38% 13%); --muted-fg:hsl(218 19% 67%);
  --accent:hsl(219 40% 18%); --danger:hsl(0 84% 60%); --ok:hsl(158 64% 42%);
  --warn:hsl(38 92% 55%); --border:hsl(222 27% 19%); --radius:.625rem;
  --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
}
:root[data-theme=light]{
  --bg:hsl(214 47% 97%); --fg:hsl(222 47% 11%); --card:hsl(0 0% 100%);
  --onprimary:#fff; --muted:hsl(215 40% 93%); --muted-fg:hsl(220 12% 40%);
  --accent:hsl(216 45% 91%); --border:hsl(215 33% 89%); --warn:hsl(38 92% 40%);
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:1rem;margin:0;flex:1;font-weight:700}
header .d{color:var(--muted-fg);font-size:.8rem;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border:1px solid var(--border);background:var(--muted);color:var(--fg);
  border-radius:var(--radius);padding:10px 14px;font:inherit;font-weight:600;
  transition:background var(--dur) var(--ease)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.btn.ghost{background:transparent}
.btn.wide{width:100%;margin-top:8px}
.btn:disabled{opacity:.45;cursor:default}
.door h2{margin:.1rem 0 .3rem;font-size:1.02rem}
.door p{margin:.2rem 0 .6rem;color:var(--muted-fg);font-size:.88rem}
.qlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.qrow{display:flex;align-items:center;gap:8px;border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 10px;background:var(--muted)}
.qrow b{flex:1;font-size:.86rem;font-weight:600}
.qrow .m{color:var(--muted-fg);font-size:.76rem;white-space:nowrap}
.sysrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--muted-fg)}
.tag.ms{color:hsl(28 90% 62%)}.tag.ns{color:hsl(268 80% 74%)}.tag.endo{color:hsl(158 64% 52%)}
.tag.mixed{color:var(--muted-fg)}
/* sitting */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qhead .n{font-weight:700}
.qhead .timer{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted-fg)}
.qhead .timer.low{color:var(--danger);font-weight:700}
.stem{white-space:pre-wrap;margin-bottom:10px}
.stem img,.qimg{max-width:100%;border-radius:8px;background:#fff;display:block;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;margin:6px 0;cursor:pointer;background:var(--muted)}
.opt input{margin-top:3px;flex:none}
.opt.sel{border-color:var(--primary);background:var(--accent)}
.blankrow{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.blankrow label{font-size:.82rem;color:var(--muted-fg)}
select,input[type=text],textarea{font:inherit;color:var(--fg);background:var(--muted);
  border:1px solid var(--border);border-radius:8px;padding:9px;width:100%}
textarea{min-height:120px}
.pips{display:flex;gap:3px;flex-wrap:wrap;margin:10px 0 2px}
.pip{width:14px;height:6px;border-radius:3px;background:var(--muted);border:1px solid var(--border)}
.pip.done{background:var(--primary);border-color:var(--primary)}
.pip.cur{outline:2px solid var(--primary);outline-offset:1px}
/* marking */
.mk{border-left:4px solid var(--border);padding-left:10px;margin:14px 0}
.mk.right{border-color:var(--ok)}.mk.wrong{border-color:var(--danger)}
.mk .you{color:var(--muted-fg);font-size:.9rem}
.mk .keyline{color:var(--ok);font-weight:600}
.mk .marks{font-size:.8rem;color:var(--muted-fg)}
.steps label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.score-hero{font-size:2.2rem;font-weight:800;text-align:center;margin:.3rem 0 0}
.score-sub{text-align:center;color:var(--muted-fg);margin:0 0 10px}
/* chart */
.spark{width:100%;height:84px;display:block}
.hist{font-size:.82rem;color:var(--muted-fg)}
.hist td{padding:2px 8px 2px 0}
/* chain warmup */
.chain{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.bead{background:var(--accent);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:.9rem}
.bead.blank{border-style:dashed;color:var(--warn);text-align:center}
.verb{color:var(--muted-fg);font-size:.78rem;padding:0 12px}
.note{border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;
  padding:8px 10px;font-size:.84rem;color:var(--muted-fg);margin:10px 0}
.src{font-size:.75rem;color:var(--muted-fg);margin-top:6px}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--border);
  border-radius:var(--radius);max-width:640px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgb(0 0 0 / .6)}
h3{margin:14px 0 4px;font-size:.95rem}
.footbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
  border-top:1px solid var(--border);padding:10px 14px;display:none;gap:8px;z-index:5}
.footbar.on{display:flex}
.footbar .btn{flex:1}
a{color:var(--primary)}
</style>
</head>

imal to her ankle joint. What bone did she fracture? Her .....","imgs":[],"type":"mcq","opts":["tibia","patella","calcaneus","fibula"],"key":["fibula"]},{"id":"q5ab46e47f9","quiz":"210997","sys":"ms","pts":1,"q":"Manaiha has a dental abscess in her maxilla. It means that she has an abscess in her....................","imgs":[],"type":"mcq","opts":["upper jaw","nose","chin","lower jaw"],"key":["upper jaw"]},{"id":"q7461116890","quiz":"210997","sys":"ms","pts":1,"q":"Imagine a person standing in the anatomical position. He rotates his radius over the ulna. The palm of his hand is now turned backwards.","imgs":[],"type":"tf","opts":["True","False"],"key":["True"]},{"id":"qecb6d63d46","quiz":"210997","sys":"ms","pts":5,"q":"Four joints are involved in movements at the shoulder: the sternoclavicular (SC), acromioclavicular (AC), and scapulothoracic joints, and glenohumeral joint. That means that the sternum, ribs, humerus, scapula and clavicle are involved in shoulder movements. The [ Select ] joint is most commonly the only one seen as the shoulder joint. The glenoid fossa is described as a shallow pear-shaped (piriform) depression on the [ Select ] . True or false? A fractured clavicle makes it very hard to lift one's arm. [ Select ] True or false? The clavicle articulates at two places with the scapula. [ Select ] True or false? The sternoclavicular joint is a synovial saddle joint connecting the upper limb to the axial skeleton. . [ Select ]","imgs":["HS2IMG-EXT-04bddf8ecc47.jpg"],"type":"cloze","blanks":[{"label":"Answer 1:","options":["glenohumeral","sternoclavicular","acromioclavicular","scapulothoracic"],"correct":"glenohumeral"},{"label":"Answer 2:","options":["sternum","clavicle","humerus","scapula"],"correct":"scapula"},{"label":"Answer 3:","options":["TRUE","FALSE"],"correct":"TRUE"},{"label":"Answer 4:","options":["TRUE","FALSE"],"correct":"FALSE"},{"label":"Answer 5:","options":["FALSE","TRUE"],"correct":"TRUE"}]},{"id":"qccbb9715ea","quiz":"211007","sys":"endo","pts":6,"q":"Match each item with its correct partner.","imgs":[],"type":"match","pairs":[{"left":"Thymopoietin","right":"Promotes white blood cell synthesis"},{"left":"Melatonin","right":"Regulates the circadian rhythm"},{"left":"Insulin","right":"Tells the liver to reduce blood sugar levels"},{"left":"TRH","right":"Acts on the thyroid to release Thyroxine"},{"left":"Vitamin D3","right":"Must first be converted to Calcitriol in order to be effective"},{"left":"Enteroendocrine regulators","right":"Stomach communicates with the rest of the GI tract"}]},{"id":"q884f220d5e","quiz":"211007","sys":"endo","pts":5,"q":"Match each item with its correct partner.","imgs":[],"type":"match","pairs":[{"left":"Calcitriol","right":"Active form of Vitamin D that increases intestinal Ca2+ absorption"},{"left":"Human Chorionic Gonadotropin","right":"Tells corpus luteum to keep making progesterone"},{"left":"Erythropoietin","right":"Tells bones to synthesize RBCs"},{"left":"Estrogen","right":"Produced by Ovaries and generates secondary sex characteristics"},{"left":"Progesterone","right":"Maintains Endometrium of the Uterus"}]},{"id":"qe044d09ac3","quiz":"211007","sys":"endo","pts":5,"q":"Match each item with its correct partner.","imgs":[],"type":"match","pairs":[{"left":"Atrial Natriuretic Peptide","right":"Tells the kidneys to excrete Na+ ions and hence, water."},{"left":"Renin","right":"Tells liver to release angiotensinogen"},{"left":"Testosterone","right":"Generates secondary male sex characteristics."},{"left":"Gonadotropin Releasing Hormone","right":"Tells the Anterior Pituitary to release FSH and LH"},{"left":"Adrenocorticotropic Releasing Hormone","right":"Tells adrenal glands to release Cortisol"}]},{"id":"qac601f2daf","quiz":"211007","sys":"endo","pts":5,"q":"Match each item with its correct partner.","imgs":[],"type":"match","pairs":[{"left":"Parathyroid Hormone","right":"Robs bone to increase serum Ca2+ levels"},{"left":"Inhibin","right":"Reduces synthesis and secretion of FSH"},{"left":"Cholecystokinin","right":"Tells gallbladder to release bile fluid"},{"left":"Glucagon","right":"Tells liver to increase blood sugar levels"},{"left":"Vasopressin","right":"Promotes Na+ retention"}]},{"id":"qcd3438ebac","quiz":"211007","sys":"endo","pts":5,"q":"Match each item with its correct partner.","imgs":[],"type":"match","pairs":[{"left":"Follicle Stimulating Hormone","right":"causes the gonads to release sex hormones"},{"left":"Lutenizing Hormone","right":"maintains the endometrium in case there's a baby"},{"left":"Prolactin","right":"Promotes milk production"},{"left":"Angiotensin","right":"increases Peripheral Arterial Pressure"},{"left":"Calcitonin","right":"Reduces serum Ca2+ levels"}]},{"id":"qae4dc1954a","quiz":"211007","sys":"endo","pts":6,"q":"Match each item with its correct partner.","imgs":[],"type":"match","pairs":[{"left":"Leptin","right":"Tells the brain not to be hungry anymore"},{"left":"Adiponectin","right":"promotes fat metabolism"},{"left":"Oxytocin","right":"The love hormone"},{"left":"Aldosterone","right":"Tells the kidneys to reabsorb H2O"},{"left":"Thyroxine","right":"Regulates Basal Metabolic Rate"},{"left":"Epinephrine, Norepinephrine","right":"Mediate the sympathetic NS response"}]},{"id":"q3eff1aa29d","quiz":"211018","sys":"endo","pts":2,"q":"The pancreas has both endocrine and exocrine functions. The acinar cells in the pancreas produce the pancreatic juice rich in enzymes and bicarbonates while the islets of Langerhans cells produce hormones. Name the hypoglycaemic hormone and the hyperglycaemic hormone.","imgs":[],"type":"essay","saq":{"steps":["Exocrine: acinar cells make pancreatic juice (digestive enzymes + bicarbonate), delivered by DUCT to the duodenum.","Endocrine: the islets of Langerhans secrete hormones directly into the BLOOD — beta cells → insulin, alpha cells → glucagon."],"src":"Model answer is the tool’s · from Endocrine 2 deck"}},{"id":"qa7fa49e68f","quiz":"211018","sys":"endo","pts":1,"q":"What is the normal fasting blood glucose level (mmol/L)?","imgs":[],"type":"essay","saq":{"steps":["About 4–6 mmol/L when fasting."],"src":"Model answer is the tool’s · from Endocrine 2 / blood sugar quiz"}},{"id":"q2bb9e1f8d4","quiz":"211018","sys":"endo","pts":1,"q":"What is the stimulus for the release of insulin?","imgs":[],"type":"essay","saq":{"steps":["Rising blood glucose (e.g. after a meal) — a humoral stimulus acting directly on the beta cells."],"src":"Model answer is the tool’s · from Endocrine 2 deck"}},{"id":"q467ea923ca","quiz":"211018","sys":"endo","pts":5,"q":"Explain how the body maintains the blood glucose levels within the normal range. (You may wish to refer to figure 16.18 “Regulation of blood glucose levels by insulin and glucagon from the Pancreas”, in your Human Anatomy & Physiology textbook by Marieb).","imgs":[],"type":"essay","saq":{"steps":["Glucose rises → beta cells release insulin.","Insulin drives uptake into muscle and adipose tissue and glycogen storage in the liver → glucose falls.","Glucose falls → alpha cells release glucagon.","Glucagon makes the liver break down glycogen (glycogenolysis) and build new glucose (gluconeogenesis) → glucose rises.","Two opposing hormones in a negative-feedback loop hold glucose at the set point."],"src":"Model answer is the tool’s · from Endocrine 2 deck, fig 16.18"}},{"id":"q4859dabebf","quiz":"211018","sys":"endo","pts":3,"q":"Think of all the target organs where insulin acts. Make a list of the actions of insulin on the main target organs skeletal muscles, liver and adipose tissue.","imgs":[],"type":"essay","saq":{"steps":["Skeletal muscle: takes glucose up, stores it as glycogen.","Liver: glycogenesis up, gluconeogenesis suppressed.","Adipose tissue: glucose uptake, converted to and stored as fat."],"src":"Model answer is the tool’s · from Endocrine 2 deck"}},{"id":"q742ff3b771","quiz":"211018","sys":"endo","pts":4,"q":"Describe the signs and symptoms of diabetes mellitus and explain the underlying mechanisms of these symptoms. (You may wish to refer to table 16.4 “Symptoms of insulin deficit (Diabetes Mellitus)”, in your Human Anatomy & Physiology textbook by Marieb).","imgs":[],"type":"essay","saq":{"steps":["Polyuria — glucose spills into urine and drags water with it (osmotic diuresis).","Polydipsia — the water loss dehydrates, driving thirst.","Polyphagia — cells cannot take glucose in, so they signal starvation.","Weight loss and fatigue — fat and protein are broken down for fuel instead."],"src":"Model answer is the tool’s · from Endocrine 2 deck, table 16.4"}},{"id":"qd9a9c94dff","quiz":"211018","sys":"endo","pts":3,"q":"Glucagon hormone is released when the blood glucose levels start to fall. (Think of times you have skipped a meal and the hormone that helped your tissues from being starved of glucose). How does this hormone increase blood glucose?","imgs":[],"type":"essay","saq":{"steps":["Falling glucose → alpha cells of the islets release glucagon.","Glucagon acts on the LIVER: glycogenolysis + gluconeogenesis.","Glucose is released into the blood and the level rises back to normal."],"src":"Model answer is the tool’s · from Endocrine 2 deck"}},{"id":"q5c97998026","quiz":"211018","sys":"endo","pts":2,"q":"In times of stress other hormones besides glucagon are released that increase blood glucose. Name two hormones and think of how they increase the blood glucose?","imgs":[],"type":"essay","saq":{"steps":["Adrenaline (epinephrine, adrenal medulla) — triggers rapid glycogenolysis in liver and muscle.","Cortisol (adrenal cortex) — drives gluconeogenesis from amino acids; both raise blood glucose for fight-or-flight."],"src":"Model answer is the tool’s · from Endocrine 2 deck (stress axis)"}},{"id":"q563cbe1fb6","quiz":"211018","sys":"endo","pts":1,"q":"There are some cells in the body that are not insulin dependent. Can you think of at least one type of cells?","imgs":[],"type":"essay","saq":{"steps":["Brain cells (neurons) — they take up glucose without insulin (also red blood cells). This is why hypoglycaemia harms the brain first."],"src":"Model answer is the tool’s · from Endocrine 2 deck"}},{"id":"qff87a8c5c9","quiz":"211018","sys":"endo","pts":2,"q":"What is the major difference between type 1 and type 2 diabetes mellitus?","imgs":[],"type":"essay","saq":{"steps":["Type 1: autoimmune destruction of beta cells → the pancreas makes NO insulin (usually young onset, insulin injections required).","Type 2: cells become RESISTANT to insulin (± falling production later) — usually adult onset, linked to lifestyle, managed first with diet/exercise/tablets."],"src":"Model answer is the tool’s · from Endocrine 2 deck"}},{"id":"q14b8f4419b","quiz":"211023","sys":"ms","pts":1,"q":"The criteria used to name the gluteus medius is","imgs":[],"type":"mcq","opts":["Number of origins","Relative size","Muscle action","Muscle shape"],"key":["Relative size"]},{"id":"q45a4e3bcb8","quiz":"211023","sys":"mixed","pts":1,"q":"You are walking home, when a car loudly backfires down the street from you, startling you. What changes might you expect to occur in the body as a result?","imgs":[],"type":"mcq","opts":["The pupils would constrict","The heart rate would reduce","The blood vessels supplying the gut would constrict","the bronchioles would constrict"],"key":["The blood vessels supplying the gut would constrict"]},{"id":"q6b2ae296d4","quiz":"211023","sys":"ns","pts":1,"q":"The parasympathetic nervous system is a part of which part of the nervous system?","imgs":[],"type":"mcq","opts":["Sensory nervous system","Somatic nervous system","Autonomic nervous system","Central nervous system"],"key":["Autonomic nervous system"]},{"id":"q6a57cf6edc","quiz":"211023","sys":"ms","pts":1,"q":"The criterion used to name the biceps brachii is","imgs":[],"type":"mcq","opts":["Muscle action","Number of origins","Relative size","Muscle shape"],"key":["Number of origins"]},{"id":"q3120e683c2","quiz":"211023","sys":"ns","pts":1,"q":"What region l surface. They are interconnected via tight junctions, creating a blood-CSF barrier that helps control the composition of CSF. \"CSF assists the brain by providing protection, nourishment, and waste removal. CSF provides hydromechanical protection of the neuroaxis through two mechanisms. First, CSF acts as a shock absorber, cushioning the brain against the skull. Second, CSF allows the brain and spinal cord to become buoyant, reducing the effective weight of the brain from its normal 1,500 grams to a much lesser 50 grams.\" Lee (2022) argues that the aging brain tries to compensate for its loss of buoyancy by production of amyloid plaques. This strategy ultimately fails as the it leads to impaired CSF flow dynamics. On the website of the American Association of Neurological Surgeons (AANS), hydrocephalus in adult patients is described as a condition that does not cause an increase in pressure in the CSF spaces as in children but a shrinkage in the brain. In ex-vacuo hydrocephalus, as seen i n Alzheimer patients, the shrinking brain cause a vacuum that makes the ventricles enlarge. The extra CSF takes the place of the diminishing brain mass. Other reasons for adult onset hydrocephalus include head injuries, cranial surgery, hemorrhage, meningitis or a tumor. It is linked to a \"gradual blockage of the CSF-draining pathways in the brain. The ventricles enlarge to handle the increased volume of CSF, thus compressing the brain from within and eventually damaging or destroying the brain tissue\"(Adult-Onset Hydrocephalus – Symptoms, Diagnosis and Treatments, n.d.). To normalise the flow of the CSF, an extra opening can be made in the third ventricle so that the CSF can flow into the subarachnoidal space, shunts can be used to drain the fluid back into the blood or the blockage (like a tumor or blood clot) can be surgically removed . True or false According to this article the brain is floating in the CSF. [ Select ] The waste removal function of the CSF may become less efficient as we age because the CSF replacement happens slower. [ Select ] Choroid plexuses are modified cuboidal ependymal cells. [ Select ] The CSF is filtered from blood in sinusoidal capillaries that are surrounded by ependymal cells. [ Select ] The ependymal cells form an important part of the blood brain barrier. They prevent cells, glucose and proteins from filtering through. [ Select ] CSF is produced outside the brain and reabsorbed inside the brain. [ Select ] CSF is the same as lymph. [ Select ] CSF acts as a shock absorber and provides nutrition to the Peripheral Nervous System. [ Select ] Because the brain is buoyant in the CSF, gravitation affects it much less than it would have if it was not. [ Select ] There are three apertures in the fourth ventricle through which CSF leaves the inner space - two lateral and one medial. [ Select ] References Adult-onset Hydrocephalus – Symptoms, Diagnosis and Treatments . (n.d.). Retrieved September 12, 2022, from Lee, S. J. (2022). Alzheimer’s disease is a result of loss of full brain buoyancy. Medical Hypotheses , 164 , 110857. Telano , L. N., & Baker, S. (2022). Physiology, Cerebral Spinal Fluid. In StatPearls . StatPearls Publishing.","imgs":[],"type":"cloze","blanks":[{"label":"Answer 1:","options":["FALSE","TRUE"],"correct":"TRUE"},{"label":"Answer 2:","options":["TRUE","FALSE"],"correct":"TRUE"},{"label":"Answer 3:","options":["TRUE","FALSE"],"correct":"TRUE"},{"label":"Answer 4:","options":["TRUE","FALSE"],"correct":"FALSE"},{"label":"Answer 5:","options":["TRUE","FALSE"],"correct":"FALSE"},{"label":"Answer 6:","options":["FALSE","TRUE"],"correct":"FALSE"},{"label":"Answer 7:","options":["FALSE","TRUE"],"correct":"FALSE"},{"label":"Answer 8:","options":["TRUE","FALSE"],"correct":"FALSE"},{"label":"Answer 9:","options":["TRUE","FALSE"],"correct":"TRUE"},{"label":"Answer 10:","options":["FALSE","TRUE"],"correct":"TRUE"}]},{"id":"q57602a50d7","quiz":"211093","sys":"ns","pts":1,"q":"The three meninges that surro keleton § Begins at week 8 of embryonic development § Intramembranous ossification – bone develops from a fibrous membrane § Endochondral ossification – bone forms by replacing hyaline cartilage The femur of a 7 week embryo consists of.......... and its skull consists of ............................","imgs":[],"type":"mcq","opts":["fibrous cartilage; fibrous membrane","hyaline cartilage; fibrous membrane","hyaline cartilage; bone","elastic cartilage; endochondral tissue"],"key":["hyaline cartilage; fibrous membrane"]},{"id":"qa71b3e8402","quiz":"211125","sys":"ms","pts":1,"q":"Fibrous connective tissue membranes are ossified by selected centrally located mesenchymal cells. An ossification center appears in the fibrous connective tissue membrane Bone matrix is secreted within the fibrous membrane Woven bone and periosteum form Bone collar of compact bone forms, and red marrow appears Intramembranous ossification is different from endochondral ossification in that Intramembranous ossification develops ...................","imgs":["HS2IMG-EXT-8978fdde5af4.jpg"],"type":"mcq","opts":["when woven bone and periosteum form in the fibrocartilage","from mesenchymal cells and fibrocartilage","when fibrous connective tissue membranes ossify","when the fibrous periostial membrane ossify"],"key":["when fibrous connective tissue membranes ossify"]},{"id":"q81b0c1d153","quiz":"211125","sys":"ms","pts":1,"q":"Endochondral Ossification § Begins in the second month of development § Uses hyaline cartilage “bones” as models for bone construction § Requires breakdown of hyaline cartilage prior to ossification Stages of Endochondral Ossification § Formation of bone collar § Cavitation of the hyaline cartilage § Invasion of internal cavities by the periosteal bud, and spongy bone formation § Formation of the medullary cavity; appearance of secondary ossification centers in the epiphyses § Ossification of the epiphyses, with hyaline cartilage remaining only in the epiphyseal plates By birth wth spurts § Cause masculinization and feminization of specific parts of the skeleton § Later induce epiphyseal plate closure, ending longitudinal bone growth In men ____________________________growth allows bones to grow in diameter whereas ____________________growth involves growth in length till the closure of epiphyseal plates under the influence of ___________.","imgs":[],"type":"mcq","opts":["appositional; longitudinal; testosterone","longitudinal; appositional; testosterone","appositional; longitudinal; estrogen","longitudinal; appositional; estrogen"],"key":["appositional; longitudinal; testosterone"]},{"id":"qe13ca09a78","quiz":"211125","sys":"ms","pts":1,"q":"Bone Fractures (Breaks) Stages in the Healing of a Bone Fracture 1. Hematoma formation § Torn blood vessels - hemorrhage § A mass of clotted blood (hematoma) forms at the fracture site § Site becomes swollen, painful, and inflamed 2. Fibrocartilaginous callus forms § Granulation tissue (soft callus) forms a few days after the fracture § Capillaries grow into the tissue and phagocytic cells begin cleaning debris The fibrocartilaginous callus forms when: § Osteoblasts and fibroblasts migrate to the fracture and begin reconstructing the bone § Fibroblasts secrete collagen fibers that connect broken bone ends § Osteoblasts begin forming spongy bone § Osteoblasts secrete an externally bulging cartilaginous matrix that later calcifies 3. Bony callus formation § New bone trabeculae appear in the fibrocartilaginous callus § Fibrocartilaginous callus converts into a bony (hard) callus § Bone callus begins 3-4 weeks after injury, and continues until firm union is formed 2-3 months later 4. Bone remodeling § Excess material on the bone shaft exterior and in the medullary canal is removed § Compact bone is laid down to reconstruct shaft walls A hematoma after a fracture is replaced by a callus made of ___________ which in turn is replaced by a callus made of ____________","imgs":["HS2IMG-EXT-d67a0ac455ff.webp"]," asts § Resorption bays – grooves formed by osteoclasts as they break down bone matrix § Resorption involves osteoclast secretion of: § Lysosomal enzymes that digest organic matrix § Acids that convert calcium salts into soluble forms Mark all the correct statements.","imgs":["HS2IMG-EXT-8b5da4f6f81c.png"],"type":"multi","opts":["The hormone parathyroid hormone stimulates bone deposition.","The hormone calcitonin inhibits bone deposition.","bone is deposited and resorbed on both the periosteal (outdide)and endosteal (inside) surfaces","Osteoblasts deposit bone if the diet is rich in Calcium and vitamin D","The enzyme alkaline phosphatase (ALP) is necessary for bone deposition.","during bone deposition lysosomal enzymes digest the organic bony matrix"],"key":["bone is deposited and resorbed on both the periosteal (outdide)and endosteal (inside) surfaces","Osteoblasts deposit bone if the diet is rich in Calcium and vitamin D","The enzyme alkaline phosphatase (ALP) is necessary for bone deposition."]},{"id":"q2541a7158a","quiz":"211125","sys":"ms","pts":1,"q":"Long Bone Growth and Remodeling - longitudinal growth - growth in length (epiphyseal plate activity) - appositional growth - growth in thickness § During infancy and childhood, epiphyseal plate activity is stimulated by growth hormone from the anterior pituitary gland, and thyroxine from the thyroid gland § During puberty, testosterone and estrogens: § Initially promote adolescent growth spurts § Cause masculinization and feminization of specific parts of the skeleton § Later induce epiphyseal plate closure, ending longitudinal bone growth Hormones stimulating the epiphyseal plate activity in young children include: Growth hormone Glucagon Thyroid hormone Prolactin Estrogen Oxytocin Testosterone","imgs":[],"type":"mcq","opts":["1,3,5,7","1,2, 5,6, 7","1, 2, 3,5,6","all of them"],"key":["1,3,5,7"]},{"id":"q2331ea7770","quiz":"211125","sys":"ms","pts":4,"q":"[ Select ] formation § Torn blood vessels - bleeding § A m les comprise the triceps surae of the calf that inserts onto the calcaneal tendon and are prime movers of plantar flexion.","imgs":[],"type":"mcq","opts":["soleus and tibialis anterior","gastrocnemius and tibialis anterior","gastrocnemius and soleus","plantaris and popliteus"],"key":["gastrocnemius and soleus"]},{"id":"q4a17b057ea","quiz":"213199","sys":"ms","pts":10,"q":"A number of bones were labeled incorrectly by Copilot. A few were labeled correctly. Match the items so that you replace the incorrect ones but keep the correct items.","imgs":["HS2IMG-8995891.jpg"],"type":"match","pairs":[{"left":"Fibula","right":"Tibial diaphysis"},{"left":"Sacrum","right":"Iliac crest"},{"left":"Patella","right":"Medial condyle on distal head of femur"},{"left":"Coccyx","right":"Head of femur"},{"left":"Radius","right":"Ulnar diaphysis"},{"left":"Tarsals","right":"Tarsals"},{"left":"Phalanges","right":"Phalanges"},{"left":"In blue","right":"Axial skeleton"},{"left":"In green","right":"Appendicular skeleton"},{"left":"Cervical vertebrae","right":"Scapula"}]}],"chains":[{"id":"fracture-healing","sys":"ms","name":"Healing of a bone fracture","src":"2026 MS1 deck · \"Bone fractures, cells & repair\" page","beads":[{"t":"Fracture — vessels in bone and periosteum tear"},{"v":"blood pools and clots as a"},{"t":"Haematoma"},{"v":"fibroblasts + chondrocytes bridge the break as a"},{"t":"Fibrocartilaginous (soft) callus"},{"v":"osteoblasts replace it with spongy bone — the"},{"t":"Bony (hard) callus"},{"v":"is reshaped along stress lines by"},{"t":"Bone remodelling (osteoclasts + osteoblasts)"}]},{"id":"calcium","sys":"ms","name":"Low blood calcium — the PTH response","src":"2026 MS1 + Endocrine 2 decks (criterion: PTH · calcitonin · calcitriol)","beads":[{"t":"Blood Ca²⁺ falls"},{"v":"detected by the"},{"t":"Parathyroid glands"},{"v":"which secrete"},{"t":"PTH"},{"v":"stimulating osteoclasts to"},{"t":"Resorb bone matrix, releasing Ca²⁺"},{"v":"while the kidneys reabsorb Ca²⁺ and activate"},{"t":"Calcitriol → more Ca²⁺ absorbed from the gut"},{"v":"so"},{"t":"Blood Ca²⁺ rises back to the set point"}]},{"id":"action-potential","sys":"ns","name":"The action potential","src":"2026 NS1 deck · her \"Neuron, AP & Synapse\" quiz","beads":[{"t":"Resting membrane potential (−70 mV, Na⁺/K⁺ pump)"},{"v":"a stimulus reaches threshold, so"},{"t":"Voltage-gated Na⁺ channels open — Na⁺ moves IN"},{"v":"the inside becomes positive:"},{"t":"Depolarisation"},{"v":"Na⁺ gates close, K⁺ channels open — K⁺ moves OUT:"},{"t":"Repolarisation"},{"v":"K⁺ overshoots briefly:"},{"t":"Hyperpolarisation, then the pump restores rest"},{"v":"the wave self-propagates — myelinated axons jump node to node:"},{"t":"Saltatory conduction (faster in thick, myelinated fibres)"}]},{"id":"synapse","sys":"ns","name":"Synaptic transmission","src":"2026 NS1 deck (criterion ns-9: \"in detail\")","beads":[{"t":"Action potential arrives at the axon terminal"},{"v":"voltage-gated channels open and"},{"t":"Ca²⁺ flows into the terminal"},{"v":"triggering synaptic vesicles to fuse and release"},{"t":"Neurotransmitter into the synaptic cleft"},{"v":"it diffuses across and binds"},{"t":"Receptors on the postsynaptic membrane"},{"v":"ion channels open and the impulse continues, until the transmitter is"},{"t":"Broken down or taken back up (signal ends)"}]},{"id":"reflex-arc","sys":"ns","name":"The reflex arc","src":"\"Spinal Nerves and the Reflex Arc\" page · 2026 NS3","beads":[{"t":"Receptor detects the stimulus"},{"v":"impulse travels along the"},{"t":"Sensory (afferent) neuron"},{"v":"into the"},{"t":"Integration centre in the spinal cord"},{"v":"out along the"},{"t":"Motor (efferent) neuron"},{"v":"to the"},{"t":"Effector (muscle or gland) — the response"}]},{"id":"blood-glucose","sys":"endo","name":"Blood glucose regulation","src":"Endocrine 2 deck · her \"Regulating Blood Sugar\" quiz","beads":[{"t":"Blood glucose rises after a meal"},{"v":"beta cells of the pancreatic islets release"},{"t":"Insulin"},{"v":"muscle + adipose take glucose up, the liver stores it as glycogen, so"},{"t":"Blood glucose falls to the set point"},{"v":"if it falls too far, alpha cells release"},{"t":"Glucagon"},{"v":"the liver breaks glycogen down (glycogenolysis) and makes new glucose, so"},{"t":"Blood glucose rises — negative feedback both ways"}]},{"id":"thyroid-axis","sys":"endo","name":"Hypothalamus → pituitary → thyroid","src":"Endocrine 1 deck (control of hormone secretion · feedback cycles)","beads":[{"t":"Hypothalamus releases TRH"},{"v":"which tells the"},{"t":"Anterior pituitary to release TSH"},{"v":"which stimulates the"},{"t":"Thyroid to release T3 / T4"},{"v":"raising metabolic rate — and high T3/T4"},{"t":"Feed back to SUPPRESS TRH and TSH (negative feedback)"}]}],"case7":{"scenario":"Julie (65), Marian (31), and Julia (Marian’s 8-year-old child) are in a car crash. Julie was on the impacted side of the car, as was Julia. Julie has experienced a compound break of her left lower leg and left forearm, which is more serious than you would expect for a crash like this. Julia hit her arm on the seat in front of her, but is okay otherwise (she was strapped tightly into a half booster). Julie was unconscious, and hasn’t yet woken up; blood tests show she has low blood calcium and possible osteoporosis.","questions":[{"q":"A bone break can occur when a force is put on a bone that it is not designed to withstand. What kinds of bone breaks are there?","marks":3,"steps":["Simple (closed) fracture — the bone breaks but does not pierce the skin.","Compound (open) fracture — broken ends pierce the skin (Julie’s type; infection risk).","Spiral fracture — a twisting force breaks the bone in a spiral line. (Others worth naming: greenstick — partial bend-and-crack, common in children; comminuted — bone shatters into fragments.)"]},{"q":"The major bones of the limbs are…","marks":3,"steps":["Upper limb: humerus (arm), radius and ulna (forearm).","Lower limb: femur (thigh), tibia and fibula (lower leg).","Julie’s breaks: lower leg = tibia/fibula; forearm = radius/ulna."]},{"q":"The most commonly broken bone in the body is the…","marks":1,"steps":["The clavicle (collarbone)."]},{"q":"Julie has broken bones in both limbs — what intervention needs to be put in place before the healing process begins?","marks":2,"steps":["Reduction — the broken ends are realigned into their normal position (closed = manipulation; open = surgical, likely for her compound break).","Immobilisation — cast, splint or traction holds the ends together so a callus can form."]},{"q":"What is the healing process Julie’s bones will undergo? Explain the stages in detail, as if educating a patient.","marks":4,"steps":["Haematoma — torn vessels bleed and clot at the break site (\"a bruise forms inside the bone\").","Fibrocartilaginous (soft) callus — fibroblasts and chondrocytes bridge the gap with cartilage and collagen (\"a soft splint grows across the crack\").","Bony (hard) callus — osteoblasts replace the soft bridge with spongy bone (\"the splint turns to bone\").","Remodelling — osteoclasts and osteoblasts reshape the callus along stress lines back toward the original shape (\"the repair is polished over months\")."]},{"q":"Julie has low blood calcium. How does that impact her bone density? What is osteoporosis?","marks":3,"steps":["Low blood Ca²⁺ → parathyroid glands release PTH.","PTH stimulates osteoclasts to resorb bone matrix to release Ca²⁺ into the blood — chronically, this thins the bone (density falls).","Osteoporosis = bone resorption outpaces deposition, leaving porous, brittle, low-density bone."]},{"q":"Why does Julie’s bone density put her at greater risk of bone breaks?","marks":2,"steps":["Less mineralised matrix means the bone withstands less force.","So forces a healthy bone would tolerate cause fractures — why her break is \"more serious than you would expect\" for this crash."]},{"q":"How do Julie’s bones compare to Julia’s? What is the likely difference and why?","marks":3,"steps":["Julia (8): bones are more flexible and collagen-rich, epiphyseal (growth) plates still open, ossification incomplete — they bend rather than shatter (greenstick pattern) and heal fast.","Julie (65): bones are less dense and more brittle — post-menopausal oestrogen loss accelerates resorption — and heal slowly.","Hence the same crash bruises the child and breaks the grandmother’s bones."]},{"q":"Head trauma can damage the brain. What protective features ensure the brain and spinal cord are protected from trauma?","marks":4,"steps":["Bone — the skull around the brain, the vertebral column around the spinal cord.","Meninges — dura mater, arachnoid mater, pia mater wrap the CNS.","Cerebrospinal fluid — the brain floats in a shock-absorbing cushion.","The blood-brain barrier — keeps harmful substances in the blood away from brain tissue."]},{"q":"What would be the consequences of slowed breathing? Think about ventilation and gas exchange (CO₂ levels), the bicarbonate buffer system and blood pH.","marks":4,"steps":["Slowed breathing → less ventilation → CO₂ is retained in the blood.","CO₂ + H₂O → H₂CO₃ (carbonic acid) → H⁺ + HCO₃⁻.","More CO₂ pushes this to the right, so H⁺ rises and blood pH falls.","Result: respiratory acidosis — the homeostatic outcome sentence her marking rewards."]}]},"held":[]};

const CLOSED = DATA.questions.filter(q=>!q.saq);
function pickN(pool, n, excl){
  const fresh = pool.filter(q=>!excl.has(q.id));
  /* Least-seen first: rank = times dealt, so nothing repeats an (n+1)th time
     until the whole pool has been dealt n times. Misses jump the queue (-2),
     Math.random() only breaks ties among equally-seen questions. */
  const rank = q => (S.miss[q.id]?-2:0) + (S.seen[q.id]||0) + Math.random();
  return fresh.sort((a,b)=>rank(a)-rank(b)).slice(0,n);
}
function dealStratified(n){
  const out=[], excl=new Set();
  /* shares are DERIVED from the bank — her revealed question distribution —
     never typed. Announced emphasis does not get a vote. */
  const share = {};
  for(const q of CLOSED) share[q.sys]=(share[q.sys]||0)+1/CLOSED.length;
  for(const sys of ['ms','ns','endo','mixed']){
    const want=Math.round(n*(share[sys]||0));
    for(const q of pickN(CLOSED.filter(x=>x.sys===sys), want, excl)){ out.push(q); excl.add(q.id); }
  }
  while(out.length<n){
    const q=pickN(CLOSED, 1, excl)[0]; if(!q)break; out.push(q); excl.add(q.id);
  }
  return shuffle(out).slice(0,n);
}

  const closed = dealStratified(40);
  const c7 = DATA.case7.questions[(S.scores.filter(s=>s.mode==='full').length) % DATA.case7.questions.length];
  const essays = DATA.questions.filter(q=>q.saq);
  const other = essays.length? essays[Math.random()*essays.length|0] : null;
  const saqs=[mkCaseQ(c7)]; if(other) saqs.push(other);
  return closed.concat(saqs);
}
function mkCaseQ(cq){
  return { id:'c7-'+cq.q.slice(0,24).replace(/\W/g,''), quiz:'case7', sys:'ms', type:'essay',
    pts:cq.marks, q:cq.q, imgs:[], saq:{steps:cq.steps, src:'Case study 7 — model answer is the tool’s'},
    scenario: DATA.case7.scenario };
}
function dealMisses(){
  let ids = Object.keys(S.miss).filter(id=>S.miss[id]>=2);
  if(ids.length<4) ids = Object.keys(S.miss);
  const pool = CLOSED.filter(q=>ids.includes(q.id));
  return shuffle(pool).slice(0,12);
}

/* ── home ──────────────────────────────────────────────────────────── */
function home(){
  $('#footbar').classList.remove('on');
  const last = S.scores[S.scores.length-1];
  document.getElementById('view').innerHTML = `
  ${sparkCard()}
  <div class="card door">
    <h2>🎯 Deal me a paper</h2>
    <p>Don’t decide — sit what the tool deals from her whole question bank.</p>
    <button class="btn primary wide" data-go="mini">Sit a mini · 12 questions, ~15 min</button>
    <button class="btn wide" data-go="full">Sit the full paper · 42 Q incl. written, 65 min</button>
    <button class="btn wide" data-go="miss" ${Object.keys(S.miss).length? '':'disabled'}>Redo my misses${Object.keys(S.miss).length?` · ${Object.keys(S.miss).length} in the pile`:''}</button>
  </div>
  <div class="card door">
    <h2>🗂 Pick my rep</h2>
    <p>Her quizzes, unlocked — sit any of them as often as you like. No attempt limits, marked instantly.</p>
    <div class="sysrow">
      <button class="btn ghost" data-sys="ms">All MS</button>
      <button class="btn ghost" data-sys="ns">All NS</button>
      <button class="btn ghost" data-sys="endo">All Endo</button>
    </div>
    <div class="qlist">${DATA.quizzes.map(z=>`
      <div class="qrow"><span class="tag ${z.sys}">${z.sys}</span><b>${esc(z.name)}</b>
      <span class="m">${z.n} Q</span><button class="btn ghost" data-quiz="${z.id}">Sit</button></div>`).join('')}
    </div>
  </div>`;
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>start(b.dataset.go));
  document.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>start('quiz:'+b.dataset.quiz));
  document.querySelectorAll('[data-sys]').forEach(b=>b.onclick=()=>start('sys:'+b.dataset.sys));
}
function sparkCard(){
  if(!S.scores.length) return `<div class="card"><b>No sittings yet.</b>
    <p class="hist" style="margin:.4rem 0 0">Your first paper is the baseline — the whole game is the climb from there. ${daysLeft()} days to go.</p></div>`;
  const pts=S.scores.slice(-30).map(s=>s.got/s.tot);
  const W=600,H=70,P=6;
  const x=i=>P+i*(W-2*P)/Math.max(1,pts.length-1), y=v=>H-P-v*(H-2*P);
  const path=pts.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const last=S.scores[S.scores.length-1], pct=Math.round(100*last.got/last.tot);
  const best=Math.max(...S.scores.map(s=>s.got/s.tot));
  return `<div class="card">
    <div style="display:flex;align-items:baseline;gap:10px">
      <b style="font-size:1.3rem">${last.got}/${last.tot}</b>
      <span class="hist">${pct}% · ${esc(last.label)}</span>
      <span class="hist" style="margin-left:auto">best ${Math.round(best*100)}% · ${S.scores.length} sat</span>
    </div>
    <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="score history">
      <line x1="${P}" y1="${y(.5)}" x2="${W-P}" y2="${y(.5)}" stroke="var(--border)" stroke-dasharray="4 4"/>
      <path d="${path}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="${x(pts.length-1)}" cy="${y(pts[pts.length-1])}" r="4" fill="var(--primary)"/>
    </svg>
    <div class="hist">dashed line = 50%. <button class="btn ghost" id="shareBtn" style="padding:2px 10px;font-size:.78rem">Copy score line</button></div>
  </div>`;
}

/* ── sitting ───────────────────────────────────────────────────────── */
let SIT=null;
function start(mode){
  let deck,label,timed=false;
  if(mode==='mini'){deck=dealMini();label='mini'}
  else if(mode==='full'){deck=dealFull();label='full paper';timed=true}
  else if(mode==='miss'){deck=dealMisses();label='redo misses'}
  else if(mode.startsWith('quiz:')){const z=DATA.quizzes.find(x=>x.id===mode.slice(5));
    deck=DATA.questions.filter(q=>q.quiz===z.id);label=z.name}
  else if(mode.startsWith('sys:')){const s=mode.slice(4);
    deck=shuffle(CLOSED.filter(q=>q.sys===s)).slice(0,12);label='all '+s}
  if(!deck||!deck.length){alert('Nothing to deal here yet.');return}
  SIT={deck,label,mode,i:0,ans:{},t0:Date.now(),timed,end:timed?Date.now()+65*60*1000:null};
  if(mode==='mini'&&DATA.chains.length){warmup();return}
  renderQ();
}
function warmup(){
  const ch=DATA.chains[Math.random()*DATA.chains.length|0];
  const beads=ch.beads.filter(b=>b.t);
  const bi=1+Math.random()*(beads.length-1)|0;
  const answer=beads[bi].t;
  const others=shuffle(DATA.chains.filter(c=>c!==ch).flatMap(c=>c.beads.filter(b=>b.t).map(b=>b.t))).slice(0,3);
  const opts=shuffle([answer,...others]);
  $('#view').innerHTML=`<div class="card">
    <b>30-second warm-up · ${esc(ch.name)}</b>
    <div class="chain">${ch.beads.map(b=> b.t
      ? `<div class="bead ${b.t===answer?'blank':''}">${b.t===answer?'?':esc(b.t)}</div>`
      : `<div class="verb">${esc(b.v)} ↓</div>`).join('')}</div>
    ${opts.map(o=>`<label class="opt"><input type="radio" name="wu"><span>${esc(o)}</span></label>`).join('')}
    <div class="src">${esc(ch.src)} — a scaffold built from her decks, not her material.</div>
    <button class="btn primary wide" id="wuGo">Check → start the paper</button>
    <button class="btn ghost wide" id="wuSkip">Skip warm-up</button></div>`;
  document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');o.querySelector('input').checked=true});
  $('#wuGo').onclick=()=>{const sel=document.querySelector('.opt.sel span');
    if(sel){sel.closest('.opt').style.borderColor = sel.textContent===answer?'var(--ok)':'var(--danger)';
      setTimeout(renderQ, sel.textContent===answer?450:1400);
      if(sel.textContent!==answer){const right=[...document.querySelectorAll('.opt span')].find(s=>s.textContent===answer);right.closest('.opt').style.borderColor='var(--ok)';}
    } else renderQ()};
  $('#wuSkip').onclick=renderQ;
}
let timerIv=null;
function renderQ(){
  clearInterval(timerIv);
  const q=SIT.deck[SIT.i];
  const fb=$('#footbar');fb.classList.add('on');
  fb.innerHTML=`<button class="btn" id="prevB" ${SIT.i? '':'disabled'}>← Back</button>
    <button class="btn primary" id="nextB">${SIT.i===SIT.deck.length-1?'Finish & mark':'Next →'}</button>`;
  $('#prevB').onclick=()=>{saveAns();SIT.i--;renderQ()};
  setTimeout(()=>{const x=$('#exitB');if(x)x.onclick=()=>{if(confirm('Abandon this paper? Nothing is saved.')){clearInterval(timerIv);home();window.scrollTo(0,0)}}},0);
  $('#nextB').onclick=()=>{saveAns();SIT.i===SIT.deck.length-1?mark():(SIT.i++,renderQ())};
  const imgs=(q.imgs||[]).map(f=>`<img class="qimg" src="img/${f}" alt="question figure" loading="lazy">`).join('');
  let body='';
  const a=SIT.ans[q.id];
  if(q.type==='mcq'||q.type==='tf'||q.type==='multi'){
    const multi=q.type==='multi';
    body=q.opts.map((o,i)=>`<label class="opt ${a&&a.sel&&a.sel.includes(i)?'sel':''}">
      <input type="${multi?'checkbox':'radio'}" name="q" value="${i}" ${a&&a.sel&&a.sel.includes(i)?'checked':''}>
      <span>${esc(o)}</span></label>`).join('');
    if(multi)body=`<div class="note">Select every answer that applies.</div>`+body;
  } else if(q.type==='match'){
    const bank=shuffleStable(q.id,q.pairs.map(p=>p.right));
    body=q.pairs.map((p,i)=>`<div class="blankrow"><label>${esc(p.left)}</label>
      <select data-i="${i}"><option value="">— choose —</option>
      ${bank.map(r=>`<option ${a&&a.pick&&a.pick[i]===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div>`).join('');
  } else if(q.type==='cloze'){
    body=q.blanks.map((b,i)=> b.options.length>1
      ? `<div class="blankrow"><label>${esc(b.label)}</label><select data-i="${i}">
          <option value="">— choose —</option>
          ${shuffleStable(q.id+i,b.options).map(o=>`<option ${a&&a.pick&&a.pick[i]===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`
      : `<div class="blankrow"><label>${esc(b.label)} (type it)</label>
          <input type="text" data-i="${i}" value="${a&&a.pick?esc(a.pick[i]||''):''}"></div>`).join('');
  } else if(q.type==='essay'){
    body=`${q.scenario?`<div class="note">${esc(q.scenario)}</div>`:''}
      <div class="note">Written question · ${q.pts} marks — write ${q.pts} numbered points, one causal step each. You mark yourself against the model at the end.</div>
      <textarea data-essay placeholder="1. …&#10;2. …">${a&&a.text?esc(a.text):''}</textarea>`;
  }
  $('#view').innerHTML=`<div class="card">
    <div class="qhead"><span class="n">Q${SIT.i+1}/${SIT.deck.length}</span>
      <span class="tag ${q.sys}">${q.sys}</span><span class="tag">${q.pts} mk</span>
      <span class="timer" id="timer"></span>
      <button class="btn ghost" id="exitB" title="abandon paper" style="padding:2px 10px">✕</button></div>
    <div class="stem">${esc(q.q)}</div>${imgs}${body}
    <div class="pips">${SIT.deck.map((_,i)=>`<span class="pip ${SIT.ans[SIT.deck[i].id]?'done':''} ${i===SIT.i?'cur':''}"></span>`).join('')}</div>
  </div>`;
  document.querySelectorAll('.opt').forEach(o=>o.onclick=e=>{
    const inp=o.querySelector('input');
    if(inp.type==='radio'){document.querySelectorAll('.opt').forEach(x=>{x.classList.remove('sel');x.querySelector('input').checked=false});inp.checked=true;o.classList.add('sel')}
    else{if(e.target.tagName!=='INPUT')inp.checked=!inp.checked;o.classList.toggle('sel',inp.checked)}
  });
  if(SIT.timed){const t=$('#timer');const tick=()=>{const s=Math.max(0,(SIT.end-Date.now())/1000|0);
    t.textContent=`${s/60|0}:${String(s%60).padStart(2,'0')}`;t.classList.toggle('low',s<300);
    if(s<=0){clearInterval(timerIv);saveAns();mark()}};tick();timerIv=setInterval(tick,1000)}
}
function shuffleStable(seed,arr){
  let h=0;for(const c of String(seed))h=(h*31+c.charCodeAt(0))>>>0;
  return arr.map((v,i)=>({v,k:(h=(h*1103515245+12345)>>>0)})).sort((a,b)=>a.k-b.k).map(x=>x.v);
}
function saveAns(){
  const q=SIT.deck[SIT.i];
  if(q.type==='essay'){const t=document.querySelector('[data-essay]');if(t&&t.value.trim())SIT.ans[q.id]={text:t.value};return}
  if(q.type==='match'||q.type==='cloze'){
    const pick={};let any=false;
    document.querySelectorAll('[data-i]').forEach(el=>{if(el.value){pick[el.dataset.i]=el.value;any=true}});
    if(any)SIT.ans[q.id]={pick};return}
  const sel=[...document.querySelectorAll('.opt input:checked')].map(i=>+i.value);
  if(sel.length)SIT.ans[q.id]={sel};
}
/* ── marking ───────────────────────────────────────────────────────── */
function markQ(q,a){
  if(q.type==='essay')return null; // self-marked
  if(!a)return{got:0,tot:q.pts,detail:'no answer'};
  if(q.type==='mcq'||q.type==='tf'||q.type==='multi'){
    const chosen=(a.sel||[]).map(i=>q.opts[i]);
    const right=chosen.length===q.key.length&&q.key.every(k=>chosen.includes(k));
    return{got:right?q.pts:0,tot:q.pts,you:chosen.join(' · ')}}
  if(q.type==='match'){
    let got=0;q.pairs.forEach((p,i)=>{if((a.pick||{})[i]===p.right)got++});
    return{got:got*q.pts/q.pairs.length,tot:q.pts,you:q.pairs.map((p,i)=>(a.pick||{})[i]||'—').join(' · ')}}
  if(q.type==='cloze'){
    let got=0;const nrm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
    q.blanks.forEach((b,i)=>{const v=nrm((a.pick||{})[i]);if(v&&b.options.some(o=>nrm(o)===v))got++});
    return{got:got*q.pts/q.blanks.length,tot:q.pts,you:q.blanks.map((b,i)=>(a.pick||{})[i]||'—').join(' · ')}}
}
function mark(){
  clearInterval(timerIv);$('#footbar').classList.remove('on');
  let got=0,tot=0;const rows=[];
  for(const q of SIT.deck){
    const r=markQ(q,SIT.ans[q.id]);
    S.seen[q.id]=(S.seen[q.id]||0)+1;
    if(r){got+=r.got;tot+=r.tot;
      if(r.got<r.tot)S.miss[q.id]=(S.miss[q.id]||0)+1;
      else if(S.miss[q.id])delete S.miss[q.id];
      rows.push({q,r})}
    else rows.push({q,r:null,saq:true});
  }
  SIT.auto={got,tot};
  const saqs=rows.filter(x=>x.saq);
  $('#view').innerHTML=`<div class="card">
    <div class="score-hero" id="hero"></div><div class="score-sub" id="heroSub"></div>
    ${saqs.length?`<div class="note">Tick each model step your written answer actually hit — the score updates as you go. Model answers are the tool’s, not Hannetjie’s.</div>`:''}
    ${rows.map(({q,r,saq},i)=>{
      if(saq){const a=SIT.ans[q.id];
        return `<div class="mk" id="mk${i}"><b>${esc(q.q)}</b>
        ${a&&a.text?`<div class="you">You wrote:<br>${esc(a.text).replace(/\n/g,'<br>')}</div>`:'<div class="you">— no answer written —</div>'}
        <div class="steps">${q.saq.steps.map((s,si)=>`<label><input type="checkbox" data-saq="${i}" data-pt="${q.pts/q.saq.steps.length}"> <span>${esc(s)}</span></label>`).join('')}</div>
        <div class="src">${esc(q.saq.src)}</div></div>`}
      const cls=r.got>=r.tot?'right':'wrong';
      return `<div class="mk ${cls}"><b>${esc(q.q).slice(0,300)}</b>
        <div class="marks">${(+r.got.toFixed(1))}/${r.tot} mk · ${esc(DATA.quizzes.find(z=>z.id===q.quiz)?.name||q.quiz)}</div>
        ${r.you?`<div class="you">You: ${esc(r.you)}</div>`:`<div class="you">${r.detail||''}</div>`}
        ${r.got<r.tot?`<div class="keyline">Key: ${esc(keyText(q))}</div>`:''}</div>`}).join('')}
    <button class="btn primary wide" id="doneB">Save score & finish</button></div>`;
  const upd=()=>{
    let s=0;document.querySelectorAll('[data-saq]:checked').forEach(c=>s+=+c.dataset.pt);
    const saqTot=saqs.reduce((n,{q})=>n+q.pts,0);
    const g=got+s,t=tot+saqTot;
    $('#hero').textContent=`${+g.toFixed(1)} / ${t}`;
    $('#heroSub').textContent=`${Math.round(100*g/t)}% · ${SIT.label} · ${Math.round((Date.now()-SIT.t0)/60000)} min`;
    SIT.final={got:+g.toFixed(1),tot:t}};
  document.querySelectorAll('[data-saq]').forEach(c=>c.onchange=upd);upd();
  $('#doneB').onclick=()=>{
    S.scores.push({t:Date.now(),mode:SIT.mode,label:SIT.label,got:SIT.final.got,tot:SIT.final.tot});
    SV('scores',S.scores);SV('miss',S.miss);SV('seen',S.seen);home();window.scrollTo(0,0)};
  SV('miss',S.miss);SV('seen',S.seen);
  window.scrollTo(0,0);
}
function keyText(q){
  if(q.type==='match')return q.pairs.map(p=>`${p.left} → ${p.right}`).join(' · ');
  if(q.type==='cloze')return q.blanks.map(b=>b.options[0]).join(' · ');
  return (q.key||[]).join(' · ');
}
/* ── chrome ────────────────────────────────────────────────────────── */
$('#countdown').textContent=`${daysLeft()}d to Test 2`;
$('#themeBtn').onclick=()=>{const r=document.documentElement;
  const to=r.dataset.theme==='light'?'':'light';
  to?r.dataset.theme='light':delete r.dataset.theme;SV('theme',to)};
if(LS('theme')==='light')document.documentElement.dataset.theme='light';
$('#helpBtn').onclick=()=>{$('#help').innerHTML=`
  <h2 style="margin-top:0">What is this?</h2>
  <p>Every practice quiz Hannetjie posted for Module 2 (MS · NS · Endocrine), unlocked: sit them as

  <button class="btn primary wide" onclick="this.closest('dialog').close()">Close</button>`;

document.addEventListener('click',e=>{if(e.target.id==='shareBtn'){
  const l=S.scores[S.scores.length-1];
  const line=`HS2 Paper Sim — ${l.got}/${l.tot} (${Math.round(100*l.got/l.tot)}%) · ${l.label} · ${daysLeft()}d to Test 2`;

  e.target.textContent='Copied ✓';setTimeout(()=>e.target.textContent='Copy score line',1500)}});
home();
