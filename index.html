<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HS2 · Paper Sim — Module 2</title>
<style>
/* ── estate tokens (house.css contract, dark default) ─────────────── */
:root{
  --bg:hsl(225 33% 5%); --fg:hsl(225 31% 95%); --card:hsl(224 44% 10%);
  --primary:hsl(218 91% 64%); --onprimary:hsl(225 33% 5%);
  --muted:hsl(220 38% 13%); --muted-fg:hsl(218 19% 67%);
  --accent:hsl(219 40% 18%); --danger:hsl(0 84% 60%); --ok:hsl(158 64% 42%);
  --warn:hsl(38 92% 55%); --border:hsl(222 27% 19%); --radius:.625rem;
  --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
}
:root[data-theme=light]{
  --bg:hsl(214 47% 97%); --fg:hsl(222 47% 11%); --card:hsl(0 0% 100%);
  --onprimary:#fff; --muted:hsl(215 40% 93%); --muted-fg:hsl(220 12% 40%);
  --accent:hsl(216 45% 91%); --border:hsl(215 33% 89%); --warn:hsl(38 92% 40%);
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:1rem;margin:0;flex:1;font-weight:700}
header .d{color:var(--muted-fg);font-size:.8rem;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border:1px solid var(--border);background:var(--muted);color:var(--fg);
  border-radius:var(--radius);padding:10px 14px;font:inherit;font-weight:600;
  transition:background var(--dur) var(--ease)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.btn.ghost{background:transparent}
.btn.wide{width:100%;margin-top:8px}
a.btn{text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.door h2{margin:.1rem 0 .3rem;font-size:1.02rem}
.door p{margin:.2rem 0 .6rem;color:var(--muted-fg);font-size:.88rem}
.qlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.qrow{display:flex;align-items:center;gap:8px;border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 10px;background:var(--muted)}
.qrow b{flex:1;font-size:.86rem;font-weight:600}
.qrow .m{color:var(--muted-fg);font-size:.76rem;white-space:nowrap}
.sysrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--muted-fg)}
.tag.ms{color:hsl(28 90% 62%)}.tag.ns{color:hsl(268 80% 74%)}.tag.endo{color:hsl(158 64% 52%)}
.tag.mixed{color:var(--muted-fg)}
/* sitting */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qhead .n{font-weight:700}
.qhead .timer{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted-fg)}
.qhead .timer.low{color:var(--danger);font-weight:700}
.stem{white-space:pre-wrap;margin-bottom:10px}
.stem img,.qimg{max-width:100%;border-radius:8px;background:#fff;display:block;margin:8px 0}
/* structured stem: her paragraphs, lists and table rows survive; a Canvas layout
   table becomes stacked cells at phone width and side-by-side from 560px */
.stem.rich{white-space:normal;line-height:1.5}
.stem.rich p{margin:.4em 0}
.stem.rich ul,.stem.rich ol{margin:.3em 0;padding-left:1.35em}
.stem.rich li{margin:.15em 0}
.stem.rich li>p{margin:.1em 0}
.stem.rich div{margin:.15em 0}
.stem.rich .tbl{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.stem.rich .tr{display:flex;flex-wrap:wrap;gap:8px 14px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--muted)}
.stem.rich .td{flex:1 1 220px;min-width:0}
.stem.rich .td>p:first-child{margin-top:0}
.stem.rich .td img{margin:0 0 4px;max-height:280px;width:auto}
.stem.rich img{max-height:520px;width:auto}
.inl{display:inline-block;width:auto;max-width:100%;padding:5px 8px;margin:2px 0;vertical-align:baseline;
  font-size:.95em;border:1px solid var(--primary);background:var(--card);color:var(--fg);border-radius:6px}
input.inl{min-width:7ch}
.inl:focus{outline:2px solid var(--primary);outline-offset:1px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;margin:6px 0;cursor:pointer;background:var(--muted)}
.opt input{margin-top:3px;flex:none}
.opt.sel{border-color:var(--primary);background:var(--accent)}
.blankrow{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.blankrow label{font-size:.82rem;color:var(--muted-fg)}
select,input[type=text],textarea{font:inherit;color:var(--fg);background:var(--muted);
  border:1px solid var(--border);border-radius:8px;padding:9px;width:100%}
textarea{min-height:120px}
.pips{display:flex;gap:3px;flex-wrap:wrap;margin:10px 0 2px}
.pip{width:14px;height:6px;border-radius:3px;background:var(--muted);border:1px solid var(--border)}
.pip.done{background:var(--primary);border-color:var(--primary)}
.pip.cur{outline:2px solid var(--primary);outline-offset:1px}
/* marking */
.mk{border-left:4px solid var(--border);padding-left:10px;margin:14px 0}
.mk.right{border-color:var(--ok)}.mk.wrong{border-color:var(--danger)}
.mk .you{color:var(--muted-fg);font-size:.9rem}
.mk .keyline{color:var(--ok);font-weight:600}
.mk .marks{font-size:.8rem;color:var(--muted-fg)}
.steps label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.refq{font-size:.85rem;color:var(--muted-fg);margin:8px 0 2px;padding:8px 10px;background:var(--muted);border-radius:8px}
.refq.slide{padding:6px}
.slideimg{max-width:100%;background:#fff;border-radius:6px;display:block;margin:0 0 4px}
.keyrows{margin:6px 0}
.krow{font-size:.85rem;padding:3px 0;border-bottom:1px dashed var(--border)}
.krow b{color:var(--ok);font-weight:600}
.krow.kok{opacity:.55}
.kyou{color:var(--danger);font-size:.78rem}
.refsrc{font-size:.74rem;color:var(--muted-fg);opacity:.8}
.vidrow{font-size:.86rem;margin:6px 0}
.vidrow a{font-weight:600}
.askai{padding:3px 10px;font-size:.76rem;margin-top:6px}
.score-hero{font-size:2.2rem;font-weight:800;text-align:center;margin:.3rem 0 0}
.score-sub{text-align:center;color:var(--muted-fg);margin:0 0 10px}
/* chart */
.spark{width:100%;height:84px;display:block}
.hist{font-size:.82rem;color:var(--muted-fg)}
.hist td{padding:2px 8px 2px 0}
/* chain warmup */
.chain{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.bead{background:var(--accent);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:.9rem}
.bead.blank{border-style:dashed;color:var(--warn);text-align:center}
.verb{color:var(--muted-fg);font-size:.78rem;padding:0 12px}
.note{border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;
  padding:8px 10px;font-size:.84rem;color:var(--muted-fg);margin:10px 0}
.src{font-size:.75rem;color:var(--muted-fg);margin-top:6px}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--border);
  border-radius:var(--radius);max-width:640px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgb(0 0 0 / .6)}
h3{margin:14px 0 4px;font-size:.95rem}
.footbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
  border-top:1px solid var(--border);padding:10px 14px;display:none;gap:8px;z-index:5}
.footbar.on{display:flex}
.footbar .btn{flex:1}
a{color:var(--primary)}
</style>
</head>

":"Tells liver to increase blood sugar levels"},{"left":"Vasopressin","right":"Promotes Na+ retention"}],"vid":{"id":"5Hq4eoqsVbk","t":"Control of Hormone Release | Endocrine System","d":"3:11"},"ref":{"t":"3. Which of the following hormones lead to a change in blood sugar levels and how? 1. Growth hormone 2. Insulin 3. Cortisol 4. Parathyroid hormone 5. Epinephrine 6. Glucagon","src":"ENDOCRINE 2 learning page"}},{"id":"qcd3438ebac","quiz":"211007","sys":"endo","pts":5,"q":"Match each item with its correct partner.","imgs":[],"qh":"<p>Match each item with its correct partner.</p>","qt":"Match each item with its correct partner.","type":"match","pairs":[{"left":"Follicle Stimulating Hormone","right":"causes the gonads to release sex hormones"},{"left":"Lutenizing Hormone","right":"maintains the endometrium in case there's a baby"},{"left":"Prolactin","right":"Promotes milk production"},{"left":"Angiotensin","right":"increases Peripheral Arterial Pressure"},{"left":"Calcitonin","right":"Reduces serum Ca2+ levels"}],"vid":{"id":"5Hq4eoqsVbk","t":"Control of Hormone Release | Endocrine System","d":"3:11"},"ref":{"src":"2026 Endocrine System 1 deck · slide 16","slide":"2026-Endocrine-System-1-16.jpg"}},{"id":"qae4dc1954a","quiz":"211007","sys":"endo","pts":6,"q":"Match each item with its correct partner.","imgs":[],"qh":"<p>Match each item with its correct partner.</p>","qt":"Match each item with its correct partner.","type":"match","pairs":[{"left":"Leptin","right":"Tells the brain not to be hungry anymore"},{"left":"Adiponectin","right":"promotes fat metabolism"},{"left":"Oxytocin","right":"The love hormone"},{"left":"Aldosterone","right":"Tells the kidneys to reabsorb H2O"},{"left":"Thyroxine","right":"Regulates Basal Metabolic Rate"},{"left":"Epinephrine, Norepinephrine","right":"Mediate the sympathetic NS response"}],"vid":{"id":"n9S_EkxbZSA","t":"Sympathetic versus Parasympathetic Nervous System | Nervous System","d":"9:19"},"ref":{"src":"2026 Endocrine 2 Thyroid, Adrenal, etc. deck · slide 21","slide":"2026-Endocrine-2-Thyroid-Adrenal-etc-21.jpg"}},{"id":"q3eff1aa29d","quiz":"211018","sys":"endo","pts":2,"q":"The pancreas has both endocrine and exocrine functions. The acinar cells in the pancreas produce the pancreatic juice rich in enzymes and bicarbonates while the islets of Langerhans cells produce hormones. Name the hypoglycaemic hormone and the hyperglycaemic hormone.","imgs":[],"qh":"<p>The pancreas has both endocrine and exocrine functions. The acinar cells in the pancreas produce the pancreatic juice rich in enzymes and bicarbonates while the islets of Langerhans cells produce hormones. Name the hypoglycaemic hormone and the hyperglycaemic hormone.</p>","qt":"The pancreas has both endocrine and exocrine functions. The acinar cells in the pancreas produce the pancreatic juice rich in enzymes and bicarbonates while the islets of Langerhans cells produce hormones. Name the hypoglycaemic hormone and the hyperglycaemic hormone.","type":"essay","saq":{"steps":["Hypoglycaemic hormone (LOWERS blood glucose) = insulin, from the beta cells of the islets of Langerhans.","Hyperglycaemic hormone (RAISES blood glucose) = glucagon, from the alpha cells of the islets."],"src":"Model answer is the tool’s · from Endocrine 2 deck"},"vid":{"id":"2JNrEnUWX4s","t":"Hypothalamic Pituitary Hormones","d":"28:08"},"ref":{"src":"2026 Endocrine 2 Thyroid, Adrenal, etc. deck · slide 23","slide":"2026-Endocrine-2-Thyroid-Adrenal-etc-23.jpg"}},{"id":"qa7fa49e68f","quiz":"211018","sys":"endo","pts":1,"q":"What is the normal fasting blood glucose level (mmol/L)?","imgs":[],"qh":"<p>What is the normal fasting blood glucose level (mmol/L)?</p>","qt":"What is the normal fasting blood glucose level (mmol/L)?","type":"essay","saq":{"steps":["About 4–6 mmol/L when fasting."],"src":"Model answer is the tool’s · from Endocrine 2 / blood sugar quiz"},"ref":{"t":"We will also study two major regulatory processes namely: blood calcium regulation (involving bone cells and the thyroid and parathyroid) blood glucose levels (involving the pancreatic alpha and beta cells, but also the pituitary (GH), thyroid (thyroxine) and adrenal glands (cortisol and epinephrine).","src":"ENDOCRINE 2 learning page"}},{"id":"q2bb9e1f8d4","quiz":"211018","sys":"endo","pts":1,"q":"What is the stimulus for the release of insulin?","imgs":[],"qh":"<p>What is the stimulus for the release of insulin?</p>","qt":"What is the stimulus for the release of insulin?","type":"essay","saq":{"steps":["Rising blood glucose (e.g. after a meal) — a humoral stimulus acting directly on the beta cells."],"src":"Model answer is the tool’s · from Endocrine 2 deck"},"ref":{"src":"2026 Endocrine 2 Thyroid, Adrenal, etc. deck · slide 30","slide":"2026-Endocrine-2-Thyroid-Adrenal-etc-30.jpg"}},{"id":"q467ea923ca","quiz":"211018","sys":"endo","pts":5,"q":"Explain how the body maintains the blood glucose levels within the normal range. (You may wish to refer to figure 16.18 “Regulation of blood glucose levels by insulin and glucagon from the Pancreas”, in your Human Anatomy & Physiology textbook by Marieb).","imgs":[],"qh":"<p>Explain how the body maintains the blood glucose levels within the normal range.</p> <p>(You may wish to refer to figure 16.18 “Regulation of blood glucose levels by insulin and glucagon from the Pancreas”, in your Human Anatomy &amp; Physiology textbook by Marieb).</p>","qt":"Explain how the body maintains the blood glucose levels within the normal range. (You may wish to refer to figure 16.18 “Regulation of blood glucose levels by insulin and glucagon from the Pancreas”, in your Human Anatomy & Physiology textbook by Marieb).","type":"essay","saq":{"steps":["Glucose rises → beta cells release insulin.","Insulin drives uptake into muscle and adipose tissue and glycogen storage in the liver → glucose falls.","Glucose falls → alpha cells release glucagon.","Glucagon makes the liver break down glycogen (glycogenolysis) and build new glucose (gluconeogenesis) → glucose rises.","Two opposing hormones in a negative-feedback loop hold glucose at the set point."],"src":"Model answer is the tool’s · from Endocrine 2 deck, fig 16.18"},"vid":{"id":"jpnNc03cqU0","t":"Muscle Tissue | Muscular System","d":"3:47"},"ref":{"src":"2026 Endocrine 2 Thyroid, Adrenal, etc. deck · slide 30","slide":"2026-Endocrine-2-Thyroid-Adrenal-etc-30.jpg"}},{"id":"q4859dabebf","quiz":"211018","sys":"endo","pts":3,"q":"Think of all the target organs where insulin acts. Make a list of the actions of insulin on the main target organs skeletal muscles, liver and adipose tissue.","imgs":[],"qh":"<p>Think of all the target organs where insulin acts. Make a list of the actions of insulin on the main target organs skeletal muscles, liver and adipose tissue.</p>","qt":"Think of all the target organs where insulin acts. Make a list of the actions of insulin on the main target organs skeletal muscles, liver and adipose tissue.","type":"essay","saq":{"steps":["Skeletal muscle: takes glucose up, stores it as glycogen.","Liver: glycogenesis up, gluconeogenesis suppressed.","Adipose tissue: glucose uptake, converted to and stored as fat."],"src":"Model answer is the tool’s · from Endocrine 2 deck"},"vid":{"id":"jpnNc03cqU0","t":"Muscle Tissue | Muscular System","d":"3:47"},"ref":{"src":"2026 Endocrine 2 Thyroid, Adrenal, etc. deck · slide 27","slide":"2026-Endocrine-2-Thyroid-Adrenal-etc-27.jpg"}},{"id":"q742ff3b771","quiz":"211018","sys":"endo","pts":4,"q":"Describe the signs and symptoms of diabetes mellitus and explain the underlying mechanisms of these symptoms. (You may wish to refer to table 16.4 “Symptoms of insulin deficit (Diabetes Mellitus)”, in your Human Anatomy & Physiology textbook by Marieb).","imgs":[],"qh":"<p>Describe the signs and symptoms of diabetes mellitus and explain the underlying mechanisms of these symptoms.</p> <p>(You may wish to refer to table 16.4 “Symptoms of insulin deficit (Diabetes Mellitus)”, in your Human Anatomy &amp; Physiology textbook by Marieb).</p>","qt":"Describe the signs and symptoms of diabetes mellitus and explain the underlying mechanisms of these symptoms. (You may wish to refer to table 16.4 “Symptoms of insulin deficit (Diabetes Mellitus)”, in your Human Anatomy & Physiology textbook by Marieb).","type":"essay","saq":{"steps":["Polyuria — glucose spills into urine and drags water with it (osmotic diuresis).","Polydipsia — the water loss dehydrates, driving thirst.","Polyphagia — cells cannot take glucose in, so they signal starvation.","Weight loss and fatigue — fat and protein are broken down for fuel instead."],"src":"Model answer is the tool’s · from Endocrine 2 deck, table 16.4"},"vid":{"id":"r-sDGEswYQY","t":"Diabetes Mellitus: Type 1 vs Type 2","d":"45:24"},"ref":{"src":"2026 Endocrine 2 Thyroid, Adrenal, etc. deck · slide 31","slide":"2026-Endocrine-2-Thyroid-Adrenal-etc-31.jpg"}},{"id":"qd9a9c94dff","quiz":"211018","sys":"endo","pts":3,"q":"Glucagon hormone is released when the blood glucose levels start to fall. (Think of times you have skipped a meal and the hormone that helped your tissues from being starved of glucose). How does this hormone increase blood glucose?","imgs":[],"qh":"<p>Glucagon hormone is released when the blood glucose levels start to fall. (Think of times you have skipped a meal and the hormone that helped your tissues from being starved of glucose). How does this hormone increase blood glucose?</p>","qt":"Glucagon hormone is released when the blood glucose levels start to fall. (Think of times you have skipped a meal and the hormone that helped your tissues from being starved of glucose). How does this hormone increase blood glucose?","type":"essay","saq":{"steps":["Falling glucose → alpha cells of the islets release glucagon.","Glucagon acts on the LIVER: glycogenolysis + gluconeogenesis.","Glucose is released into the blood and the level rises back to normal."],"src":"Model answer is the tool’s · from Endocrine 2 deck"},"vid":{"id": orm the cranium are all joints given different functional names. What are these names, and what characteristics distinguish one from another? A synovial joint Fibrous joint- e.g. sutures in skull Cartilaginous joints between vertebrae","type":"essay","saq":{"steps":["Elbow — synovial joint, functionally a diarthrosis (freely movable hinge).","Between vertebrae — cartilaginous joints, functionally amphiarthroses (slightly movable).","Cranium — sutures, fibrous joints, functionally synarthroses (immovable)."],"src":"Model answer is the tool’s · from MS1 deck (joint classification)"},"vid":{"id":"JO_N1apvidE","t":"Synovial Joints","d":"10:53"}},{"id":"qc8fdf0daf5","quiz":"211033","sys":"ms","pts":5,"q":"1. What does the term “itis” mean? and the prefix “art”? 2. Define arthritis. 3. Describe the type of arthritis common in the elderly. 4. Explain how arthritis would affect joint mobility. 5. Explain the pain and swelling seen in arthritis. Joint with smooth cartilage removed - exposed highly vascular bone tissue beneath it An inflamed joint with cartilage loss, crystals, exposed bone, & bone spurs.","imgs":["HS2IMG-8938857.png"],"qh":"<p>1. What does the term “itis” mean? and the prefix “art”?</p> <p>2. Define arthritis.</p> <p>3. Describe the type of arthritis common in the elderly.</p> <p>4. Explain how arthritis would affect joint mobility.</p> <p>5. Explain the pain and swelling seen in arthritis.</p> <div class=\"tbl\"><div class=\"tr\"><div class=\"td\">Joint with smooth cartilage removed - exposed highly vascular bone tissue beneath it [[IMG:HS2IMG-8938857.png]]</div></div></div>","qt":"1. What does the term “itis” mean? and the prefix “art”? 2. Define arthritis. 3. Describe the type of arthritis common in the elderly. 4. Explain how arthritis would affect joint mobility. 5. Explain the pain and swelling seen in arthritis. Joint with smooth cartilage removed - exposed highly vascular bone tissue beneath it","type":"essay","saq":{"steps":["\"-itis\" = inflammation; \"arthr-\" = joint.","Arthritis = inflammation of a joint (pain, swelling, stiffness).","Common in the elderly: osteoarthritis — wear-and-tear erosion of articular cartilage until bone rubs on bone.","Mobility: cartilage loss, bone-on-bone grinding and bone spurs make the joint stiff and painful to move, so the range of motion shrinks.","Pain and swelling: the inflamed synovial membrane releases more fluid and inflammatory mediators into the joint (swelling, warmth) and irritates pain receptors; exposed bone has no cartilage to cushion it."],"src":"Model answer is the tool’s · from MS1 deck / 2024 joints case answers"},"vid":{"id":"JO_N1apvidE","t":"Synovial Joints","d":"10:53"},"ref":{"t":"Imbalances like osteo- and rheumatoid arthritis affecting joints Both lead to the destruction of articular cartilage, inflammation, pain, and loss of function. Osteoarthritis- mostly seen in the elderly - wear and tear","src":"MS1 learning page"}},{"id":"q072a4801e5","quiz":"211037","sys":"ms","pts":16,"q":"Select the correct muscle name for each of the labelled structures","imgs":["HS2IMG-4720419.png"],"qh":"<p>[[IMG:HS2IMG-4720419.png]]</p> <p>Select the correct muscle name for each of the labelled structures</p>","qt":"Select the correct muscle name for each of the labelled structures","type":"match","pairs":[{"left":"A","right":"Deltoid"},{"left":"B","right":"Pectoralis (Major)"},{"left":"C","right":"Biceps Brachii"},{"left":"D","right":"Rectus Abdominus"},{"left":"E","right":"Finger Flexors"},{"left":"F","right":"Obliques"},{"left":"G","right":"Quadriceps (4 muscles)"},{"left":"H","right":"Tibialis Anterior"},{"left":"J","right":"Trapezius"},{"left":"K","right":"Triceps Brachii"},{"left":"L","right":"Latissimus Dorsi"},{"left":"M","right":"Finger Extensors"},{"left":"N","right":"Gluteus Maximus"},{"left":"O","right":"Hamstrings"},{"left":"P","right":"Gastrocnemius"},{"left":"Q","right":"Soleus"}],"vid":{"id":"QJVqTf_rNtk","t":"Biceps Brachii | Muscle Anatomy","d":"8:50"}} 3","sys":"ns","pts":1,"q":"Which of the following cell types is NOT part of the neuroglia in the central nervous system?","imgs":[],"qh":"<p>Which of the following cell types is NOT part of the neuroglia in the central nervous system?</p>","qt":"Which of the following cell types is NOT part of the neuroglia in the central nervous system?","type":"mcq","opts":["Microglia","Astrocyte","Schwann cell","Oligodendrocyte"],"key":["Schwann cell"],"ref":{"src":"2026 NS1 deck · slide 14","slide":"2026-NS1-14.jpg"}},{"id":"q66cc2eee82","quiz":"211093","sys":"ns","pts":1,"q":"Which option gives the most accurate description. Cerebrospinal fluid is produced in the ....... which are modified ependymal cells.","imgs":[],"qh":"<p>Which option gives the most accurate description. Cerebrospinal fluid is produced in the ....... which are modified ependymal cells.</p>","qt":"Which option gives the most accurate description. Cerebrospinal fluid is produced in the....... which are modified ependymal cells.","type":"mcq","opts":["ventricles","apertures","arachnoidal villi","choroid plexuses"],"key":["choroid plexuses"],"ref":{"t":"CSF production and circulation (filtered from blood at choroid plexuses in 4 ventricles, circulated by beating cilia of ependymal cells in cavities in brain and spinal cord, leave inner space through 3 apertures in 4th ventricle to go to sub-arachnoidal space, reabsorbed into dural sinuses by arachnoidal villi).","src":"NS2 learning page"}},{"id":"q685e613285","quiz":"211093","sys":"ns","pts":10,"q":"Telano & Baker, (2022, p 1) state about CSF: \"In the adult population, its secretion varies between individuals, usually ranging from 400 to 600 ml per day. The constant secretion of CSF contributes to complete CSF renewal four to five times per 24-hour period in the average young adult. The reduction of CSF turnover may contribute to the accumulation of metabolites seen in aging and neurodegenerative diseases\". CSF production is via a network of modified ependymal cells known as the choroid plexus (CP). The CP is a highly specialized, simple, cuboidal epithelium continuous with ependymal cells lining the ventricles of the brain. This simple cuboidal epithelium surrounds clusters of fenestrated capillaries allowing for the filtration of plasma. CP cells have dense microvilli present on their apical surface. They are interconnected via tight junctions, creating a blood-CSF barrier that helps control the composition of CSF. \"CSF assists the brain by providing protection, nourishment, and waste removal. CSF provides hydromechanical protection of the neuroaxis through two mechanisms. First, CSF acts as a shock absorber, cushioning the brain against the skull. Second, CSF allows the brain and spinal cord to become buoyant, reducing the effective weight of the brain from its normal 1,500 grams to a much lesser 50 grams.\" Lee (2022) argues that the aging brain tries to compensate for its loss of buoyancy by production of amyloid plaques. This strategy ultimately fails as the it leads to impaired CSF flow dynamics. On the website of the American Association of Neurological Surgeons (AANS), hydrocephalus in adult patients is described as a condition that does not cause an increase in pressure in the CSF spaces as in children but a shrinkage in the brain. In ex-vacuo hydrocephalus, as seen i n Alzheimer patients, the shrinking brain cause a vacuum that makes the ventricles enlarge. The extra CSF takes the place of the diminishing brain mass. Other reasons for adult onset hydrocephalus include head injuries, cranial surgery, hemorrhage, meningitis or a tumor. It is linked to a \"gradual blockage of the CSF-draining pathways in the brain. The ventricles enlarge to handle the increased volume of CSF, thus compressing the brain from within and eventually damaging or destroying the brain tissue\"(Adult-Onset Hydrocephalus – Symptoms, Diagnosis and Treatments, n.d.). To normalise the flow of the CSF, an extra opening can be made in the third ventricle so that the CSF can flow into the subarachnoidal space, shunts can be used to drain the fluid back into the blood or the blockage (like a tumor or blood clot) can be surgically removed . True or false According to this article the brain is floating in the CSF. [ Select ] The waste removal function of the CSF may become less efficient as we age because the CSF replacement happens slower. [ Select ] Choroid plexuses are modified cuboidal ependymal cells. [ Select ] The CSF is filtered from blood in sinusoidal capillaries that are surrounded by ependymal cells. [ Select ] The ependymal cells form an important part of the blood brain barrier. They prevent cells, glucose and proteins from filtering through. [ Select ] CSF is produced outside the brain and reabsorbed inside the brain. [ Select ] CSF is the same as lymph. [ Select ] CSF acts as a shock absorber and provides nutrition to the Peripheral Nervous System. [ Select ] Because the brain is buoyant in the CSF, gravitation affects it much less than it would have if it was not. [ Select ] There are three apertures in the fourth ventricle through which CSF leaves the inner space - two lateral and one medial. [ Select ] References Adult-onset Hydrocephalus – Symptoms, Diagnosis and Treatments . (n.d.). Retrieved September 12, 2022, from Lee, S. J. (2022). Alzheimer’s disease is a result of loss of full brain buoyancy. Medical Hypotheses , 164 , 110857. Telano , L. N., & Baker, S. (2022). Physiology, Cerebral Spinal Fluid. In StatPearls . StatPearls Publishing.","imgs":[],"qh":"<p>Telano &amp; Baker, (2022, p 1) state about CSF:</p> <p><em>&quot;In the adult population, its secretion varies between individuals, usually ranging from 400 to 600 ml per day. The constant secretion of CSF contributes to complete CSF renewal four to five times per 24-hour period in the average young adult. The reduction of CSF turnover may contribute to the accumulation of metabolites seen in aging and neurodegenerative diseases&quot;.</em></p> <p><em>CSF production is via a network of modified ependymal cells known as the choroid plexus (CP). The CP is a highly specialized, simple, cuboidal epithelium continuous with ependymal cells lining the ventricles of the brain. This simple cuboidal epithelium surrounds clusters of fenestrated capillaries allowing for the filtration of plasma. CP cells have dense microvilli present on their apical surface. They are interconnected via tight junctions, creating a blood-CSF barrier that helps control the composition of CSF.</em></p> <p><em>&quot;CSF assists the brain by providing protection, nourishment, and waste removal. CSF provides hydromechanical protection of the neuroaxis through two mechanisms. First, CSF acts as a shock absorber, cushioning the brain against the skull. Second, CSF allows the brain and spinal cord to become buoyant, reducing the effective weight of the brain from its normal 1,500 grams to a much lesser 50 grams.&quot;</em></p> <p><em>Lee (2022) argues that the aging brain tries to compensate for its loss of buoyancy by production of amyloid plaques. This strategy ultimately fails as the it leads to impaired CSF flow dynamics. </em></p> <p><em> On the website of the American Association of Neurological Surgeons (AANS), hydrocephalus in adult patients is described as a condition that does not cause an increase in pressure in the CSF spaces as in children but a shrinkage in the brain. </em><em>In ex-vacuo hydrocephalus, as seen i</em><em>n Alzheimer patients, the shrinking brain cause a vacuum that makes the ventricles enlarge. The extra CSF takes the place of the diminishing brain mass. Other reasons for adult onset hydrocephalus include head injuries, cranial surgery, hemorrhage, meningitis or a tumor. It is linked to a &quot;gradual blockage of the CSF-draining pathways in the brain. The ventricles enlarge to handle the increased volume of CSF, thus compressing the brain from within and eventually damaging or destroying the brain tissue&quot;(Adult-Onset Hydrocephalus – Symptoms, Diagnosis and Treatments, n.d.). To normalise the flow of the CSF, an extra opening can be made in the third ventricle so that the CSF can flow into the subarachnoidal space, shunts can be used to drain the fluid back into the blood or the blockage (like a tumor or blood clot) can be surgically </em><em>removed</em><em>.</em></p> <p>True or false</p> <ol><li>According to this article the brain is floating in the CSF. [[BLANK:0]]</li> <li>The waste removal function of the CSF may become less efficient as we age because the CSF replacement happens slower. [[BLANK:1]]</li> <li>Choroid plexuses are modified cuboidal ependymal cells. [[BLANK:2]]</li> <li>The CSF is filtered from blood in sinusoidal capillaries that are surrounded by ependymal cells. [[BLANK:3]]</li> <li>The ependymal cells form an important part of the blood brain barrier. They prevent cells, glucose and proteins from filtering through. [[BLANK:4]]</li> <li>CSF is produced outside the brain and reabsorbed inside the brain. [[BLANK:5]]</li> <li>CSF is the same as lymph. [[BLANK:6]]</li> <li>CSF acts as a shock absorber and provides nutrition to the Peripheral Nervous System. [[BLANK:7]]</li> <li>Because the brain is buoyant in the CSF, gravitation affects it much less than it would have if it was not. [[BLANK:8]]</li> <li>There are three apertures in the fourth ventricle through which CSF leaves the inner space - two lateral and one medial. [[BLANK:9]]</li></ol> <p><strong>References</strong></p> <p><em>Adult-onset Hydrocephalus – Symptoms, Diagnosis and Treatments</em>. (n.d.). Retrieved September 12, 2022, from</p> <p>Lee, S. J. (2022). Alzheimer’s disease is a result of loss of full brain buoyancy. <em>Medical Hypotheses</em>, <em>164</em>, 110857.</p> <p>Telano, L. N., &amp; Baker, S. (2022). Physiology, Cerebral Spinal Fluid. In <em>StatPearls</em>. StatPearls Publishing.</p>","qt":"Telano & Baker, (2022, p 1) state about CSF: \"In the adult population, its secretion varies between individuals, usually ranging from 400 to 600 ml per day. The constant secretion of CSF contributes to complete CSF renewal four to five times per 24-hour period in the average young adult. The reduction of CSF turnover may contribute to the accumulation of metabolites seen in aging and neurodegenerative diseases\". CSF production is via a network of modified ependymal cells known as the choroid plexus (CP). The CP is a highly specialized, simple, cuboidal epithelium continuous with ependymal cells lining the ventricles of the brain. This simple cuboidal epithelium surrounds clusters of fenestrated capillaries allowing for the filtration of plasma. CP cells have dense microvilli present on their apical surface. They are interconnected via tight junctions, creating a blood-CSF barrier that helps control the composition of CSF. \"CSF assists the brain by providing protection, nourishment, and waste removal. CSF provides hydromechanical protection of the neuroaxis through two mechanisms. First, CSF acts as a shock absorber, cushioning the brain against the skull. Second, CSF allows the brain and spinal cord to become buoyant, reducing the effective weight of the brain from its normal 1,500 grams to a much lesser 50 grams.\" Lee (2022) argues that the aging brain tries to compensate for its loss of buoyancy by production of amyloid plaques. This strategy ultimately fails as the it leads to impaired CSF flow dynamics. On the website of the American Association of Neurological Surgeons (AANS), hydrocephalus in adult patients is described as a condition that does not cause an increase in pressure in the CSF spaces as in children but a shrinkage in the brain. In ex-vacuo hydrocephalus, as seen in Alzheimer patients, the shrinking brain cause a vacuum that makes the ventricles enlarge. The extra CSF takes the place of the diminishing brain mass. Other reasons for adult onset hydrocephalus include head injuries, cranial surgery, hemorrhage, meningitis or a tumor. It is linked to a \"gradual blockage of the CSF-draining pathways in the brain. The ventricles enlarge to handle the increased volume of CSF, thus compressing the brain from within and eventually damaging or destroying the brain tissue\"(Adult-Onset Hydrocephalus – Symptoms, Diagnosis and Treatments, n.d.). To normalise the flow of the CSF, an extra opening can be made in the third ventricle so that the CSF can flow into the subarachnoidal space, shunts can be used to drain the fluid back into the blood or the blockage (like a tumor or blood clot) can be surgically removed. True or false According to this article the brain is floating in the CSF. ____ The waste removal function of the CSF may become less efficient as we age because the CSF replacement happens slower. ____ Choroid plexuses are modified cuboidal ependymal cells. ____ The CSF is filtered from blood in sinusoidal capillaries that are surrounded by ependymal cells. ____ The ependymal cells form an important part of the blood brain barrier. They prevent cells, glucose and proteins from filtering through. ____ CSF is produced outside the brain and reabsorbed inside the brain. ____ CSF is the same as lymph. ____ CSF acts as a shock absorber and provides nutrition to the Peripheral Nervous System. ____ Because the brain is buoyant in the CSF, gravitation affects it much less than it would have if it was not. ____ There are three apertures in the fourth ventricle through which CSF leaves the inner space - two lateral and one medial. ____ References Adult-onset Hydrocephalus – Symptoms, Diagnosis and Treatments. (n.d.). Retrieved September 12, 2022, from Lee, S. J. (2022). Alzheimer’s disease is a result of loss of full brain buoyancy. Medical Hypotheses, 164, 110857. Telano, L. N., & Baker, S. (2022). Physiology, Cerebral Spinal Fluid. In StatPearls. StatPearls Publishing.","type":"cloze","bk":"dd","blanks":[{"label":"Answer 1:","options":["FALSE","TRUE"],"correct":"TRUE","ctx":"…the brain is floating in the CSF."},{"label":"Answer 2:","options":["TRUE","FALSE"],"correct":"TRUE","ctx":"…age because the CSF replacement happens slower."},{"label":"Answer 3:","options":["TRUE","FALSE"],"correct":"TRUE","ctx":"…Choroid plexuses are modified cuboidal ependymal cells."},{"label":"Answer 4:","options":["TRUE","FALSE"],"correct":"FALSE","ctx":"…capillaries that are surrounded by ependymal cells."},{"label":"Answer 5:","options":["TRUE","FALSE"],"correct":"FALSE","ctx":"…cells, glucose and proteins from filtering through."},{"label":"Answer 6:","options":["FALSE","TRUE"],"correct":"FALSE","ctx":"…the brain and reabsorbed inside the brain."},{"label":"Answer 7:","options":["FALSE","TRUE"],"correct":"FALSE","ctx":"CSF is the same as lymph."},{"label":"Answer 8:","options":["TRUE","FALSE"],"correct":"FALSE","ctx":"…provides nutrition to the Peripheral Nervous System."},{"label":"Answer 9:","options":["TRUE","FALSE"],"correct":"TRUE","ctx":"…it would have if it was not."},{"label":"Answer 10:","options":["FALSE","TRUE"],"correct":"TRUE","ctx":"…space - two lateral and one medial."}],"vid":{"id":"eakL-xHwWL4","t":"Blood Brain Barrier","d":"8:31"},"ref":{"t":"CSF production and circulation (filtered from blood at choroid plexuses in 4 ventricles, circulated by beating cilia of ependymal cells in cavities in brain and spinal cord, leave inner space through 3 apertures in 4th ventricle to go to sub-arachnoidal space, reabsorbed into dural sinuses by arachnoidal villi).","src":"NS2 learning page"}},{"id":"q57602a50d7","quiz":"211093","sys":"ns","pts":1,"q":"The three meninges that surround the brain are from deep to superficial the:","imgs":[],"qh":"<p>The three meninges that surround the brain are from deep to superficial the:</p>","qt":"The three meninges that surround the brain are from deep to superficial the:","type":"mcq","opts":["the pia mater, dura mater, arachnoid mater,","the pia mater, arachnoid mater, dura mater","the dura mater, pia mater, arachnoid ma ]]</strong></p> <p><strong>1. Hematoma formation</strong></p> <ul><li>§ Torn blood vessels - hemorrhage</li> <li>§ A mass of clotted blood (hematoma) forms at the fracture site</li> <li>§ Site becomes swollen, painful, and inflamed</li></ul> <p><strong>2. Fibrocartilaginous callus forms</strong></p> <ul><li>§ Granulation tissue (soft callus) forms a few days after the fracture</li> <li>§ Capillaries grow into the tissue and phagocytic cells begin cleaning debris</li></ul> <p>The fibrocartilaginous callus forms when:</p> <ul><li>§ Osteoblasts and fibroblasts migrate to the fracture and begin reconstructing the bone</li> <li>§ Fibroblasts secrete collagen fibers that connect broken bone ends</li> <li>§ Osteoblasts begin forming spongy bone</li> <li>§ Osteoblasts secrete an externally bulging cartilaginous matrix that later calcifies</li></ul> <p><strong>3. Bony callus formation</strong></p> <ul><li>§ New bone trabeculae appear in the fibrocartilaginous callus</li> <li>§ Fibrocartilaginous callus converts into a bony (hard) callus</li> <li>§ Bone callus begins 3-4 weeks after injury, and continues until firm union is formed 2-3 months later</li></ul> <p><strong>4. Bone remodeling</strong></p> <ul><li>§ Excess material on the bone shaft exterior and in the medullary canal is removed</li> <li>§ Compact bone is laid down to reconstruct shaft walls</li></ul> <p>A hematoma after a fracture is replaced by a callus made of ___________ which in turn is replaced by a callus made of ____________</p>","qt":"Bone Fractures (Breaks) Stages in the Healing of a Bone Fracture 1. Hematoma formation § Torn blood vessels - hemorrhage § A mass of clotted blood (hematoma) forms at the fracture site § Site becomes swollen, painful, and inflamed 2. Fibrocartilaginous callus forms § Granulation tissue (soft callus) forms a few days after the fracture § Capillaries grow into the tissue and phagocytic cells begin cleaning debris The fibrocartilaginous callus forms when: § Osteoblasts and fibrob const CLOSED = DATA.questions.filter(q=>!q.saq);
function pickN(pool, n, excl){
  const fresh = pool.filter(q=>!excl.has(q.id));
  /* Least-seen first: rank = times dealt, so nothing repeats an (n+1)th time
     until the whole pool has been dealt n times. Misses jump the queue (-2),
     Math.random() only breaks ties among equally-seen questions. */
  const rank = q => (S.miss[q.id]?-2:0) + (S.seen[q.id]||0) + Math.random();
  return fresh.sort((a,b)=>rank(a)-rank(b)).slice(0,n);
}
function dealStratified(n){
  const out=[], excl=new Set();
  /* shares are DERIVED from the bank — her revealed question distribution —
     never typed. Announced emphasis does not get a vote. */
  const share = {};
  for(const q of CLOSED) share[q.sys]=(share[q.sys]||0)+1/CLOSED.length;
  for(const sys of ['ms','ns','endo','mixed']){
    const want=Math.round(n*(share[sys]||0));
    for(const q of pickN(CLOSED.filter(x=>x.sys===sys), want, excl)){ out.push(q); excl.add(q.id); }
  }
  while(out.length<n){
    const q=pickN(CLOSED, 1, excl)[0]; if(!q)break; out.push(q); excl.add(q.id);
  }
  return shuffle(out).slice(0,n);
}
function dealMini(){ return dealStratified(12) }
function dealFull(){
  const closed = dealStratified(40);
  const c7 = DATA.case7.questions[(S.scores.filter(s=>s.mode==='full').length) % DATA.case7.questions.length];
  const essays = DATA.questions.filter(q=>q.saq);
  const other = essays.length? essays[Math.random()*essays.length|0] : null;
  const saqs=[mkCaseQ(c7)]; if(other) saqs.push(other);
  return closed.concat(saqs);
}
function mkCaseQ(cq){
  return { id:'c7-'+cq.q.slice(0,24).replace(/\W/g,''), quiz:'case7', sys:'ms', type:'essay',
    pts:cq.marks, q:cq.q, imgs:[], saq:{steps:cq.steps, src:'Case study 7 — model answer is the tool’s'},
    scenario: DATA.case7.scenario };
}
function dealMisses(){
  let ids = Object.keys(S.miss).filter(id=>S.miss[id]>=2);
  if(ids.length<4) ids = Object.keys(S.miss);
  const pool = CLOSED.filter(q=>ids.includes(q.id));
  return shuffle(pool).slice(0,12);
}

      if(sel.textContent!==answer){const right=[...document.querySelectorAll('.opt span')].find(s=>s.textContent===answer);right.closest('.opt').style.borderColor='var(--ok)';}
    } else renderQ()};
  $('#wuSkip').onclick=renderQ;
}
let timerIv=null;
function renderQ(){
  clearInterval(timerIv);
  const q=SIT.deck[SIT.i];
  const fb=$('#footbar');fb.classList.add('on');
  fb.innerHTML=`<button class="btn" id="prevB" ${SIT.i? '':'disabled'}>← Back</button>
    <button class="btn primary" id="nextB">${SIT.i===SIT.deck.length-1?'Finish & mark':'Next →'}</button>`;
  $('#prevB').onclick=()=>{saveAns();SIT.i--;renderQ()};
  setTimeout(()=>{const x=$('#exitB');if(x)x.onclick=()=>{if(confirm('Abandon this mock test? Nothing is saved.')){clearInterval(timerIv);home();window.scrollTo(0,0)}}},0);
  $('#nextB').onclick=()=>{saveAns();SIT.i===SIT.deck.length-1?mark():(SIT.i++,renderQ())};
  const a=SIT.ans[q.id];
  const imgTag=f=>`<img class="qimg" src="img/${f}" alt="question figure" loading="lazy">`;
  /* the blank widget, inline where Canvas put it: her dropdown stays a dropdown
     (choices shuffled per sitting), her typed blank stays typed */
  const widget=(b,i)=> q.bk==='dd'
    ? `<select class="inl" data-i="${i}" aria-label="blank ${i+1}"><option value="">— choose —</option>${shuffleStable(q.id+i,b.options).map(o=>`<option ${a&&a.pick&&a.pick[i]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`
    : `<input type="text" class="inl" data-i="${i}" style="width:${Math.min(26,Math.max(7,Math.max(...b.options.map(o=>o.length))+3))}ch" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type…" aria-label="blank ${i+1}" value="${a&&a.pick?esc(a.pick[i]||''):''}">`;
  /* structured stem: her paragraphs, lists and table rows, with [[IMG:…]] and
     [[BLANK:k]] markers resolved in place. Images the stem did not place still show
     below it, so no figure is ever lost. */
  const placed=new Set();
  let stemHTML=q.qh
    ? q.qh.replace(/\[\[IMG:([^\]]+)\]\]/g,(m,f)=>{placed.add(f);return imgTag(f)})
          .replace(/\[\[BLANK:(\d+)\]\]/g,(m,k)=>q.type==='cloze'&&q.blanks[+k]?widget(q.blanks[+k],+k):'____')
    : esc(q.q);
  const imgs=(q.imgs||[]).filter(f=>!placed.has(f)).map(imgTag).join('');
  const inlineBlanks=q.type==='cloze'&&q.qh&&/\[\[BLANK:\d+\]\]/.test(q.qh);
  let body='';
  if(q.type==='mcq'||q.type==='tf'||q.type==='multi'){
    const multi=q.type==='multi';
    body=q.opts.map((o,i)=>`<label class="opt ${a&&a.sel&&a.sel.includes(i)?'sel':''}">
      <input type="${multi?'checkbox':'radio'}" name="q" value="${i}" ${a&&a.sel&&a.sel.includes(i)?'checked':''}>
      <span>${esc(optLabel(q,o))}</span></label>`).join('');
    if(multi)body=`<div class="note">Tick every answer that applies — it may be just one.</div>`+body;
  } else if(q.type==='match'){
    const bank=shuffleStable(q.id,[...new Set(q.pairs.map(p=>p.right))]); // a right-hand item used twice is still ONE option
    body=q.pairs.map((p,i)=>`<div class="blankrow"><label>${esc(p.left)}</label>
      <select data-i="${i}"><option value="">— choose —</option>
      ${bank.map(r=>`<option ${a&&a.pick&&a.pick[i]===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div>`).join('');
  } else if(q.type==='cloze'){
    body=inlineBlanks
      ? `<div class="note">${q.bk==='dd'?'Pick from each dropdown in the text.':'Type into each blank in the text — spelling counts, capitals don’t.'}</div>`
      : q.blanks.map((b,i)=>`<div class="blankrow"><label>${esc(blankLabel(b,i))}${q.bk==='dd'?'':' (type it)'}</label>${widget(b,i)}</div>`).join('');
  } else if(q.type==='essay'){
    body=`${q.scenario?`<div class="note">${esc(q.scenario)}</div>`:''}
      <div class="note">Written question · ${q.pts} marks — write ${q.pts} numbered points, one causal step each. You mark yourself against the model at the end.</div>
      <textarea data-essay placeholder="1. …&#10;2. …">${a&&a.text?esc(a.text):''}</textarea>`;
  }
  $('#view').innerHTML=`<div class="card">
    <div class="qhead"><span class="n">Q${SIT.i+1}/${SIT.deck.length}</span>
      <span class="tag ${q.sys}">${q.sys}</span><span class="tag">${q.pts} mk</span>
      <span class="timer" id="timer"></span>
      <button class="btn ghost" id="exitB" title="abandon mock test" style="padding:2px 10px">✕</button></div>
    ${inlineBlanks?body:''}<div class="stem${q.qh?' rich':''}">${stemHTML}</div>${imgs}${inlineBlanks?'':body}
    <div class="pips">${SIT.deck.map((_,i)=>`<span class="pip ${SIT.ans[SIT.deck[i].id]?'done':''} ${i===SIT.i?'cur':''}"></span>`).join('')}</div>
  </div>`;
  document.querySelectorAll('.opt').forEach(o=>o.onclick=e=>{
    const inp=o.querySelector('input');
    if(inp.type==='radio'){document.querySelectorAll('.opt').forEach(x=>{x.classList.remove('sel');x.querySelector('input').checked=false});inp.checked=true;o.classList.add('sel')}
    else{if(e.target.tagName!=='INPUT')inp.checked=!inp.checked;o.classList.toggle('sel',inp.checked)}
  });
  if(SIT.timed){const t=$('#timer');const tick=()=>{const s=Math.max(0,(SIT.end-Date.now())/1000|0);
    t.textContent=`${s/60|0}:${String(s%60).padStart(2,'0')}`;t.classList.toggle('low',s<300);
    if(s<=0){clearInterval(timerIv);saveAns();mark()}};tick();timerIv=setInterval(tick,1000)}
}
function shuffleStable(seed,arr){
  let h=0;for(const c of String(seed))h=(h*31+c.charCodeAt(0))>>>0;
  return arr.map((v,i)=>({v,k:(h=(h*1103515245+12345)>>>0)})).sort((a,b)=>a.k-b.k).map(x=>x.v);
}
function saveAns(){
  const q=SIT.deck[SIT.i];
  if(q.type==='essay'){const t=document.querySelector('[data-essay]');if(t&&t.value.trim())SIT.ans[q.id]={text:t.value};return}
  if(q.type==='match'||q.type==='cloze'){
    const pick={};let any=false;
    document.querySelectorAll('[data-i]').forEach(el=>{if(el.value){pick[el.dataset.i]=el.value;any=true}});
    if(any)SIT.ans[q.id]={pick};return}
  const sel=[...document.querySelectorAll('.opt input:checked')].map(i=>+i.value);
  if(sel.length)SIT.ans[q.id]={sel};
}
/* ── marking ───────────────────────────────────────────────────────── */
function markQ(q,a){
  if(q.type==='essay')return null; // self-marked
  if(!a)return{got:0,tot:q.pts,detail:'no answer'};
  if(q.type==='mcq'||q.type==='tf'||q.type==='multi'){
    const chosen=(a.sel||[]).map(i=>q.opts[i]);
    const right=chosen.length===q.key.length&&q.key.every(k=>chosen.includes(k));
    return{got:right?q.pts:0,tot:q.pts,you:chosen.map(o=>optLabel(q,o)).join(' · ')}}
  if(q.type==='match'){
    let got=0;q.pairs.forEach((p,i)=>{if((a.pick||{})[i]===p.right)got++});
    return{got:got*q.pts/q.pairs.length,tot:q.pts,you:q.pairs.map((p,i)=>(a.pick||{})[i]||'—').join(' · ')}}
  if(q.type==='cloze'){
    let got=0;
    q.blanks.forEach((b,i)=>{if(blankOK(q,b,(a.pick||{})[i]))got++});
    return{got:got*q.pts/q.blanks.length,tot:q.pts,you:q.blanks.map((b,i)=>(a.pick||{})[i]||'—').join(' · ')}}
}
/* dropdown: only her marked option is right. Typed: every accepted spelling is. */
function blankOK(q,b,v){
  /* phones type curly quotes; a trailing full stop is not a wrong answer */
  const nrm=s=>String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().replace(/[.]+$/,'');
  const x=nrm(v);if(!x)return false;
  const also=(b.also||[]).some(o=>nrm(o)===x);
  return q.bk==='dd' ? (x===nrm(b.correct)||also) : (b.options.some(o=>nrm(o)===x)||also);
}
function blankLabel(b,i){return b.ctx?`${b.ctx} ___`:(b.label&&!/^Answer \d+:?$/.test(b.label)?b.label.replace(/:$/,''):`Blank ${i+1}`)}
function mark(){
  clearInterval(timerIv);$('#footbar').classList.remove('on');
  let got=0,tot=0;const rows=[];
  for(const q of SIT.deck){
    const r=markQ(q,SIT.ans[q.id]);
    S.seen[q.id]=(S.seen[q.id]||0)+1;
    if(r){got+=r.got;tot+=r.tot;
      if(r.got<r.tot)S.miss[q.id]=(S.miss[q.id]||0)+1;
      else if(S.miss[q.id])delete S.miss[q.id];
      rows.push({q,r})}
    else rows.push({q,r:null,saq:true});
  }
  SIT.auto={got,tot};
  const saqs=rows.filter(x=>x.saq);
  $('#view').innerHTML=`<div class="card">
    <div class="score-hero" id="hero"></div><div class="score-sub" id="heroSub"></div>
    ${saqs.length?`<div class="note">Tick each model step your written answer actually hit — the score updates as you go. Model answers are the tool’s, not Hannetjie’s.</div>`:''}
    ${rows.map(({q,r,saq},i)=>{
      if(saq){const a=SIT.ans[q.id];
        return `<div class="mk" id="mk${i}"><b>${esc(flatStem(q))}</b>
        ${a&&a.text?`<div class="you">You wrote:<br>${esc(a.text).replace(/\n/g,'<br>')}</div>`:'<div class="you">— no answer written —</div>'}
        <div class="steps">${q.saq.steps.map((s,si)=>`<label><input type="checkbox" data-saq="${i}" data-pt="${q.pts/q.saq.steps.length}"> <span>${esc(s)}</span></label>`).join('')}</div>
        <div class="src">${esc(q.saq.src)}</div></div>`}
      const cls=r.got>=r.tot?'right':'wrong';
      return `<div class="mk ${cls}"><b>${esc(flatStem(q)).slice(0,300)}</b>
        <div class="marks">${(+r.got.toFixed(1))}/${r.tot} mk · ${esc(DATA.quizzes.find(z=>z.id===q.quiz)?.name||q.quiz)}</div>
        ${q.type==='mcq'||q.type==='tf'||q.type==='multi'?(r.you?`<div class="you">You: ${esc(r.you)}</div>`:`<div class="you">${r.detail||''}</div>`):''}
        ${r.got<r.tot?`${keyHTML(q,SIT.ans[q.id])}${explainHTML(q)}`:''}</div>`}).join('')}
    ${weakSpotsHTML(rows)}
    <button class="btn primary wide" id="doneB">Save score & finish</button></div>`;
  const upd=()=>{
    let s=0;document.querySelectorAll('[data-saq]:checked').forEach(c=>s+=+c.dataset.pt);
    const saqTot=saqs.reduce((n,{q})=>n+q.pts,0);
    const g=got+s,t=tot+saqTot;
    $('#hero').textContent=`${+g.toFixed(1)} / ${t}`;
    $('#heroSub').textContent=`${Math.round(100*g/t)}% · ${SIT.label} · ${Math.round((Date.now()-SIT.t0)/60000)} min`;
    SIT.final={got:+g.toFixed(1),tot:t}};
  document.querySelectorAll('[data-saq]').forEach(c=>c.onchange=upd);upd();
  $('#doneB').onclick=()=>{
    S.scores.push({t:Date.now(),mode:SIT.mode,label:SIT.label,got:SIT.final.got,tot:SIT.final.tot});
    SV('scores',S.scores);SV('miss',S.miss);SV('seen',S.seen);home();window.scrollTo(0,0)};
  SV('miss',S.miss);SV('seen',S.seen);
  window.scrollTo(0,0);
}
/* the explain row: her material first, then the right-sized video, then Ask AI.
   Only on wrong answers, never during a sitting. */
function explainHTML(q){
  let h='';
  if(q.ref&&q.ref.slide)h+=`<div class="refq slide"><a href="img/slides/${q.ref.slide}" target="_blank" rel="noopener"><img class="slideimg" src="img/slides/${q.ref.slide}" alt="her slide" loading="lazy"></a><span class="refsrc">📖 ${esc(q.ref.src)} — tap to open full size</span></div>`;
  else if(q.ref)h+=`<div class="refq">📖 <i>“${esc(q.ref.t)}”</i><span class="refsrc"> — ${esc(q.ref.src)}</span></div>`;
  if(q.vid)h+=`<div class="vidrow">▶ <a href="https://www.youtube.com/watch?v=${q.vid.id}" target="_blank" rel="noopener">${esc(q.vid.t)}</a> <span class="refsrc">Dr Matt &amp; Dr Mike · ${esc(q.vid.d)}</span></div>`;
  h+=`<button class="btn ghost askai" data-ask="${q.id}">🤖 Copy for AI</button>`;
  return h;
}
function weakSpotsHTML(rows){
  const missed=rows.filter(x=>!x.saq&&x.r&&x.r.got<x.r.tot).map(x=>x.q);
  if(missed.length<3)return '';
  const vids=new Map();
  for(const q of missed) if(q.vid&&!vids.has(q.vid.id)) vids.set(q.vid.id,q.vid);
  if(!vids.size)return '';
  const bySys={};for(const q of missed)bySys[q.sys]=(bySys[q.sys]||0)+1;
  const worst=Object.entries(bySys).sort((a,b)=>b[1]-a[1])[0];
  return `<div class="note" style="border-left-color:var(--primary)">
    <b>Weak spots this mock test</b> — ${missed.length} missed, most in ${SYS[worst[0]]||worst[0]}.
    Watch these before your next sitting:
    ${[...vids.values()].slice(0,4).map(v=>`<div class="vidrow">▶ <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">${esc(v.t)}</a> <span class="refsrc">${esc(v.d)}</span></div>`).join('')}
    <div class="refsrc">Video matching is automatic from titles — a hypothesis, not a promise. Where a video and Hannetjie disagree, she wins.
    <a href="https://jeremyspm.github.io/hs2-videos.html" target="_blank" rel="noopener">All 148 by topic ↗</a></div></div>`;
}
/* readable key rendering: matching and cloze get one ROW per part, wrong parts
   annotated with what you picked — never a run-on paragraph */
function keyHTML(q,a){
  if(q.type==='match')return `<div class="keyrows">${q.pairs.map((p,i)=>{
    const yours=(a&&a.pick||{})[i];const wrong=yours&&yours!==p.right;
    return `<div class="krow ${yours===p.right?'kok':''}">${esc(p.left)} <b>→ ${esc(p.right)}</b>${wrong?` <span class="kyou">you: ${esc(yours)}</span>`:yours?'':' <span class="kyou">unanswered</span>'}</div>`}).join('')}</div>`;
  if(q.type==='cloze')return `<div class="keyrows">${q.blanks.map((b,i)=>{
    const yours=(a&&a.pick||{})[i];
    const right=blankOK(q,b,yours);
    const alt=q.bk==='fib'&&b.options.length>1?` <span class="refsrc">(also accepted: ${esc(b.options.filter(o=>o!==b.correct).join(', '))})</span>`:'';
    return `<div class="krow ${right?'kok':''}">${esc(blankLabel(b,i))} <b>→ ${esc(b.correct)}</b>${alt}${yours&&!right?` <span class="kyou">you: ${esc(yours)}</span>`:yours?'':' <span class="kyou">unanswered</span>'}</div>`}).join('')}</div>`;
  return `<div class="keyline">Key: ${esc(keyText(q))}</div>`;
}
function keyText(q){
  if(q.type==='match')return q.pairs.map(p=>`${p.left} → ${p.right}`).join(' · ');
  if(q.type==='cloze')return q.blanks.map(b=>b.correct).join(' · ');
  return (q.key||[]).map(o=>optLabel(q,o)).join(' · ');
}
/* bare-letter options carry their text from the stem's lettered list (build-time) */
function optLabel(q,o){return q.ol&&q.ol[o]?`${o}. ${q.ol[o]}`:o}
/* the flat stem carries Canvas's literal "[ Select ]" where each dropdown sat */
const flatStem=q=>q.qt||String(q.q||'').replace(/\[ Select \]/g,'____');
/* ── chrome ────────────────────────────────────────────────────────── */
$('#countdown').textContent=`${daysLeft()}d to Test 2`;
$('#themeBtn').onclick=()=>{const r=document.documentElement;
  const to=r.dataset.theme==='light'?'':'light';
  to?r.dataset.theme='light':delete r.dataset.theme;SV('theme',to)};
if(LS('theme')==='light')document.documentElement.dataset.theme='light';
$('#helpBtn').onclick=()=>{$('#help').innerHTML=`
  <h2 style="margin-top:0">What is this?</h2>
  <p>Every practice quiz Hannetjie posted for Module 2 (MS · NS · Endocrine), unlocked: sit them as

  <h3>Where the questions come from</h3>
  <p>${DATA.stats.n} questions captured from ${DATA.quizzes.length} of her own Canvas quizzes, answer keys

  <h3>What’s held out</h3>
  <p>${DATA.held.length} questions are excluded (image or format did not survive capture) — listed in the

  <h3>Your data</h3>
  <p>Scores and misses live in this browser only. Nothing is sent anywhere. Clearing site data wipes them.</p>
  <h3>For whoever maintains this</h3>
  <p>Built by <code>build.mjs</code> from <code>hs2-anki/m2/questions.json</code> (parsed Canvas captures).
  Rebuild: <code>node build.mjs</code>. Bank built ${DATA.built}. Multi-answer questions mark all-or-nothing;
  matching and dropdowns mark per part.</p>
  <button class="btn primary wide" onclick="this.closest('dialog').close()">Close</button>`;
  $('#help').showModal()};
document.addEventListener('click',e=>{
  if(e.target.dataset&&e.target.dataset.ask){

    const btn=e.target, done=ok=>{btn.textContent=ok?'Copied ✓ paste into any AI chat':'Copy blocked — long-press the text to copy';
      setTimeout(()=>btn.textContent='🤖 Copy for AI',3000)};

  if(e.target.id==='shareBtn'){

home();
</script>
